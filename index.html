<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Margin: spaced practice</title>
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#1F2D3D"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Margin"><link rel="icon" href="icon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="icon-180.png">
<style>
:root{--paper:#F5F8F6;--grid:#E1E9E5;--ink:#1F2D3D;--muted:#5D6B72;--blue:#2A5CAA;--red:#B83A2E;--green:#2E7A4E;--hl:#F6DC5C;--card:#FFFFFF;--line:#C9D4D0;color-scheme:light;
 --serif:Charter,"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;--sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;}
@media (prefers-color-scheme:dark){:root{--paper:#162029;--grid:#1F2C36;--ink:#E4EBEE;--muted:#98A8B1;--blue:#86ABEB;--red:#EC7B6A;--green:#72C48F;--hl:#8A7520;--card:#1C2833;--line:#34444F;color-scheme:dark;}}
*{box-sizing:border-box}
body{margin:0;background-color:var(--paper);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:22px 22px;color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.45}
#app{max-width:560px;margin:0 auto;padding:18px 16px 48px}
h1{font-family:var(--serif);font-weight:400;font-size:2.4rem;margin:6px 0 0;letter-spacing:-0.01em}
.sub{margin:0 0 18px;color:var(--muted)}
h2{font-family:var(--serif);font-weight:400;font-size:1.35rem;margin:26px 0 4px}
.actions{display:grid;gap:10px}
button{font:inherit;cursor:pointer}
.primary,.secondary{border-radius:10px;padding:13px 16px;font-weight:600;border:1.5px solid var(--ink);text-align:left}
.primary{background:var(--ink);color:var(--paper)}
.secondary{background:var(--card);color:var(--ink)}
.primary:disabled{opacity:.45;cursor:default}
.link{background:none;border:none;color:var(--blue);padding:8px 2px;text-decoration:underline;text-underline-offset:3px}
button:focus-visible,.node:focus-visible,input:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.note{color:var(--muted);margin:4px 0;font-size:.93rem}
.stats{margin:14px 0 0;color:var(--muted);font-size:.93rem}
.graph{width:100%;height:auto;display:block;margin-top:6px}
.edge{fill:none;stroke:var(--line);stroke-width:1.5;stroke-dasharray:4 4}
.edge.on{stroke:var(--ink);stroke-dasharray:none;opacity:.55}
.node{cursor:pointer;outline:none}
.node .dot{fill:var(--card);stroke:var(--ink);stroke-width:1.6}
.node.locked .dot{stroke:var(--line);stroke-dasharray:3 3}
.node.locked text{fill:var(--muted)}
.node.avail .dot{fill:var(--card);stroke:var(--blue);stroke-width:2.4}
.node.done .dot{fill:var(--ink)}
.node.done .num{fill:var(--paper)}
.ringbg{fill:none;stroke:var(--line);stroke-width:3}
.ring{fill:none;stroke:var(--green);stroke-width:3;stroke-linecap:round}
.num{font:600 13px var(--sans);text-anchor:middle;fill:var(--ink)}
.lab{font:11.5px var(--sans);text-anchor:middle;fill:var(--ink)}
.hl{fill:var(--hl);opacity:.85}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:.85rem;color:var(--muted);margin-top:4px}
.lg{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:6px;vertical-align:-1px;border:1.5px solid var(--ink);background:var(--card)}
.lg.locked{border-style:dashed;border-color:var(--line)}.lg.avail{border-color:var(--blue);border-width:2.4px}.lg.done{background:var(--ink);box-shadow:0 0 0 2px var(--paper),0 0 0 4px var(--green)}.lg.due{background:var(--hl);border-color:var(--hl);border-radius:2px}
.reset{margin-top:28px}
.bar{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:.9rem;margin-bottom:8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:20px 18px;box-shadow:2px 3px 0 var(--grid)}
.cls{margin:0 0 8px;color:var(--muted);font-size:.85rem}
.q,.body{font-family:var(--serif);font-size:1.12rem;line-height:1.6}
.lh{margin:0 0 10px;font-size:1.5rem}
form{display:flex;gap:8px;margin-top:16px}
input{flex:1;min-width:0;font:1.1rem var(--sans);padding:12px;border:1.5px solid var(--ink);border-radius:10px;background:var(--paper);color:var(--ink)}
.opts{display:grid;gap:8px;margin-top:16px}
.opt{text-align:left;padding:12px 14px;border:1.5px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink);font-family:var(--serif);font-size:1.05rem}
.opt.right{border-color:var(--green);box-shadow:inset 4px 0 0 var(--green)}
.opt.wrong{border-color:var(--red);box-shadow:inset 4px 0 0 var(--red)}
.verdict{font-weight:700;margin:18px 0 6px}.verdict.good{color:var(--green)}.verdict.bad{color:var(--red)}
.sol{font-family:var(--serif);line-height:1.6;border-left:3px solid var(--line);padding-left:12px;margin:8px 0}
.row{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;margin-top:16px}
.worked{margin:18px 0;padding:14px;border:1px dashed var(--line);border-radius:6px;background:var(--paper)}
.ans{font-family:var(--serif);font-weight:600;margin:8px 0}
.steps{font-family:var(--serif);padding-left:22px;margin:12px 0 18px}
.overlay{position:fixed;inset:0;background:rgba(10,20,30,.45);display:flex;align-items:flex-end;justify-content:center;z-index:10}
.sheet{background:var(--card);color:var(--ink);width:100%;max-width:560px;max-height:85vh;overflow:auto;border-radius:14px 14px 0 0;padding:20px 18px 28px}
.sheet h3{font-family:var(--serif);font-weight:400;font-size:1.45rem;margin:0 0 6px}.sheet h4{margin:16px 0 4px;font-size:.95rem}
.sheet p{font-family:var(--serif);line-height:1.55}
.pre{color:var(--muted);font-size:.95rem}.pre .ok{color:var(--green)}
.parts{padding-left:0;list-style:none;margin:0}.parts li{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);font-size:.95rem}
.when{color:var(--muted);white-space:nowrap;font-size:.85rem}
.flash{margin-top:14px;padding:10px 12px;border:1.5px solid var(--red);border-radius:8px;color:var(--red);font-size:.9rem}
.end{text-align:left}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .22s ease-out}@keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}}
.seg{display:grid;gap:8px}
.seg button{text-align:left;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:10px 12px;display:grid;gap:2px}
.seg button span{color:var(--muted);font-size:.85rem}
.seg button.on{border-color:var(--ink);box-shadow:inset 4px 0 0 var(--blue)}
.key{display:inline-block;min-width:1.4em;color:var(--muted);font-family:var(--sans);font-size:.85rem;margin-right:6px}
.hint{color:var(--muted);font-size:.85rem;margin:8px 0 0}.hint.warn{color:var(--red)}
.remind{font-family:var(--serif);background:var(--paper);border-left:3px solid var(--blue);padding:8px 12px;margin:0 0 12px;line-height:1.5}
.exam{margin:-6px 0 14px;padding:8px 12px;border:1.5px solid var(--ink);border-radius:8px;background:var(--hl);color:#1F2D3D;font-weight:600}
.gwrap{overflow-x:auto}
textarea{width:100%;font:.85rem var(--sans);padding:8px;border:1.5px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink);margin:8px 0}
input[type=date]{font:1rem var(--sans);padding:10px;border:1.5px solid var(--ink);border-radius:10px;background:var(--card);color:var(--ink)}
.note.good{color:var(--green)}
.parts li .link{padding:0}
.dg{width:100%;max-width:380px;height:auto;display:block;margin:4px auto 12px}
.dg text{font:12px var(--sans);fill:var(--ink)}.dg .rl{font-weight:700;font-size:15px}
.dg .ax{stroke:var(--ink);stroke-width:1.4}.dg .gd{stroke:var(--muted);stroke-width:1;stroke-dasharray:3 3}
.dg .dem{stroke:var(--blue);stroke-width:2.2}.dg .mr{stroke:var(--blue);stroke-width:2;stroke-dasharray:6 4}.dg .mc{stroke:var(--red);stroke-width:2.2}
.dg .dem-t,.dg .mr-t{fill:var(--blue);font-weight:600}.dg .mc-t{fill:var(--red);font-weight:600}
.dg .rg{stroke:var(--ink);stroke-width:.6;fill-opacity:.42}.dg .rg0{fill:#F2D24B}.dg .rg1{fill:#8DB4E8}.dg .rg2{fill:#E99A8E}.dg .rg3{fill:#9FD3AE}
@media (prefers-color-scheme:dark){.dg .rg{fill-opacity:.5}}
.steps li.done{color:var(--muted);text-decoration:line-through}
.goal{margin:0 0 14px}.goalbar{height:8px;border-radius:4px;background:var(--grid);overflow:hidden;border:1px solid var(--line)}.goalbar i{display:block;height:100%;background:var(--green)}
.chip{border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:7px 14px}.chip.on{border-color:var(--ink);box-shadow:inset 0 -3px 0 var(--blue)}
.tbl{width:100%;border-collapse:collapse;font-size:.92rem}.tbl th,.tbl td{text-align:left;padding:6px 4px;border-bottom:1px solid var(--line)}.tbl th{color:var(--muted);font-weight:600}.tbl td.lo{color:var(--red)}
.xpw{display:flex;gap:8px;align-items:flex-end;height:110px;margin:8px 0}.xpw div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:2px;font-size:.8rem}.xpw i{display:block;width:100%;max-width:34px;background:var(--blue);border-radius:3px 3px 0 0;min-height:2px}
.plan{list-style:none;padding:0;margin:6px 0 0}.plan li{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:.95rem}.plan li.wait{color:var(--muted)}.plan .tp{color:var(--muted);font-size:.85rem}.plan li>span:first-child{min-width:0}.plan .ok{color:var(--green)}.qz{display:inline-block;margin-left:6px;padding:0 6px;border-radius:4px;background:var(--hl);color:#1F2D3D;font-size:.8rem;font-weight:600}
#qt{font-variant-numeric:tabular-nums;color:var(--ink);font-weight:600}
</style></head><body><main id="app"></main><script>
// ================= helpers =================
const R=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const f=(x,d=2)=>{let v=Math.round(x*Math.pow(10,d))/Math.pow(10,d);if(Object.is(v,-0))v=0;return v.toLocaleString('en-US',{maximumFractionDigits:d});};
const sum=a=>a.reduce((x,y)=>x+y,0);
const ord=n=>n+(n%100>=11&&n%100<=13?'th':({1:'st',2:'nd',3:'rd'}[n%10]||'th'));
// numeric question with mistake-based distractors
const NQ=(q,ans,sol,dist=[],o={})=>Object.assign({kind:'num',q,ans,sol,dist},o);
// multiple-choice-only question
const CQ=(q,right,wrong,sol)=>{const opts=shuffle([right,...wrong]);return {kind:'mc',q,opts,ans:opts.indexOf(right),sol};};
const TF=list=>()=>{const [s,t,e]=pick(list);return CQ(`True or false: ${s}`,t?'True':'False',[t?'False':'True'],`<b>${t?'True':'False'}.</b> ${e}`);};
const descVals=(n,gmin,gmax,start)=>{let v=start||R(24,40),a=[];for(let i=0;i<n;i++){a.push(v);v-=R(gmin,gmax);}return a;};
const sub=i=>String(i).split('').map(c=>'₀₁₂₃₄₅₆₇₈₉'[+c]).join('');
// story pieces in the style of the handouts
const COUNTRIES=[['Freedonia','Sylvania'],['Ruritania','Graustark'],['Lilliput','Blefuscu'],['Narnia','Calormen'],['Genovia','Elbonia'],['Florin','Guilder'],['Latveria','Symkaria'],['Wakanda','Genosha']];
const GOODS=['poiuyts','gizmos','widgets','thingamabobs','doohickeys','whatsits','sprockets','gadgets','qwertys','zxcvbs'];
const PRODUCTS=['a particular product','a patented drug','a specialty software license','a branded snack','a regional newspaper','a designer handbag','a video game console'];
const Pstr=(a,B)=>B===1?`${a} − q`:`${a} − q/${f(B)}`;
const Dstr=(a,B)=>B===1?`${a} − p`:`${f(a*B)} − ${f(B)}p`;
const bStr=b=>b===1?'q':'q/2';
const costStr=d=>d===1?'q²/2':d===0.5?'q²/4':'q²';
const mcStr=d=>d===1?'q':d===0.5?'q/2':'2q';
// common market setups
function linMono(){const B=pick([1,2,4,5,10,100,500,1000]),c=R(1,12),a=c+2*R(3,14);return {a,B,c,qM:(a-c)*B/2,pM:(a+c)/2,qS:(a-c)*B};}
function rising(){const b=pick([1,0.5]),d=pick([1,0.5,2]),a=R(6,20)*2;const qM=a/(2*b+d),pM=a-b*qM,qS=a/(b+d),pS=d*qS;return {a,b,d,qM,pM,qS,pS};}
function cubic(){const m=R(1,4),n=R(1,9);return {m,n,str:`C(q) = q³ − ${2*m}q² + ${m*m+n}q`,MC:q=>3*q*q-4*m*q+m*m+n,C:q=>q**3-2*m*q*q+(m*m+n)*q};}
function families(n,S){let v;do{v=descVals(n,1,6,R(16,30));}while(v[n-1]<2);return {n,S,v,table:v.map((x,i)=>`r${sub(i+1)} = ${x}`).join(', ')};}
function disc(){let A1,A2,c,pu;do{c=R(1,6);A2=c+R(6,14);A1=A2+R(2,10);pu=(A1+A2+2*c)/4;}while(!(pu<A2&&(pu-c)*(A1+A2-2*pu)>(A1-c)**2/4));return {A1,A2,c,pu};}
function foreign(){const [home,abroad]=pick(COUNTRIES),good=pick(GOODS),B=pick([100,200,500,1000]),c=R(2,8),a=c+2*R(3,12);
 return {home,abroad,good,B,c,a,qM:(a-c)*B/2,pM:(a+c)/2,
 short:`${home} imports all its ${good} from a monopolist in ${abroad} with constant marginal cost ${c} per unit and no fixed costs. Inverse demand in ${home} is P(q) = ${Pstr(a,B)}.`,
 story:`${home} is a very small country with no domestic ${good.slice(0,-1)} industry. All its ${good} come from a single manufacturer in ${abroad}, which acts as a classic monopolist in ${home}. The firm has constant marginal cost ${c} per unit and no fixed costs. Inverse demand in ${home} is P(q) = ${Pstr(a,B)}.`};}
const W=(F,t)=>{const q=(F.a-F.c-t)*F.B/2,p=(F.a+F.c+t)/2,cs=0.5*q*(F.a-p);return {q,p,cs,rev:t*q,w:cs+t*q,pi:(p-F.c-t)*q};};

// ================= skills =================
const SKILLS=[
// ---------------------------------------------------------------- S1
{id:'S1',name:'Surplus and gains from trade',short:'Gains from trade',prereq:[],class:'Class 1 / Week 1',
 intro:'Each side of a trade gets surplus: seller gets price − value, buyer gets value − price. A lottery can leave goods with people who value them less than others do: unrealized gains from trade.',
 micros:[
 {id:'S1a',name:'Buyer and seller surplus',explain:'Seller\'s surplus = price − seller\'s value. Buyer\'s surplus = buyer\'s value − price. Total = buyer\'s value − seller\'s value.',
  gen:()=>{const s=R(4,12)*1000,b=s+R(4,12)*1000,t=s+R(1,(b-s)/500-1)*500,w=pick(['buyer','seller','total']);
   const [x,y]=pick([['Alice','Bob'],['Carmen','Dev'],['Priya','Sam']]);const ans=w==='buyer'?b-t:w==='seller'?t-s:b-s;
   return NQ(`${x} owns a car she values at $${f(s)}. ${y}'s willingness to pay for it is $${f(b)}. They agree on a price of $${f(t)}. What is the ${w==='total'?'total surplus from the trade':w+"'s surplus"}?`,ans,
   w==='buyer'?`${f(b)} − ${f(t)} = <b>${f(ans)}</b>`:w==='seller'?`${f(t)} − ${f(s)} = <b>${f(ans)}</b>`:`${f(b)} − ${f(s)} = <b>${f(ans)}</b> (the price cancels)`,
   [b-t,t-s,b-s,t].filter(v=>v!==ans));}},
 {id:'S1b',name:'Is it gains from trade?',explain:'Gains from trade: someone gets positive surplus and no one gets negative surplus. A price equal to one side\'s value still counts.',
  gen:()=>{const s=R(4,12)*1000,b=s+R(4,10)*1000,c=R(0,3);let t;if(c===0)t=s+R(1,(b-s)/1000-1)*1000;else if(c===1)t=b+R(1,3)*1000;else if(c===2)t=s-R(1,3)*1000;else t=pick([s,b]);
   const A='Yes',Bx='No: the buyer loses',C='No: the seller loses';const r=t>b?Bx:t<s?C:A;
   return CQ(`Seller's value $${f(s)}, buyer's willingness to pay $${f(b)}, price $${f(t)}. Is this a case of gains from trade?`,r,[A,Bx,C].filter(x=>x!==r),
   `Seller: ${f(t)} − ${f(s)} = ${f(t-s)}. Buyer: ${f(b)} − ${f(t)} = ${f(b-t)}. <b>${r}</b>.`);}},
 {id:'S1c',name:'Spotting a mutually beneficial trade',explain:'After a lottery, find a winner whose value is below some loser\'s value. The loser can buy at any price between the two values.',
  gen:()=>{let F,win,lose,wl,ll;do{F=families(5,R(2,3));const idx=shuffle([0,1,2,3,4]);win=idx.slice(0,F.S).sort();lose=idx.slice(F.S).sort();wl=Math.max(...win);ll=Math.min(...lose);}while(!(ll<wl));
   const lo=F.v[wl],hi=F.v[ll];const price=R(lo+1,hi-1>lo+1?hi-1:lo+1);const ok=price>lo&&price<hi;
   const right=`Family ${ll+1} buys family ${wl+1}'s apartment for ${ok?price:'something between '+lo+' and '+hi}`;
   const w1=`Family ${wl+1} buys family ${ll+1}'s apartment for ${price}`,w2=`Family ${ll+1} buys family ${wl+1}'s apartment for ${hi+R(1,4)}`,w3=`No trade can help both sides`;
   return CQ(`A housing authority allocates ${F.S} apartments among 5 families by lottery, at rent 0. Maximum rents: ${F.table}. Families ${win.map(i=>i+1).join(', ')} win. Which is a mutually beneficial trade?`,right,[w1,w2,w3],
   `Family ${ll+1} (${hi}) lost; family ${wl+1} (${lo}) won. Any price in (${lo}, ${hi}) helps both. <b>${right}</b>.`);}},
 {id:'S1d',name:'Which fees guarantee efficiency?',explain:'With an announced fee R, a fair lottery among entrants, and no resale: you need exactly the top S families to strictly want in. So r(S+1) < R < r(S).',
  gen:()=>{const S=R(2,4),v=descVals(S+2+R(0,1),2,5,R(18,30));const lo=v[S],hi=v[S-1];
   const right=`${lo} < R < ${hi}`;return CQ(`An authority has ${S} apartments and ${v.length} families with maximum rents ${v.map((x,i)=>`r${sub(i+1)} = ${x}`).join(', ')}. It announces rent R, families choose whether to enter a fair lottery, and resale is banned. Which rents guarantee the allocation exhausts the gains from trade?`,right,[`${lo} ≤ R ≤ ${hi}`,`${v[S+1]} < R < ${lo}`,`0 ≤ R < ${hi}`],
   `Top ${S} must strictly enter, family ${S+1} must strictly stay out: <b>${lo} &lt; R &lt; ${hi}</b>. At an endpoint, an indifferent family might misbehave.`);}},
 {id:'S1e',name:'Key ideas',explain:'Gains from trade, procedural fairness of lotteries, and the two uses of surplus (predicting and evaluating).',
  gen:TF([["a fair lottery guarantees no unrealized gains from trade.",0,"It can give apartments to low-value people while high-value people go without."],
   ["gains from trade require both parties to get strictly positive surplus.",0,"One positive and the other zero still counts."],
   ["the notes use surplus both to predict what people will do and to evaluate whether it is good.",1,"Descriptive and evaluative uses; behavioral economics studies when they come apart."],
   ["a fair lottery satisfies a principle of procedural fairness.",1,"It treats everyone symmetrically; the economist's objection is about unrealized gains."],
   ["a trade at a price above the buyer's willingness to pay is a case of gains from trade.",0,"The buyer's surplus is negative."],
   ["in a trade between Alice and Bob, the price affects total surplus.",0,"The price only splits the surplus; total = buyer's value − seller's value."],
   ["if Alice won an apartment in a lottery and Bob values it more, there is a price at which both gain from Bob buying it.",1,"Any price between their values."]])}],
 integ:[
  ()=>{const F=families(5,R(2,3));const win=shuffle([0,1,2,3,4]).slice(0,F.S).sort();const top=sum(F.v.slice(0,F.S)),got=sum(win.map(i=>F.v[i]));
   return NQ(`${F.S} apartments, 5 families, rent 0. Maximum rents: ${F.table}. A lottery picks families ${win.map(i=>i+1).join(', ')}. How much total surplus is lost relative to the efficient allocation?`,top-got,
   `Efficient: ${F.v.slice(0,F.S).join(' + ')} = ${top}. Lottery: ${win.map(i=>F.v[i]).join(' + ')} = ${got}. Loss = <b>${top-got}</b>.`,[top,got,top-got+F.v[F.S],Math.abs(F.v[0]-F.v[4])]);},
  ()=>{let F,win,wl,ll;do{F=families(5,R(2,3));win=shuffle([0,1,2,3,4]).slice(0,F.S).sort();const lose=[0,1,2,3,4].filter(i=>!win.includes(i));wl=Math.max(...win);ll=Math.min(...lose);}while(!(ll<wl));
   const g=F.v[ll]-F.v[wl];return NQ(`${F.S} apartments, 5 families, rent 0. Maximum rents: ${F.table}. Families ${win.map(i=>i+1).join(', ')} win the lottery. If family ${ll+1} buys family ${wl+1}'s apartment, how much total surplus does that one trade create?`,g,
   `r${sub(ll+1)} − r${sub(wl+1)} = ${F.v[ll]} − ${F.v[wl]} = <b>${g}</b>, whatever the price.`,[F.v[ll],F.v[wl],g/2,F.v[ll]+F.v[wl]]);}]},

// ---------------------------------------------------------------- S2
{id:'S2',name:'Market-clearing prices and rent control',short:'Market clearing',prereq:['S1'],class:'Class 1',
 intro:'p* clears the market when #{v > p*} ≤ S ≤ #{v ≥ p*}. Rent control sets p̄ below every market-clearing price, creating excess demand that a lottery or queue must ration.',
 micros:[
 {id:'S2a',name:'Highest market-clearing price',explain:'Sort values high to low. The highest market-clearing price is the S-th highest value.',
  gen:()=>{const M=mkt();return NQ(`A city center has S = ${M.S} apartments. Valuations: ${M.list}. What is the highest market-clearing price?`,M.v[M.S-1],`Sorted: ${M.v.join(', ')}. ${ord(M.S)} highest = <b>${M.v[M.S-1]}</b>.`,[M.v[M.S],M.v[Math.max(0,M.S-2)],M.v[M.S-1]+1,M.v[M.S+1]]);}},
 {id:'S2b',name:'Lowest market-clearing price',explain:'The lowest market-clearing price is the (S+1)-th highest value.',
  gen:()=>{const M=mkt();return NQ(`A city center has S = ${M.S} apartments. Valuations: ${M.list}. What is the lowest market-clearing price?`,M.v[M.S],`Sorted: ${M.v.join(', ')}. ${ord(M.S+1)} highest = <b>${M.v[M.S]}</b>.`,[M.v[M.S-1],M.v[M.S+1],M.v[M.S]-1,M.v[M.S]+1]);}},
 {id:'S2c',name:'Checking a candidate price',explain:'Need #{v > p} ≤ S (strict wanters fit) and #{v ≥ p} ≥ S (enough willing). Indifferent people can go either way.',
  gen:()=>{const M=mkt();const p=pick([M.v[M.S-1],M.v[M.S],M.v[M.S-1]+1,Math.max(1,M.v[M.S]-1),Math.round((M.v[M.S-1]+M.v[M.S])/2)]);const gt=M.v.filter(x=>x>p).length,ge=M.v.filter(x=>x>=p).length;
   const r=gt>M.S?'No: too many strictly want one':ge<M.S?'No: too few are willing':'Yes';
   return CQ(`S = ${M.S} apartments. Valuations: ${M.list}. Is p = ${p} a market-clearing price?`,r,['Yes','No: too many strictly want one','No: too few are willing'].filter(x=>x!==r),`#{v &gt; ${p}} = ${gt}, #{v ≥ ${p}} = ${ge}, S = ${M.S}. <b>${r}</b>.`);}},
 {id:'S2d',name:'Excess demand under rent control',explain:'At p̄, everyone with v > p̄ wants an apartment. Excess demand = that count − S.',
  gen:()=>{const M=mkt();const lo=Math.max(1,M.v[5]),hi=M.v[M.S]-1;const p=hi>=lo?R(lo,hi):hi;const d=M.v.filter(x=>x>p).length;
   return NQ(`S = ${M.S} apartments. Valuations: ${M.list}. Rent control sets p̄ = ${p}. How large is excess demand?`,d-M.S,`#{v &gt; ${p}} = ${d}. ${d} − ${M.S} = <b>${d-M.S}</b>.`,[d,d-M.S+1,M.S,Math.max(0,d-M.S-1)]);}},
 {id:'S2e',name:'Key ideas',explain:'Why market-clearing allocations exhaust gains, and what rent control does.',
  gen:TF([["any market-clearing allocation leaves no unrealized gains from trade.",1,"A holder has v ≥ p* ≥ any non-holder's v."],
   ["removing rent control makes every resident better off.",0,"Someone with p̄ &lt; v ≤ p* gets zero at p* but a chance of surplus under rent control."],
   ["time spent waiting in a queue for rent-controlled apartments is a transfer, like rent.",0,"It's used up: a directly unproductive, profit-seeking (DUP) activity."],
   ["secondary trades after a rent-control lottery always undo the misallocation.",0,"They're costly and may be illegal; evidence (Glaeser–Luttmer) finds lasting misallocation."],
   ["rent control below every market-clearing price creates excess demand.",1,"More people want apartments at p̄ than there are apartments."],
   ["if people differ only in wealth, the highest willingness to pay may simply belong to the richest.",1,"That's why distributive goals come up in rent-control debates."],
   ["a market-clearing price must be unique.",0,"Any price between the (S+1)-th and S-th highest values works."]])}],
 integ:[
  ()=>{let M,p,ent;do{M=mkt();p=R(Math.max(1,M.v[5]),M.v[M.S]-1);ent=M.v.filter(x=>x>p);}while(ent.length<=M.S||new Set(ent).size<2||sum(ent)*M.S/ent.length>=sum(M.v.slice(0,M.S))-0.01);const exp=sum(ent)*M.S/ent.length,eff=sum(M.v.slice(0,M.S));
   return NQ(`S = ${M.S} apartments. Valuations: ${M.list}. Rent control sets p̄ = ${p}, and a fair lottery rations among everyone who wants one. What is the expected loss in total valuation versus a market-clearing allocation?`,eff-exp,
   `Entrants ${ent.join(', ')}: each wins w.p. ${M.S}/${ent.length}. E[value] = ${sum(ent)} × ${M.S}/${ent.length} = ${f(exp)}. Efficient = ${eff}. Loss = <b>${f(eff-exp)}</b>.`,[eff-sum(M.v)*M.S/6,eff-exp/2,sum(ent)-eff,eff-sum(ent)/ent.length]);},
  ()=>{let M,p,cands;do{M=mkt();p=R(Math.max(1,M.v[5]),M.v[M.S]-1);cands=M.people.filter(x=>x.v>p&&x.v<=M.v[M.S]);}while(!cands.length||!M.people.some(x=>x.v<=p)||!M.people.some(x=>x.v>M.v[M.S]));
   const ok=pick(cands),lowp=pick(M.people.filter(x=>x.v<=p)),top=pick(M.people.filter(x=>x.v>M.v[M.S]));
   return CQ(`S = ${M.S} apartments. Valuations: ${M.list}. Rent control sets p̄ = ${p}, with a lottery. Who gets zero surplus at every market-clearing price but a positive expected surplus under rent control?`,`Resident ${ok.nm}`,[`Resident ${lowp.nm}`,`Resident ${top.nm}`,'No one'],
   `Need p̄ &lt; v ≤ lowest p* = ${M.v[M.S]}. ${ok.nm} has ${ok.v}: <b>Resident ${ok.nm}</b>.`);}]},

// ---------------------------------------------------------------- S4
{id:'S4',name:'Profit and marginal reasoning',short:'Marginal reasoning',prereq:[],class:'Class 2 / Week 1',
 intro:'Profit is maximized where MR = MC. Average cost tells you the sign of profit, not whether it is maximized. Decisions depend on the next unit, not the average unit.',
 micros:[
 {id:'S4a',name:'Profit from price and average cost',explain:'Π = q(P − AC).',
  gen:()=>{const q=R(10,60),p=R(10,30),ac=p-R(-4,8);const ans=q*(p-ac);return NQ(`A firm sells ${q} units at price ${p}. Average cost at that output is ${ac}. What is its profit?`,ans,`${q} × (${p} − ${ac}) = <b>${f(ans)}</b>`,[q*p,p-ac,q*(p+ac),-ans],{allowNeg:true});}},
 {id:'S4b',name:'The three statements',explain:'Competitive: MR = p. Market power: MR < p. P > AC means positive profit, not maximum profit.',
  gen:TF([["if marginal cost is less than the price, a competitive firm is not maximizing profit.",1,"MR = p for a price-taker, so the next unit is profitable."],
   ["if marginal cost is less than the price, a firm is not maximizing profit.",0,"With market power MR &lt; p; the firm can sit at MR = MC &lt; p. Fix: “price” → “marginal revenue.”"],
   ["if average cost is less than the price, a firm is not maximizing profit.",0,"P &gt; AC means profit is positive. Fix: “is not maximizing” → “makes a positive profit.”"],
   ["if price exceeds average cost at a positive output, profit is positive.",1,"Π = q(P − AC)."],
   ["if marginal revenue exceeds marginal cost, producing a little more raises profit.",1,"The next unit adds more to revenue than to cost."],
   ["if marginal revenue is less than marginal cost, producing a little less raises profit.",1,"The last unit cost more than it brought in."],
   ["MR = MC guarantees a profit maximum.",0,"It's necessary, not sufficient: check the second derivative and compare with q = 0."],
   ["a monopolist's supply curve is the part of its MC curve above average cost.",0,"A monopolist has no supply function."]])},
 {id:'S4c',name:'Discrete MR and MC from a table',explain:'MR of the next unit = R(q+1) − R(q) with R = q·P. MC = C(q+1) − C(q) with C = q·AC.',
  gen:()=>{const q=R(4,9),P1=R(14,25),P2=P1-R(1,2),A1=R(5,10),A2=A1+R(1,2);const MR=(q+1)*P2-q*P1,MCv=(q+1)*A2-q*A1,w=pick(['MR','MC']);
   return NQ(`At q = ${q}: P = ${P1}, AC = ${A1}. At q = ${q+1}: P = ${P2}, AC = ${A2}. What is the ${w} of going from ${q} to ${q+1}?`,w==='MR'?MR:MCv,
   w==='MR'?`${(q+1)}×${P2} − ${q}×${P1} = ${(q+1)*P2} − ${q*P1} = <b>${MR}</b>`:`${(q+1)}×${A2} − ${q}×${A1} = ${(q+1)*A2} − ${q*A1} = <b>${MCv}</b>`,
   w==='MR'?[P2,P1,MCv,P1-P2]:[A2,A1,MR,A2-A1]);}},
 {id:'S4d',name:'Which way to move',explain:'MR > MC: produce more. MR < MC: produce less.',
  gen:()=>{const mr=R(2,20),mc=pick([mr+R(1,5),Math.max(1,mr-R(1,5))]);const a=mr>mc?'Produce more':'Produce less';const ctx=pick(['A firm','A monopolist','A publisher']);
   return CQ(`${ctx} finds that at its current output, marginal revenue is ${mr} and marginal cost is ${mc}. What should it do?`,a,[a==='Produce more'?'Produce less':'Produce more','Stay put: price exceeds marginal cost'],`MR ${mr>mc?'&gt;':'&lt;'} MC: <b>${a.toLowerCase()}</b>.`);}},
 {id:'S4e',name:'Marginal vs. average benefit',explain:'Expand while marginal benefit exceeds marginal cost. A high average reflects earlier units and says nothing about the next one.',
  gen:()=>{let al,be,c;do{al=pick([400,500,600,800]);be=pick([0.2,0.4,0.5]);c=pick([50,100,150,200]);}while(!Number.isInteger((al-c)/(2*be)));const nS=(al-c)/(2*be),nA=(al-c)/be;const thing=pick([['street trees','tree'],['bus shelters','shelter'],['public pools','pool']]);
   return NQ(`A city's total benefit from n ${thing[0]} is B(n) = ${al}n − ${be}n². Each ${thing[1]} costs ${c}. A council member says to keep adding ${thing[0]} while average benefit exceeds ${c}. What n maximizes net benefit?`,nS,
   `B′(n) = ${al} − ${2*be}n = ${c} → n = <b>${f(nS)}</b>. (The average rule gives ${f(nA)}, where all net benefit is gone.)`,[nA,al/(2*be),nS/2]);}}],
 integ:[
  ()=>{let rows,best;do{const a=R(24,34),d=R(1,3),q0=R(3,6);rows=[0,1,2,3].map(i=>{const q=q0+i,P=a-d*q,AC=R(6,16);return {q,P,AC,pi:q*(P-AC)};});const mx=Math.max(...rows.map(r=>r.pi));best=rows.filter(r=>r.pi===mx);}while(best.length!==1);
   const maxPAC=rows.reduce((a,b)=>b.P-b.AC>a.P-a.AC?b:a);
   return CQ(`A firm's options: ${rows.map(r=>`q = ${r.q}: P = ${r.P}, AC = ${r.AC}`).join('; ')}. Which quantity maximizes profit?`,`q = ${best[0].q}`,rows.filter(r=>r!==best[0]).map(r=>`q = ${r.q}`),
   `Π: ${rows.map(r=>`${r.q}×${r.P-r.AC} = ${r.pi}`).join(', ')}. <b>q = ${best[0].q}</b>.${maxPAC!==best[0]?` (Largest margin is at q = ${maxPAC.q}, but margin isn't profit.)`:''}`);},
  ()=>{const q=R(5,9),P1=R(18,24),P2=P1-1,A1=R(8,11),A2=A1+R(1,2);const p1=q*(P1-A1),p2=(q+1)*(P2-A2);
   return NQ(`At q = ${q}: P = ${P1}, AC = ${A1}. At q = ${q+1}: P = ${P2}, AC = ${A2}. Price exceeds AC at both. By how much does profit change going from ${q} to ${q+1}?`,p2-p1,
   `Π(${q}) = ${p1}, Π(${q+1}) = ${p2}. Change = <b>${p2-p1}</b>.`,[(P2-A2)-(P1-A1),p2,p1-p2,P2-A2]);}]},

// ---------------------------------------------------------------- S5
{id:'S5',name:'Competitive supply and shutdown',short:'Supply and shutdown',prereq:['S4'],class:'Class 2 / Week 1',
 intro:'A competitive firm supplies where p = MC on the rising part of MC, and only if price covers average avoidable cost. Below that price it supplies zero.',
 micros:[
 {id:'S5a',name:'Supply from a simple cost function',explain:'C = kq²: MC = 2kq, S(p) = p/(2k). C = aq² + bq: MC = 2aq + b, S(p) = (p − b)/(2a) for p > b.',
  gen:()=>{if(Math.random()<0.5){const k=pick([1,2,3,4,5]),p=2*k*R(2,10);return NQ(`A competitive firm has cost function C(q) = ${k===1?'':k}q². What quantity does it supply at p = ${p}?`,p/(2*k),`p = ${2*k}q → q = <b>${f(p/(2*k))}</b>`,[p/k,p*2*k,p/(4*k),p]);}
   const a=pick([1,2,3]),b=R(2,8),p=b+2*a*R(1,6);return NQ(`A competitive firm has cost function C(q) = ${a===1?'':a}q² + ${b}q. What quantity does it supply at p = ${p}?`,(p-b)/(2*a),`p = ${2*a}q + ${b} → q = (${p} − ${b})/${2*a} = <b>${f((p-b)/(2*a))}</b>`,[p/(2*a),(p-b)/a,(p+b)/(2*a)]);}},
 {id:'S5b',name:'Shutdown price (minimum AC)',explain:'With no fixed cost, AC = C/q. Complete the square to find min AC. Below it, supply is 0.',
  gen:()=>{const C=cubic();return NQ(`A competitive firm has cost function ${C.str}. Below what price does it supply nothing?`,C.n,`AC = (q − ${C.m})² + ${C.n} → min AC = <b>${C.n}</b>`,[C.m,C.m*C.m+C.n,C.MC(0),C.n+C.m]);}},
 {id:'S5c',name:'Where AC is minimized',explain:'At min AC, MC = AC.',
  gen:()=>{const C=cubic();return NQ(`A competitive firm has cost function ${C.str}. At what quantity is average cost lowest?`,C.m,`AC = (q − ${C.m})² + ${C.n} → q = <b>${C.m}</b>`,[2*C.m/3,C.n,2*C.m,C.m+1]);}},
 {id:'S5d',name:'MC from a cubic',explain:'d/dq of q³ is 3q²; of aq² is 2aq.',
  gen:()=>{const C=cubic(),q=R(1,5);const v=C.MC(q);return NQ(`${C.str}. What is marginal cost at q = ${q}?`,v,`MC = 3q² − ${4*C.m}q + ${C.m*C.m+C.n} → <b>${v}</b> at q = ${q}`,[C.C(q)/q,C.C(q),q*q-2*C.m*q+C.m*C.m+C.n===v?v+3:q*q-2*C.m*q+C.m*C.m+C.n,3*q*q]);}},
 {id:'S5e',name:'Fixed costs and shutdown',explain:'Avoidable fixed cost: produce iff p ≥ AVC + F/q. Sunk: produce iff p ≥ AVC.',
  gen:()=>{let q,avc,F,p,kind,yes;do{q=R(5,20);avc=R(4,10);F=R(2,12)*q/2;kind=pick(['avoidable','sunk']);p=R(avc-1,Math.ceil(avc+F/q)+2);yes=kind==='sunk'?p>avc:p>avc+F/q;}while(p===avc||p===avc+F/q);
   return CQ(`At its best positive output (q = ${q}), a firm's price is ${p} and average variable cost is ${avc}. Its fixed cost of ${f(F)} is ${kind==='sunk'?'sunk (already paid, no matter what)':'avoidable if it produces nothing'}. Should it produce?`,yes?'Produce':'Shut down',[yes?'Shut down':'Produce'],
   kind==='sunk'?`Sunk: compare p = ${p} with AVC = ${avc}. <b>${yes?'Produce':'Shut down'}</b>.`:`ATC = ${avc} + ${f(F)}/${q} = ${f(avc+F/q)} vs p = ${p}. <b>${yes?'Produce':'Shut down'}</b>.`);}},
 {id:'S5f',name:'Key ideas',explain:'Supply functions only make sense for price-takers.',
  gen:TF([["a competitive firm never produces where marginal cost is falling.",1,"There p = MC is a profit minimum (Π″ = −C″ &gt; 0)."],
   ["only the part of MC above average (avoidable) cost is on the supply curve.",1,"Below min AC the firm loses money at any positive q."],
   ["supply and marginal cost functions take the same argument.",0,"S takes p, MC takes q; they're inverses."],
   ["long-run supply is usually more responsive to price than short-run supply.",1,"More adjustments are available, e.g., converting buildings."],
   ["it makes sense to ask for a monopolist's supply function.",0,"Its quantity choice also sets the price."],
   ["a sunk fixed cost should affect a firm's decision to keep producing.",0,"It's paid either way."]])}],
 integ:[
  ()=>{const C=cubic(),qs=C.m+R(1,3),p=C.MC(qs);return NQ(`A competitive firm has cost function ${C.str}. What quantity does it supply at p = ${p}?`,qs,`3q² − ${4*C.m}q + ${C.m*C.m+C.n} = ${p}; rising root → q = <b>${qs}</b> (p ≥ min AC = ${C.n} ✓)`,[(4*C.m-Math.sqrt(16*C.m*C.m-12*(C.m*C.m+C.n-p)))/6,C.m,qs+1,qs-1,2*C.m]);},
  ()=>{const C=cubic(),qs=C.m+R(1,3),p=C.MC(qs),pi=p*qs-C.C(qs);return NQ(`A competitive firm has cost function ${C.str}. What is its profit at p = ${p}?`,pi,`q = ${qs} (p = MC). Π = ${p}×${qs} − ${C.C(qs)} = <b>${pi}</b>`,[p*qs,pi-qs,(p-C.n)*qs,C.C(qs)]);}]},

// ---------------------------------------------------------------- S6
{id:'S6',name:'Opportunity cost, sunk cost, economic profit',short:'Opportunity cost',prereq:['S4'],class:'Class 2 / Week 1',
 intro:'Cost means opportunity cost: the value of the best alternative given up. Sunk costs are gone whatever you do, so they never enter a current decision.',
 micros:[
 {id:'S6a',name:'Economic profit',explain:'Economic profit = accounting profit − forgone rent − forgone salary − forgone interest on own capital.',
  gen:()=>{const biz=pick(['bakery','dental practice','bike shop','bookstore','café']);const A=R(60,200)*1000,rent=R(10,40)*1000,sal=R(40,120)*1000,K=R(1,5)*50000,r=R(3,6);const e=A-rent-sal-K*r/100;
   return NQ(`A ${biz} owner reports accounting profit of $${f(A)}. She owns the building (comparable space rents for $${f(rent)}/year), works there full-time (she'd earn $${f(sal)} elsewhere), and has $${f(K)} of her own savings in equipment (bonds pay ${r}%). What is economic profit?`,e,
   `${f(A)} − ${f(rent)} − ${f(sal)} − ${f(K*r/100)} = <b>${f(e)}</b>`,[A-rent-sal,A-rent-sal-K,A-sal,e+rent],{allowNeg:true});}},
 {id:'S6b',name:'Proceed or abandon?',explain:'Compare future benefits and future costs only. Money already spent is the same under every option.',
  gen:()=>{let X,Y,B,Z;do{X=R(2,9);Y=pick([0.5,1,1.5,2]);B=Y+pick([-0.3,0.2,0.5,0.8]);Z=Y+pick([0.1,0.3,0.6,0.9]);}while(Math.abs(B-Z)<0.05);const go=B>Z;
   return CQ(`A firm spent $${X} million developing a prototype. Continuing to market requires $${Y} million more and would generate $${f(B)} million in revenue. The same $${Y} million invested elsewhere would return $${f(Z)} million. Should the firm proceed?`,go?'Proceed':'Abandon and invest elsewhere',[go?'Abandon and invest elsewhere':'Proceed',go?`Abandon: the $${X} million can't be recovered anyway`:`Proceed: otherwise the $${X} million is wasted`],
   `Proceed nets ${f(B-Y)}M; alternative nets ${f(Z-Y)}M. The $${X}M is sunk. <b>${go?'Proceed':'Abandon'}</b>.`);}},
 {id:'S6c',name:'Which figure is irrelevant?',explain:'Any amount already spent and unrecoverable is irrelevant.',
  gen:()=>{let X,Y,B,Z;do{X=R(2,9);Y=R(1,4);B=R(2,8);Z=R(2,8);}while(new Set([X,Y,B,Z]).size<4);return CQ(`A firm spent $${X} million on a prototype. Launching costs $${Y} million and brings $${B} million in revenue. The $${Y} million could return $${Z} million elsewhere. Which figure should not affect the decision?`,`$${X} million`,[`$${Y} million`,`$${B} million`,`$${Z} million`],`The $${X}M is sunk. <b>$${X} million</b>.`);}},
 {id:'S6d',name:'Key ideas',explain:'Accounting vs. economic cost.',
  gen:TF([["zero economic profit means the owners are doing badly.",0,"It means they're earning exactly what their resources would earn in the next-best use."],
   ["the price a firm originally paid for a machine is part of the cost of using it today.",0,"That's sunk; the cost is the machine's value in its best alternative use."],
   ["an owner who pays herself no salary still has a labor cost.",1,"The opportunity cost of her time."],
   ["owning your building outright means you have no cost of space.",0,"You forgo the rent you could collect."],
   ["a machine with no resale or rental market has an opportunity cost of about zero.",1,"Its next-best use is sitting idle."],
   ["the going rate of return used for economic profit should match the riskiness of the business.",1,"Riskier businesses need a higher benchmark return."]])}],
 integ:[
  ()=>{const R0=R(10,30)*1000,R1=R0-R(1,5)*1000,rent=R(1,5)*1000,i=R(3,8);const sell=R0*(1+i/100),ro=R1+rent,oc=Math.max(sell,ro)-R1;
   return NQ(`A firm owns a machine it could sell today for $${f(R0)}. If kept a year, it will resell for $${f(R1)}. It could instead be rented to another firm this year for $${f(rent)}. The interest rate is ${i}%. What is the opportunity cost of using it in production this year?`,oc,
   `In a year: use → ${f(R1)}; rent → ${f(ro)}; sell now → ${f(sell)}. Cost = ${f(Math.max(sell,ro))} − ${f(R1)} = <b>${f(oc)}</b>`,[R0-R1,rent,R0,sell-R0]);},
  ()=>{const X=R(20,40),Y=R(10,25),S=R(2,8),Z=Y+R(2,10);return NQ(`A city has spent $${X}M on a half-built stadium. Finishing costs $${Y}M. If abandoned, the site sells for $${S}M, and the $${Y}M could fund road repairs worth $${Z}M. How large must the finished stadium's benefits be (in $M) to justify finishing?`,S+Z,
   `Finish: B − ${Y}. Abandon: ${S} + ${Z} − ${Y}. B ≥ ${S} + ${Z} = <b>${S+Z}</b>`,[Y,Z,X+Y,Y+S]);}]},

// ---------------------------------------------------------------- S7
{id:'S7',name:'Monopoly: the optimum',short:'Monopoly optimum',prereq:['S4'],class:'Class 3',
 intro:'Invert demand to get P(q), maximize q·P(q) − C(q), set MR = MC. Quantity from MR = MC; price from demand at that quantity.',
 micros:[
 {id:'S7a',name:'Inverting demand',explain:'Write q = D(p) and solve for p. D(p) = A − Bp gives P(q) = A/B − q/B.',
  gen:()=>{const B=pick([1,2,3,4,5]),a=R(10,40);return NQ(`Demand is D(p) = ${Dstr(a,B)}. Inverse demand is P(q) = a − ${B===1?'q':'q/'+B}. What is a?`,a,`q = ${a*B} − ${B}p → p = ${a*B}/${B} − q/${B} = ${Pstr(a,B)}. <b>a = ${a}</b>`,[a*B,a*B/2,a/B,a+B]);}},
 {id:'S7b',name:'Marginal revenue (linear)',explain:'P = a − bq → MR = a − 2bq: same intercept, twice the slope.',
  gen:()=>{const B=pick([1,2,4,5]),a=R(10,40),q0=R(1,Math.floor(a*B/2)-1);const mr=a-2*q0/B;return NQ(`Inverse demand is P(q) = ${Pstr(a,B)}. What is marginal revenue at q = ${q0}?`,mr,`MR = ${a} − 2q/${B} → <b>${f(mr)}</b>`,[a-q0/B,a-2*q0,(a-q0/B)*q0,a-4*q0/B]);}},
 {id:'S7c',name:'MR = MC with constant MC',explain:'P = a − q/B, MC = c: q = (a − c)B/2, p = (a + c)/2.',
  gen:()=>{const M=linMono(),w=pick(['price','quantity']);const alt=w==='price'?[M.c,M.a/2,(M.a+M.c)/2+M.c/2,M.a-M.c]:[M.qS,M.a*M.B/2,M.qM/2,(M.a-M.c)*M.B/4];
   return NQ(`A monopolist faces demand D(p) = ${Dstr(M.a,M.B)} and has cost function C(q) = ${M.c===1?'':M.c}q. What is its profit-maximizing ${w}?`,w==='price'?M.pM:M.qM,
   `P = ${Pstr(M.a,M.B)}, MR = ${M.a} − 2q/${f(M.B)} = ${M.c} → q = ${f(M.qM)}, p = ${f(M.pM)}. <b>${f(w==='price'?M.pM:M.qM)}</b>`,alt);}},
 {id:'S7d',name:'MR = MC with rising MC',explain:'Differentiate C to get MC, set MR = MC, then plug q into demand.',
  gen:()=>{const M=rising(),w=pick(['price','quantity']);return NQ(`A monopolist faces inverse demand P(q) = ${M.a} − ${bStr(M.b)} and has cost C(q) = ${costStr(M.d)}. What is its profit-maximizing ${w}?`,w==='price'?M.pM:M.qM,
   `MR = ${M.a} − ${M.b===1?'2q':'q'}, MC = ${mcStr(M.d)} → q = ${f(M.qM)}, p = ${f(M.pM)}. <b>${f(w==='price'?M.pM:M.qM)}</b>`,w==='price'?[M.pS,M.d*M.qM,M.a/2,M.a-M.b*M.qS/2]:[M.qS,M.a/(2*M.b),M.a/(M.b+2*M.d),M.qM*2]);}},
 {id:'S7e',name:'Discrete buyers: margin vs. volume',explain:'Unit-demand buyers: selling k units means pricing at the k-th highest value. Compare k × (price − c).',
  gen:()=>{let v,c,pr,best;do{v=descVals(5,2,6,R(16,24));c=R(1,5);pr=v.map((x,i)=>(i+1)*(x-c));const mx=Math.max(...pr);best=pr.filter(x=>x===mx);}while(best.length!==1||v[4]<=c);const k=pr.indexOf(Math.max(...pr));
   return CQ(`Five buyers each want one unit, with values ${v.join(', ')}. Each unit costs ${c}. The monopolist must charge everyone the same price. What price maximizes profit?`,`${v[k]}`,v.filter((_,i)=>i!==k).slice(0,3).map(String),`Profit by units sold: ${pr.map((x,i)=>`${i+1}: ${x}`).join(', ')}. <b>Price ${v[k]}</b>.`);}},
 {id:'S7f',name:'Key ideas',explain:'Quantity from MR = MC; price from demand.',
  gen:TF([["a monopolist sets price equal to marginal cost.",0,"It sets MR = MC, and MR &lt; P."],

   ["a monopolist will charge the highest price any consumer is willing to pay.",0,"Higher price means fewer sales; it trades margin against volume."],
   ["to sell one more unit, a uniform-price monopolist must cut the price on all units it sells.",1,"That's why MR is below price."],
   ["a monopoly can persist without any barrier to entry.",0,"Profits would attract entry; the model assumes something (law, patent, unique input) blocks it."],
   ["price discrimination requires identifying buyers and preventing resale.",1,"Otherwise low-price buyers undercut the seller."]])}],
 integ:[
  ()=>{const M=linMono();return NQ(`A monopolist faces demand D(p) = ${Dstr(M.a,M.B)} and has cost C(q) = ${M.c===1?'':M.c}q. What is its maximum profit?`,(M.pM-M.c)*M.qM,`q = ${f(M.qM)}, p = ${f(M.pM)}. Π = ${f(M.pM-M.c)} × ${f(M.qM)} = <b>${f((M.pM-M.c)*M.qM)}</b>`,[M.pM*M.qM,(M.pM-M.c)*M.qS,(M.pM-M.c)*M.qM/2,M.qM]);},
  ()=>{const M=rising(),pi=M.pM*M.qM-M.d*M.qM**2/2;return NQ(`A monopolist faces P(q) = ${M.a} − ${bStr(M.b)} and has cost C(q) = ${costStr(M.d)}. What is its maximum profit?`,pi,`q = ${f(M.qM)}, p = ${f(M.pM)}. Π = ${f(M.pM*M.qM)} − ${f(M.d*M.qM**2/2)} = <b>${f(pi)}</b>`,[M.pM*M.qM,M.pM*M.qM-M.d*M.qM**2,(M.pM-M.d*M.qM)*M.qM,pi/2]);}]},

// ---------------------------------------------------------------- S8
{id:'S8',name:'Elasticity',short:'Elasticity',prereq:[],class:'Class 3 / Kreps handout',
 intro:'ε = (dq/dp)(p/q): a ratio of percentage changes, so units don\'t matter. |ε| > 1 elastic, < 1 inelastic. Inverse demand elasticity ε_P = 1/ε_D.',
 micros:[
 {id:'S8a',name:'Elasticity on a linear demand',explain:'D(p) = A − Bp: ε = −Bp/(A − Bp). It changes along the line even though the slope is constant.',
  gen:()=>{const B=pick([1,2,3,4]),A=B*R(10,30),p=R(1,A/B-1);const e=-B*p/(A-B*p);return NQ(`Demand is D(p) = ${A} − ${B===1?'':B}p. What is the elasticity of demand at p = ${p}?`,e,`ε = −${B}×${p}/(${A} − ${B*p}) = <b>${f(e,3)}</b>`,[-B,-p/(A-B*p),-(A-B*p)/(B*p),e*-1],{absOK:true,dp:3});}},
 {id:'S8b',name:'Elastic or inelastic?',explain:'|ε| > 1 elastic; |ε| < 1 inelastic; |ε| = 1 unit elastic (revenue-maximizing).',
  gen:()=>{const B=pick([1,2]),a=R(5,15)*2,p=pick([a/2,R(1,a/2-1),R(a/2+1,a-1)]);const e=-p/(a-p);const ans=Math.abs(e)>1?'Elastic':Math.abs(e)<1?'Inelastic':'Unit elastic';
   return CQ(`Demand is D(p) = ${a*B} − ${B===1?'':B}p. At p = ${p}, demand is:`,ans,['Elastic','Inelastic','Unit elastic'].filter(x=>x!==ans),`ε = ${f(e,3)}. <b>${ans}</b>.`);}},
 {id:'S8c',name:'Percent changes',explain:'%Δq ≈ ε × %Δp.',
  gen:()=>{const e=pick([-0.5,-1.5,-2,-2.5,-3,-4]),dp=pick([1,2,3,4,5])*pick([1,-1]);const prod=pick(PRODUCTS);return NQ(`Demand for ${prod} has elasticity ${e}. If the price ${dp>0?'rises':'falls'} ${Math.abs(dp)}%, approximately what is the percent change in quantity demanded?`,e*dp,`${e} × ${dp}% = <b>${f(e*dp)}%</b>`,[dp/e,-e*dp,e+dp,e*dp/100],{pct:true,allowNeg:true});}},
 {id:'S8d',name:'Price for a target quantity (notes method)',explain:'(p₁ − p₀)/p₀ ≈ ε_P × (q₁ − q₀)/q₀, with ε_P = 1/ε_D.',
  gen:()=>{const p0=pick([5,8,10,12,20,25,40]),q0=R(2,20)*5000,e=pick([-2,-2.5,-4,-5]),pct=pick([2,4,5,10]);const q1=q0*(1+pct/100),p1=p0*(1+pct/100/e);
   return NQ(`Demand for ${pick(PRODUCTS)} (sold by a single firm) has elasticity ${e} at the price $${f(p0)}, at which price demand equals ${f(q0)} units. If the firm wishes to sell ${f(q1)} units, approximately what price must it charge?`,p1,
   `%Δq = ${pct}%; %Δp ≈ (1/${e}) × ${pct}% = ${f(pct/e,3)}%. p ≈ ${p0} × ${f(1+pct/100/e,4)} = <b>$${f(p1)}</b>`,[p0*(1+pct*e/100),p0*(1-pct/100),p0*(1+pct/100/e*-1),p0-pct/100/e],{dp:2});}},
 {id:'S8e',name:'Constant-elasticity demand',explain:'D(p) = A·p^(−α) has elasticity −α at every price.',
  gen:()=>{const a=pick([1.5,2,3,4]),A=pick([1440,40960,144000,3600]);return NQ(`Demand is D(p) = ${f(A)}·p^(−${a}). What is the elasticity of demand at p = ${R(2,20)}?`,-a,`p·D′/D = −${a} at every price: <b>−${a}</b>`,[-1/a,a-1,-(a+1)],{absOK:true});}},
 {id:'S8f',name:'Key ideas',explain:'Why elasticity, not slope.',
  gen:TF([["switching prices from dollars to cents changes the elasticity of demand.",0,"Elasticity is a ratio of percentage changes, so units cancel."],
   ["a linear demand curve has the same elasticity at every price.",0,"Constant slope, but elasticity varies: −Bp/(A − Bp)."],
   ["in a log-log regression of quantity on price, the slope is an elasticity.",1,"d log q / d log p = (dq/dp)(p/q)."],
   ["a demand curve with elasticity 0 everywhere is vertical.",1,"Quantity doesn't respond to price."],
   ["when demand is elastic, raising the price raises revenue.",0,"Quantity falls by a bigger percentage, so revenue falls."],
   ["revenue is maximized where demand is unit elastic.",1,"MR = P(1 + 1/ε) = 0 at ε = −1."],
   ["the elasticity of inverse demand is the reciprocal of the elasticity of demand.",1,"ε_P = 1/ε_D."]])}],
 integ:[
  ()=>{const e=pick([-0.5,-0.8,-1.5,-2,-3,-4]),dp=pick([2,3,5]);const ans=dp*(1+e);return NQ(`Demand for ${pick(PRODUCTS)} has elasticity ${e}. The seller raises its price ${dp}%. Approximately what is the percent change in revenue?`,ans,`%ΔR ≈ ${dp} + (${e})(${dp}) = <b>${f(ans)}%</b>`,[e*dp,dp,dp*(1-e),-ans],{pct:true,allowNeg:true});},
  ()=>{const B=pick([1,2,4,5]),a=R(8,30)*2;return NQ(`Demand is D(p) = ${a*B} − ${B===1?'':B}p. What price maximizes revenue?`,a/2,`Unit elastic: ${B}p = ${a*B} − ${B}p → p = <b>${a/2}</b>`,[a,a*B/2,a/4,a*B/4]);}]},

// ---------------------------------------------------------------- S9
{id:'S9',name:'MR with elasticity and the Lerner index',short:'Lerner index',prereq:['S7','S8'],class:'Class 3 / Kreps handout',
 intro:'MR = P(1 + 1/ε_D). At the optimum, (P − MC)/P = 1/|ε_D|. A monopolist with MC > 0 operates on the elastic part of demand.',
 micros:[
 {id:'S9a',name:'MR from price and elasticity',explain:'MR = P(1 + 1/ε). E.g. ε = −4: MR = 0.75P.',
  gen:()=>{const P=pick([4,5,8,10,12,15,20,25,30]),e=pick([-1.25,-1.5,-2,-2.5,-4,-5]);const mr=P*(1+1/e);return NQ(`A firm charges $${P}, and the elasticity of demand there is ${e}. What is marginal revenue?`,mr,`${P}(1 + 1/${e}) = ${P} × ${f(1+1/e,3)} = <b>${f(mr)}</b>`,[P*(1+e),P*(1-1/e),P/Math.abs(e),P*(1+1/e)*-1+P]);}},
 {id:'S9b',name:'Computing the Lerner index',explain:'L = (P − MC)/P.',
  gen:()=>{const P=R(8,40),mc=R(1,P-1);return NQ(`A firm charges ${P} with marginal cost ${mc}. What is its Lerner index?`,(P-mc)/P,`(${P} − ${mc})/${P} = <b>${f((P-mc)/P,3)}</b>`,[(P-mc)/mc,mc/P,P/(P-mc),P-mc],{dp:3});}},
 {id:'S9c',name:'Markup with constant elasticity',explain:'p(1 − 1/α) = c → p = c·α/(α − 1).',
  gen:()=>{const a=pick([1.5,2,3,4,5]),c=R(1,12);const ctx=pick(['A museum sells admission tickets','A firm sells a patented drug','A publisher sells e-books']);return NQ(`${ctx}. Each extra unit costs $${c}; demand has constant elasticity −${a}. What price maximizes profit?`,c*a/(a-1),`p = ${c} × ${a}/${f(a-1)} = <b>${f(c*a/(a-1))}</b>`,[c*a,c/(a-1),c*(a-1)/a,c*(1+1/a)]);}},
 {id:'S9d',name:'Elasticity from the markup',explain:'At the optimum, |ε| = P/(P − MC).',
  gen:()=>{const P=R(8,40),mc=R(1,P-2);return NQ(`A profit-maximizing monopolist charges ${P} with marginal cost ${mc}. What is |ε| at its optimum?`,P/(P-mc),`|ε| = ${P}/(${P} − ${mc}) = <b>${f(P/(P-mc),3)}</b>`,[(P-mc)/P,P/mc,mc/(P-mc)],{dp:3,absOK:true});}},
 {id:'S9e',name:'More or less output? (Kreps Q2)',explain:'Compute MR = P(1 + 1/ε) and compare with MC.',
  gen:()=>{const P=pick([5,8,10,12,20]),e=pick([-1.5,-2,-2.5,-4,-5]),q=R(2,10)*10000;const mr=P*(1+1/e);const mc=pick([Math.round(mr)+R(1,2),Math.max(0.5,Math.round(mr)-R(1,2))]);const a=mr>mc?'More than':'Less than';
   return CQ(`Demand for a product sold by a single firm has elasticity ${e} at price $${P}, where it sells ${f(q)} units. MR is falling and MC is rising; MC at ${f(q)} units is $${f(mc)}. Is the profit-maximizing quantity more than, less than, or equal to ${f(q)}?`,a+` ${f(q)}`,[(a==='More than'?'Less than':'More than')+` ${f(q)}`,`Exactly ${f(q)}`],`MR = ${P}(1 + 1/${e}) = ${f(mr)} ${mr>mc?'&gt;':'&lt;'} MC = ${f(mc)}. <b>${a} ${f(q)}</b>.`);}},
 {id:'S9f',name:'Key ideas',explain:'The Lerner index links markups to elasticity.',
  gen:TF([["a monopolist with positive marginal cost operates where demand is inelastic.",0,"Lerner: 1/|ε| = (P − MC)/P &lt; 1, so |ε| &gt; 1."],
   ["the less elastic demand is, the higher the monopolist's markup.",1,"(P − MC)/P = 1/|ε|."],
   ["a competitive firm has a Lerner index of 0.",1,"P = MC."],
   ["with zero marginal cost, a monopolist operates at the unit-elastic point.",1,"MR = 0 ⇔ |ε| = 1."],
   ["on the inelastic part of demand, marginal revenue is positive.",0,"MR = P(1 + 1/ε) &lt; 0 when −1 &lt; ε &lt; 0."],
   ["with demand D(p) = A·p^(−1/2), a monopolist's problem has no solution.",1,"Revenue rises and cost falls as p rises, forever."]])}],
 integ:[
  ()=>{const P=pick([5,8,10,20]),e=pick([-2,-2.5,-4,-5]),q0=R(2,10)*10000,mr=P*(1+1/e),mc=Math.round(mr)+pick([-1,1,2]),dq=pick([10,20,-10,-20]);const ans=(mr-mc)*dq;
   return NQ(`A firm sells ${f(q0)} units at $${P}; elasticity is ${e}; MC is $${mc}. MR and MC are close to constant from ${f(q0-100)} to ${f(q0+100)} units. What is the impact on profit of producing ${f(q0+dq)} instead of ${f(q0)}?`,ans,`MR = ${f(mr)}. ΔΠ ≈ (${f(mr)} − ${mc}) × ${dq} = <b>${f(ans)}</b>`,[(P-mc)*dq,-ans,(mr-mc),mr*dq],{allowNeg:true});},
  ()=>{const P=pick([4,5,6,8,10,12,15,16,20,24,25,30,40]),e=pick([-1.25,-1.5,-2,-2.5,-3,-4,-5]);const mr=P*(1+1/e);return NQ(`A firm charges $${P}, and the elasticity of demand there is ${e}. What marginal cost would make this price profit-maximizing?`,mr,`MC = MR = ${P}(1 + 1/${e}) = <b>${f(mr)}</b>`,[P,P*(1+e),P/Math.abs(e),P*(1-1/e)]);}]},

{id:'S10',name:'Tax pass-through',short:'Pass-through',prereq:['S9'],class:'Class 3 / Week 2',
 intro:'A per-unit tax t raises effective MC to c + t. Linear demand with constant MC: price rises t/2. Constant elasticity −α: price rises t·α/(α − 1) > t.',
 micros:[
 {id:'S10a',name:'Effective marginal cost',explain:'Tax t per unit: MC + t. Subsidy s: MC − s.',
  gen:()=>{const c=R(2,12),t=R(1,4),k=pick(['tax','subsidy']);const v=k==='tax'?c+t:c-t;return NQ(`A producer's marginal cost is ${c}. The government levies a ${k} of ${t} per unit sold on the producer. What is its effective marginal cost?`,v,`${c} ${k==='tax'?'+':'−'} ${t} = <b>${v}</b>`,[k==='tax'?c-t:c+t,c,c*t]);}},
 {id:'S10b',name:'Linear demand, constant MC',explain:'p = (a + c + t)/2: the price rises by t/2.',
  gen:()=>{const M=linMono(),t=R(1,4);return NQ(`A monopolist faces P(q) = ${Pstr(M.a,M.B)} and constant marginal cost ${M.c}. A tax of ${t} per unit is levied on it. What is the new price?`,(M.a+M.c+t)/2,`(${M.a} + ${M.c} + ${t})/2 = <b>${f((M.a+M.c+t)/2)}</b> (up ${f(t/2)})`,[M.pM+t,M.pM,(M.a+M.c)/2+2*t,M.c+t]);}},
 {id:'S10c',name:'Constant-elasticity pass-through',explain:'p = (c + t)·α/(α − 1), so Δp = t·α/(α − 1).',
  gen:()=>{const a=pick([1.5,2,3,4,5]),t=pick([0.5,1,1.5,2,2.5,3,4,5]);return NQ(`${pick(['A monopolist','A patent holder','A sole supplier'])} faces demand with constant elasticity −${a} and has constant marginal cost. A tax of ${t} per unit is levied on the monopolist. By how much does the price rise?`,t*a/(a-1),`${t} × ${a}/${f(a-1)} = <b>${f(t*a/(a-1))}</b>`,[t,t/2,t*(a-1)/a,t*a]);}},
 {id:'S10d',name:'Linear demand, rising MC',explain:'P = a − bq, MC = dq: Δp = t·b/(2b + d), less than t/2.',
  gen:()=>{const b=pick([1,0.5]),d=pick([1,0.5,2]),t=R(1,6),a=R(10,30);const dp=t*b/(2*b+d);return NQ(`A monopolist faces P(q) = ${a} − ${bStr(b)} with cost C(q) = ${costStr(d)}. A tax of ${t} per unit is imposed. By how much does the price rise?`,dp,`q = (${a} − t)/${2*b+d} → Δp = ${b}×${t}/${2*b+d} = <b>${f(dp)}</b>`,[t/2,t,t*b/(b+d),t/(2*b+d)]);}},
 {id:'S10e',name:'Key ideas',explain:'Market power is not the same as full pass-through.',
  gen:TF([["a monopolist passes the full amount of any tax on to consumers, since it has market power.",0,"It was already at its best price; pass-through depends on demand's shape."],
   ["with constant-elasticity demand, price rises by more than the tax.",1,"Δp = t·α/(α − 1) &gt; t."],
   ["with linear demand and constant MC, a $2 tax raises the monopoly price by $1.",1,"Pass-through is ½."],
   ["rising marginal cost increases pass-through relative to constant MC.",0,"It lowers it: b/(2b + d) &lt; ½."],
   ["a per-unit tax on the producer works like an increase in its marginal cost.",1,"It pays c + t per unit sold."]])}],
 integ:[
  ()=>{const M=linMono(),t=R(1,4);const q=(M.a-M.c-t)*M.B/2;return NQ(`A monopolist faces P(q) = ${Pstr(M.a,M.B)} and constant MC ${M.c}. A tax of ${t} per unit is levied. How much revenue does the tax raise?`,t*q,`q = (${M.a} − ${M.c+t})×${f(M.B)}/2 = ${f(q)}. Revenue = ${t}×${f(q)} = <b>${f(t*q)}</b>`,[t*M.qM,t*q*2,t*(M.a-M.c-t)*M.B,q]);},
  ()=>{const t=pick([1,2,3,4]);if(Math.random()<0.5){const a=pick([1.5,2,3,4]);return CQ(`The same tax of ${t} per unit hits two monopolists with constant MC. One faces linear demand; the other faces constant elasticity −${a}. Which price rises more?`,'Constant elasticity',['Linear','Same increase'],`Linear: ${f(t/2)}. Constant elasticity: ${f(t*a/(a-1))}. <b>Constant elasticity</b>.`);}const d=pick([1,0.5,2]);return CQ(`The same tax of ${t} per unit hits two monopolists facing P(q) = 20 − q. One has constant MC; the other has C(q) = ${costStr(d)}. Whose price rises more?`,'Constant MC',['Rising MC','Same increase'],`Constant MC: ${f(t/2)}. Rising MC: ${f(t/(2+d))}. <b>Constant MC</b>.`);}]},

// ---------------------------------------------------------------- S11
{id:'S11',name:'Price ceilings on a monopolist',short:'Price ceilings',prereq:['S7'],class:'Class 3 / Weeks 2–3',
 intro:'A binding ceiling makes MR flat at p̄ up to D(p̄): no volume–margin tradeoff. The firm produces min{D(p̄), the q where MC = p̄}.',

 {id:'S11a',name:'Does the ceiling bind?',explain:'Only if p̄ is below the unregulated monopoly price.',

 {id:'S11b',name:'Quantity with constant MC',explain:'If c < p̄ < p<sub>M</sub>, every unit earns p̄ − c > 0: the firm sells all demanded, D(p̄).',
  gen:()=>{const M=linMono();const pb=R(M.c+1,Math.ceil(M.pM)-1);const q=(M.a-pb)*M.B;return NQ(`A monopolist faces P(q) = ${Pstr(M.a,M.B)} with constant MC ${M.c}. The regulator imposes a price ceiling of ${pb}. What quantity is sold?`,q,`D(${pb}) = (${M.a} − ${pb})×${f(M.B)} = <b>${f(q)}</b>`,[M.qM,M.qS,q/2,(M.a-M.c)*M.B]);}},

   return NQ(`Inverse demand is P(q) = ${M.a} − ${bStr(M.b)} and costs are C(q) = ${costStr(M.d)}. A price ceiling of ${pb} is imposed. What is the monopolist's quantity?`,q,`D(${pb}) = ${f(D)}; MC = ${pb} at q = ${f(S)}. min → <b>${f(q)}</b>`,[Math.max(D,S),M.qM,M.qS,D===q?S:D].filter(x=>Math.abs(x-q)>0.01));}},
 {id:'S11d',name:'Shortage size',explain:'Shortage = D(p̄) − quantity produced.',
  gen:()=>{const M=rising();const pb=R(Math.max(1,Math.ceil(M.pS)-5),Math.max(1,Math.floor(M.pS)-1));const D=(M.a-pb)/M.b,S=pb/M.d;
   return NQ(`Inverse demand is P(q) = ${M.a} − ${bStr(M.b)} and costs are C(q) = ${costStr(M.d)}. A price ceiling of ${pb} is imposed. How large is the shortage?`,Math.max(0,D-S),`D(${pb}) = ${f(D)}, produced = ${f(S)} → <b>${f(D-S)}</b>`,[D,S,D-M.qM,M.qS-S]);}},
 {id:'S11e',name:'The kink in MR',explain:'Left of D(p̄): MR = p̄. Right of it: the original MR, a − 2q/B.',
  gen:()=>{const M=linMono(),pb=R(M.c+1,Math.ceil(M.pM)-1);const qb=(M.a-pb)*M.B;return NQ(`Inverse demand is P(q) = ${Pstr(M.a,M.B)}, and there is a price ceiling of ${pb}. Just to the right of q = ${f(qb)}, what is marginal revenue?`,M.a-2*qb/M.B,`MR = ${M.a} − 2q/${f(M.B)} at ${f(qb)} → <b>${f(M.a-2*qb/M.B)}</b> (drops from ${pb})`,[pb,M.a-qb/M.B,M.c,pb-(M.a-2*qb/M.B)]);}},
 {id:'S11f',name:'Key ideas',explain:'Ceilings can raise a monopolist\'s output.',
  gen:TF([["a price ceiling on a monopolist always reduces output.",0,"Between p<sub>S</sub> and p<sub>M</sub> it raises output; the firm's MR becomes flat at p̄."],
   ["a ceiling above the monopoly price has no effect.",1,"The firm already wants to charge less."],
   ["with constant MC, a binding ceiling above MC never causes a shortage.",1,"Each unit earns p̄ − c &gt; 0, so the firm sells all that's demanded."],
   ["a ceiling equal to the efficient price (P = MC) implements the surplus-maximizing quantity.",1,"MR is flat at p̄ up to D(p̄), which equals the MC crossing."],
   ["under a binding ceiling, marginal revenue is constant up to D(p̄).",1,"Selling less doesn't raise the price on other units."],
   ["a very low ceiling (below where MC meets demand) can reduce output below the monopoly level.",1,"With rising MC, the firm stops where MC = p̄."]])}],
 integ:[
  ()=>{const M=rising();return NQ(`Inverse demand is P(q) = ${M.a} − ${bStr(M.b)} and costs are C(q) = ${costStr(M.d)}. Ceilings below the monopoly price raise output only if they're above some level. What level?`,M.d*M.qM,`q<sub>M</sub> = ${f(M.qM)}. Need p̄/${M.d} &gt; ${f(M.qM)} → p̄ &gt; <b>${f(M.d*M.qM)}</b>`,[M.pS,M.pM,M.qM,M.d*M.qS]);},
  ()=>{let M,lo,hi;do{M=rising();lo=Math.floor(M.pS)+1;hi=Math.ceil(M.pM)-1;}while(hi<lo);const pb=R(lo,hi);const q=Math.min((M.a-pb)/M.b,pb/M.d),pi=pb*q-M.d*q*q/2;
   return NQ(`Inverse demand is P(q) = ${M.a} − ${bStr(M.b)} and costs are C(q) = ${costStr(M.d)}. With a price ceiling of ${pb}, what is the monopolist's profit?`,pi,`q = min{${f((M.a-pb)/M.b)}, ${f(pb/M.d)}} = ${f(q)}. Π = ${f(pb*q)} − ${f(M.d*q*q/2)} = <b>${f(pi)}</b>`,[pb*q,pb*q-M.d*q*q,M.pM*M.qM-M.d*M.qM**2/2,pi*2]);}]},

// ---------------------------------------------------------------- S12
{id:'S12',name:'Consumer surplus, producer surplus, DWL',short:'Surplus and DWL',prereq:['S1','S7'],class:'Class 4 / Weeks 2–3',
 intro:'CS: area under demand above price. PS: area above MC below price. Total surplus is maximized where P = MC; the shortfall at the monopoly quantity is dead-weight loss. Payments cancel in total surplus.',
 micros:[
 {id:'S12a',name:'Consumer surplus (triangle)',explain:'Linear demand: CS = ½ × q × (choke price − p).',
  gen:()=>{const B=pick([1,2,4,5,10,100,1000]),a=R(10,40),p=R(1,a-2);const q=(a-p)*B;return NQ(`Inverse demand is P(q) = ${Pstr(a,B)} and the price is ${p}. What is consumer surplus?`,0.5*q*(a-p),`q = ${f(q)}. CS = ½ × ${f(q)} × ${a-p} = <b>${f(0.5*q*(a-p))}</b>`,[q*(a-p),0.5*q*p,0.5*q*a,0.25*q*(a-p)]);}},
 {id:'S12b',name:'Producer surplus',explain:'Constant MC: PS = (p − c)q. C = (d/2)q²: PS = pq − (d/2)q².',
  gen:()=>{if(Math.random()<0.5){const p=R(8,30),c=R(1,p-1),q=R(5,50)*10;return NQ(`Price ${p}, constant marginal cost ${c}, quantity ${q}. What is producer surplus?`,(p-c)*q,`(${p} − ${c}) × ${q} = <b>${f((p-c)*q)}</b>`,[p*q,0.5*(p-c)*q,c*q]);}
   const d=pick([1,0.5,2]),q=R(4,20),p=d*q+R(1,10);return NQ(`Price ${p}, cost C(q) = ${costStr(d)}, quantity ${q}. What is producer surplus?`,p*q-d*q*q/2,`${p*q} − ${f(d*q*q/2)} = <b>${f(p*q-d*q*q/2)}</b>`,[p*q-d*q*q,p*q,0.5*(p-d*q)*q]);}},
 {id:'S12c',name:'Efficient quantity',explain:'Total surplus is maximized where P(q) = MC.',
  gen:()=>{const M=linMono();return NQ(`Inverse demand is P(q) = ${Pstr(M.a,M.B)} and marginal cost is constant at ${M.c}. What quantity maximizes total surplus?`,M.qS,`${Pstr(M.a,M.B)} = ${M.c} → q = <b>${f(M.qS)}</b>`,[M.qM,M.a*M.B,M.qS*1.5,M.qS-M.B]);}},
 {id:'S12d',name:'Dead-weight loss (constant MC)',explain:'DWL = ½ × (q<sub>S</sub> − q<sub>M</sub>) × (p<sub>M</sub> − c).',
  gen:()=>{const M=linMono();const dwl=0.5*(M.qS-M.qM)*(M.pM-M.c);return NQ(`A monopolist faces P(q) = ${Pstr(M.a,M.B)} with constant MC ${M.c}. What is the dead-weight loss?`,dwl,`q<sub>S</sub> = ${f(M.qS)}, q<sub>M</sub> = ${f(M.qM)}, p<sub>M</sub> − c = ${f(M.pM-M.c)}. ½ × ${f(M.qS-M.qM)} × ${f(M.pM-M.c)} = <b>${f(dwl)}</b>`,[2*dwl,0.5*M.qS*(M.pM-M.c),0.5*(M.qS-M.qM)*(M.a-M.c),0.5*M.qS*(M.a-M.c),M.pM*M.qM-M.c*M.qS]);}},
 {id:'S12e',name:'Key ideas',explain:'Surplus maximization and its limits.',
  gen:TF([["aggregate gains from trade depend on the prices paid.",0,"Payments cancel; only valuations and costs remain."],
   ["producer's surplus equals profit when there are no fixed costs.",1,"Profit = PS − F."],
   ["the surplus-maximizing uniform price equals marginal cost.",1,"GFT′(q) = P(q) − C′(q) = 0."],
   ["dead-weight loss is a lower bound on the gain from correcting monopoly.",0,"Upper bound (Tirole): real interventions rarely hit P = MC."],
   ["“the ceiling raises total surplus by 18” is a normative claim.",0,"It's descriptive; “so we should impose it” needs a normative premise."],
   ["under the surplus maximization principle, a costless theft is not socially harmful.",1,"It's a transfer; Becker locates the harm in resources spent on theft and protection."],
   ["a patent's monopoly dead-weight loss settles whether the patent is bad policy.",0,"The monopoly rewards innovation that might not happen otherwise."]])}],
 integ:[
  ()=>{const M=rising();const dwl=0.5*(M.qS-M.qM)*(M.pM-M.d*M.qM);return NQ(`A monopolist faces P(q) = ${M.a} − ${bStr(M.b)} with cost C(q) = ${costStr(M.d)}. What is the dead-weight loss?`,dwl,`q<sub>M</sub> = ${f(M.qM)}, q<sub>S</sub> = ${f(M.qS)}; at q<sub>M</sub>, P − MC = ${f(M.pM-M.d*M.qM)}. ½ × ${f(M.qS-M.qM)} × ${f(M.pM-M.d*M.qM)} = <b>${f(dwl)}</b>`,[0.5*(M.qS-M.qM)*(M.pM-M.pS),(M.qS-M.qM)*(M.pM-M.d*M.qM),dwl/2,0.5*M.qM*(M.pM-M.d*M.qM)]);},
  ()=>{const M=rising();const cs=0.5*M.qM*(M.a-M.pM),ps=M.pM*M.qM-M.d*M.qM**2/2;return NQ(`A monopolist faces P(q) = ${M.a} − ${bStr(M.b)} with cost C(q) = ${costStr(M.d)}. What is total surplus at the monopoly outcome?`,cs+ps,`CS = ${f(cs)}, PS = ${f(ps)} → <b>${f(cs+ps)}</b>`,[cs,ps,0.5*M.qS*(M.a-M.pS)+M.pS*M.qS-M.d*M.qS**2/2,cs+M.pM*M.qM]);}]},

// ---------------------------------------------------------------- S13
{id:'S13',name:'Fixed costs: whether to produce at all',short:'Fixed costs',prereq:['S12','S5'],class:'Class 4',
 intro:'P = MC says how much to produce given that you produce. Whether to produce compares total surplus with the avoidable (quasi-fixed) cost. A uniform-price monopolist captures only part of the surplus, so it may skip a good worth producing.',
 micros:[
 {id:'S13a',name:'Socially worth producing?',explain:'With avoidable F: produce iff CS at marginal-cost pricing > F.',
  gen:()=>{const B=pick([1,2]),a=R(14,30),c=R(1,a-8);const cs=0.5*(a-c)**2*B;const F=Math.round(cs*pick([0.7,0.9,1.1,1.3]));const y=cs>F;
   return CQ(`Inverse demand is P(q) = ${Pstr(a,B)} and C(q) = ${c}q + ${F}, where ${F} is avoidable by producing nothing. Is positive production surplus-maximizing?`,y?'Yes':'No',[y?'No':'Yes'],`At P = MC: q = ${(a-c)*B}, CS = ${f(cs)}, PS = 0. ${f(cs)} − ${F} = ${f(cs-F)}: <b>${y?'yes':'no'}</b>.`);}},
 {id:'S13b',name:'Will the monopolist produce?',explain:'It produces only if (p<sub>M</sub> − c)q<sub>M</sub> > F.',
  gen:()=>{const B=pick([1,2]),a=R(14,30),c=R(1,a-8);const pi=(a-c)**2*B/4;const F=Math.round(pi*pick([0.6,0.9,1.2,1.6]));const y=pi>F;
   return CQ(`Inverse demand is P(q) = ${Pstr(a,B)} and C(q) = ${c}q + ${F}, with ${F} avoidable. Does an unregulated monopolist produce?`,y?'Yes':'No',[y?'No':'Yes'],`q<sub>M</sub> = ${f((a-c)*B/2)}, p<sub>M</sub> = ${f((a+c)/2)}: operating profit ${f(pi)} vs ${F}. <b>${y?'Yes':'No'}</b>.`);}},
 {id:'S13c',name:'Key ideas',explain:'Sunk vs. quasi-fixed.',
  gen:TF([["a sunk fixed cost can make producing nothing the surplus-maximizing choice.",0,"It's paid either way."],
   ["an avoidable (quasi-fixed) cost can make producing nothing surplus-maximizing.",1,"If total surplus at P = MC doesn't cover it."],
   ["the marginal-cost pricing rule tells you whether to produce at all.",0,"Only how much, given positive production."],
   ["a monopolist may refuse to produce a good whose production would raise total surplus.",1,"It captures only part of the surplus it creates."],
   ["under marginal-cost pricing with fixed costs, the producer covers its fixed cost.",0,"PS = 0, so it loses F."]])}],
 integ:[
  ()=>{const B=pick([1,2]),a=R(14,30),c=R(1,a-8);const pi=(a-c)**2*B/4;return NQ(`Inverse demand is P(q) = ${Pstr(a,B)} and C(q) = ${c}q + F, with F avoidable. Above what F does an unregulated monopolist refuse to produce?`,pi,`(p<sub>M</sub> − c)q<sub>M</sub> = ${f((a-c)/2)} × ${f((a-c)*B/2)} = <b>${f(pi)}</b>`,[0.5*(a-c)**2*B,(a+c)/2*(a-c)*B/2,(a-c)*B/2*a/2,pi*1.5,pi*0.75]);},
  ()=>{const B=pick([1,2]),a=R(14,30),c=R(1,a-8);const cs=0.5*(a-c)**2*B;return NQ(`Inverse demand is P(q) = ${Pstr(a,B)} and C(q) = ${c}q + F, with F avoidable. Up to what F is producing the good surplus-maximizing?`,cs,`At P = MC: ½ × ${(a-c)*B} × ${a-c} = <b>${f(cs)}</b>`,[cs/2,(a-c)**2*B,cs*0.75]);}]},

// ---------------------------------------------------------------- S14
{id:'S14',name:'Price discrimination: third-degree vs. uniform',short:'Price discrim.',prereq:['S9'],class:'Week 2 supplement',
 intro:'Third-degree: one price per identifiable group. With constant MC each group is its own monopoly (MR = MC, Lerner). Uniform: add demands horizontally and solve one monopoly. The more elastic group gets the lower price.',
 micros:[
 {id:'S14a',name:'Group price with constant elasticity (museum)',explain:'Each group: p = c·α/(α − 1), using that group\'s elasticity.',
  gen:()=>{const c=pick([2,3,4,5,6,8]),aA=pick([1.5,2]),aS=pick([3,4,5]);const who=pick(['adult','student']);const a=who==='adult'?aA:aS;
   return NQ(`A private museum's marginal cost per visitor is $${c}. Adult demand is D_A(p) = ${pick([1440,3600])}·p^(−${aA}); student demand is D_S(p) = ${pick([40960,81920])}·p^(−${aS}). It checks student IDs at the door. What ${who} ticket price maximizes profit?`,c*a/(a-1),
   `|ε| = ${a}: p = ${c} × ${a}/${f(a-1)} = <b>$${f(c*a/(a-1))}</b>`,[c*(who==='adult'?aS:aA)/((who==='adult'?aS:aA)-1),c*a,c/(a-1),c*2]);}},
 {id:'S14b',name:'Group price with linear demand',explain:'P = A − q, MC c: p = (A + c)/2 in that group.',
  gen:()=>{const M=disc(),i=pick([1,2]);const A=i===1?M.A1:M.A2;return NQ(`A monopolist with MC ${M.c} sells to two groups it can tell apart: P${sub(1)} = ${M.A1} − q${sub(1)}, P${sub(2)} = ${M.A2} − q${sub(2)}. It sets a separate price for each. What does group ${i} pay?`,(A+M.c)/2,`MR = ${A} − 2q = ${M.c} → p = <b>${f((A+M.c)/2)}</b>`,[M.pu,(M.A1+M.A2)/4,A/2,(A-M.c)/2]);}},
 {id:'S14c',name:'Adding demands horizontally',explain:'At price p, total quantity = q₁(p) + q₂(p) (only groups that buy).',
  gen:()=>{const M=disc();const p=R(M.c+1,M.A2-1);return NQ(`Group demands are q${sub(1)} = ${M.A1} − p and q${sub(2)} = ${M.A2} − p. What is total quantity demanded at p = ${p}?`,M.A1+M.A2-2*p,`(${M.A1} − ${p}) + (${M.A2} − ${p}) = <b>${M.A1+M.A2-2*p}</b>`,[M.A1+M.A2-p,M.A1-p,(M.A1+M.A2)/2-p]);}},
 {id:'S14d',name:'The uniform price',explain:'Q = (A₁ + A₂) − 2p → MR = (A₁+A₂)/2 − Q. Set MR = c, then check both groups buy.',
  gen:()=>{const M=disc();return NQ(`A monopolist with MC ${M.c} sells to two groups with P${sub(1)} = ${M.A1} − q${sub(1)} and P${sub(2)} = ${M.A2} − q${sub(2)}. Resale makes discrimination impossible, so it charges one price. What is it?`,M.pu,`Q = ${M.A1+M.A2} − 2p; MR = ${f((M.A1+M.A2)/2)} − Q = ${M.c} → p = <b>${f(M.pu)}</b> (&lt; ${M.A2} ✓)`,[(M.A1+M.c)/2,(M.A2+M.c)/2,(M.A1+M.A2)/4,(M.A1+M.A2+M.c)/2]);}},
 {id:'S14e',name:'Key ideas',explain:'When discrimination works and whom it helps.',
  gen:TF([["under third-degree discrimination, the more elastic group pays the higher price.",0,"Lerner: smaller markup for the more elastic group."],
   ["with constant marginal cost, each group can be treated as a separate monopoly problem.",1,"Selling to one group doesn't change the cost of selling to the other."],
   ["if adults can borrow student IDs, the museum's price discrimination breaks down.",1,"Arbitrage pushes everyone to the low price."],
   ["banning price discrimination always helps every consumer.",0,"The low-price group pays more under a uniform price."],
   ["third-degree discrimination means the firm sets P = MC.",0,"That's perfect (first-degree) discrimination. Third-degree sets MR = MC in each group."],
   ["price discrimination can raise total surplus by opening a market a uniform price would abandon.",1,"Then it can be a Pareto improvement."]])}],
 integ:[
  ()=>{const M=disc();const q2d=(M.A2-M.c)/2,q2u=M.A2-M.pu;const d=0.5*q2u*q2u-0.5*q2d*q2d;return NQ(`MC ${M.c}; P${sub(1)} = ${M.A1} − q${sub(1)}, P${sub(2)} = ${M.A2} − q${sub(2)}. If price discrimination is banned, by how much does group 2's consumer surplus change?`,d,`Discrimination: q${sub(2)} = ${f(q2d)}, CS = ${f(0.5*q2d*q2d)}. Uniform p = ${f(M.pu)}: q${sub(2)} = ${f(q2u)}, CS = ${f(0.5*q2u*q2u)}. <b>${f(d)}</b>`,[-d,0.5*q2u*q2u,q2u-q2d,0.5*(M.A1-M.pu)**2-0.5*((M.A1-M.c)/2)**2]);},
  ()=>{const M=disc();const pi=(M.pu-M.c)*(M.A1+M.A2-2*M.pu),pd=((M.A1-M.c)/2)**2+((M.A2-M.c)/2)**2;return NQ(`MC ${M.c}; P${sub(1)} = ${M.A1} − q${sub(1)}, P${sub(2)} = ${M.A2} − q${sub(2)}. How much profit does the firm lose when it must switch from discrimination to a uniform price?`,pd-pi,`Discrimination: ${f(pd)}. Uniform (p = ${f(M.pu)}): ${f(pi)}. Loss = <b>${f(pd-pi)}</b>`,[pd,pi,((M.A1-M.c)/2)**2-pi,pd-((M.A1-M.c)/2)**2]);}]},

// ---------------------------------------------------------------- S15
{id:'S15',name:'Pareto and Kaldor–Hicks',short:'Pareto & K–H',prereq:['S12'],class:'Class 5',
 intro:'x Pareto dominates y if someone is better off and no one worse off. Kaldor–Hicks asks only whether winners could compensate losers. With lump-sum transfers, any surplus-increasing change can become a Pareto improvement.',
 micros:[
 {id:'S15a',name:'Classifying two options',explain:'Compare person by person: all ≥ with one > is dominance; some each way is noncomparable; all equal is indifferent.',
  gen:()=>{const t=pick(['xd','yd','nc','nc','ind']);const y=[R(0,8),R(0,8),R(0,8)];let x=y.slice();const i=R(0,2),j=(i+1)%3;
   if(t==='xd'){x[i]+=R(1,4);if(Math.random()<0.5)x[j]+=R(1,3);}if(t==='yd')x[i]-=R(1,4);if(t==='nc'){x[i]+=R(2,6);x[j]-=R(1,2);}
   const lab={xd:'x Pareto dominates y',yd:'y Pareto dominates x',nc:'Pareto noncomparable',ind:'Pareto indifferent'};
   return CQ(`Surpluses for three people: x = (${x.join(', ')}), y = (${y.join(', ')}). How do x and y compare?`,lab[t],Object.values(lab).filter(v=>v!==lab[t]),`${x.map((v,k)=>`${v} vs ${y[k]}`).join('; ')}. <b>${lab[t]}</b>.`);}},
 {id:'S15b',name:'Kaldor–Hicks test',explain:'Kaldor–Hicks improvement iff total gains exceed total losses (compensation need not be paid).',
  gen:()=>{let d;do{d=[R(-8,10),R(-8,10),R(-8,10)];}while(sum(d)===0||d.every(x=>x>=0));const y=sum(d)>0;
   const r=y?'Kaldor–Hicks improvement, not a Pareto improvement':'Neither';
   return CQ(`A policy changes three people's surpluses by (${d.join(', ')}). It is a:`,r,[y?'Neither':'Kaldor–Hicks improvement, not a Pareto improvement','Pareto improvement'],`Sum = ${sum(d)}; someone loses. <b>${r}</b>.`);}},
 {id:'S15c',name:'The notes\' transfer scheme',explain:'δᵢ = vᵢ(d₁) − vᵢ(d₂); Δ = Σδᵢ; tᵢ = Δ/n − δᵢ. Each person ends with vᵢ(d₂) + Δ/n.',
  gen:()=>{let d;do{d=[R(-6,10),R(-6,10),R(-6,10)];}while(sum(d)<=0);const k=R(0,2);const t=sum(d)/3-d[k];return NQ(`Moving from d₂ to d₁ changes three people's surpluses by δ = (${d.join(', ')}). Using tᵢ = Δ/n − δᵢ, what is person ${k+1}'s transfer? (Negative = pays.)`,t,`Δ/3 = ${f(sum(d)/3)}; t${sub(k+1)} = ${f(sum(d)/3)} − (${d[k]}) = <b>${f(t)}</b>`,[-d[k],sum(d)/3,sum(d)/3+d[k],-t],{allowNeg:true});}},
 {id:'S15d',name:'Key ideas',explain:'Pareto concepts and compensation criteria.',
  gen:TF([["moving from unregulated monopoly to price regulation (no transfers) is a Pareto improvement.",0,"Profit falls: the monopolist was already maximizing."],
   ["unregulated and regulated monopoly are Pareto noncomparable.",1,"The firm prefers one; consumers the other."],
   ["Alice selling her car at $12,000 vs. at $15,000 are Pareto noncomparable.",1,"Alice prefers the higher price, Bob the lower."],
   ["with lump-sum transfers, any surplus-increasing change can be made a Pareto improvement.",1,"Use tᵢ = Δ/n − δᵢ."],
   ["a Pareto efficient outcome Pareto dominates every other outcome.",0,"It can be noncomparable with others; that's why “Pareto optimal” is a misleading name."],
   ["Wicksell held that a public expenditure is justified only if it benefits everyone.",1,"He saw forcing someone to pay against their interest as unjust."],
   ["Reinhardt's punch example is a Kaldor–Hicks improvement.",1,"$1,000 &gt; $600, even though no compensation is paid. That's his objection."],
   ["Kaplow argues for analyzing a policy's efficiency separately from redistribution.",1,"So good policies aren't rejected for unwanted redistribution that could be undone elsewhere."],
   ["in a second-best world with only “regulate” or “don't,” unregulated monopoly is Pareto efficient.",1,"Neither option dominates the other."],
   ["unregulated monopoly is first-best Pareto efficient.",0,"Regulation plus transfers would dominate it."]])}],
 integ:[
  ()=>{let v1,v2;do{v1=[R(0,15),R(0,15),R(-4,6)];v2=[R(0,10),R(0,10),R(0,6)];}while(sum(v1)<=sum(v2));const k=R(0,2);const D=sum(v1)-sum(v2);
   return NQ(`Decision d₁ gives surpluses (${v1.join(', ')}); d₂ gives (${v2.join(', ')}). With tᵢ = Δ/n − δᵢ, what is person ${k+1}'s net surplus under d₁?`,v2[k]+D/3,`Δ = ${D}. v${sub(k+1)}(d₂) + Δ/3 = ${v2[k]} + ${f(D/3)} = <b>${f(v2[k]+D/3)}</b>`,[v1[k],v1[k]+D/3,v2[k],v2[k]+D]);},
  ()=>{const W=R(6,15)*100,C=R(2,5)*100;return NQ(`I'd pay up to $${W} to punch you in the nose; you'd accept $${C}. The punch happens and I pay nothing. By Kaldor–Hicks, what is the gain in social welfare?`,W-C,`${W} − ${C} = <b>${W-C}</b>. K–H improvement, not Pareto.`,[W,C,-C,W+C]);}]},

// ---------------------------------------------------------------- S16
{id:'S16',name:'Weighted surplus',short:'Welfare weights',prereq:['S15'],class:'Class 5',
 intro:'Weighted surplus Σ gᵢvᵢ makes value judgments explicit. Equal weights give total surplus maximization. An analyst can report the weight ratio at which a policy becomes worth it.',
 micros:[
 {id:'S16a',name:'Weighted change',explain:'Multiply each group\'s change by its weight; add.',

{id:'S17',name:'Policy toward a foreign monopolist',short:'Foreign monopoly',prereq:['S10','S11','S16'],class:'Class 6 (Freedonia)',
 intro:'The importing country counts its consumers\' surplus plus its own budget; the foreign firm\'s profit gets weight 0. A tax captures foreign rent; a subsidy mostly enriches the firm unless pass-through is high. A binding ceiling makes the firm absorb an import tax entirely.',
 micros:[
 {id:'S17a',name:'The monopoly outcome',explain:'MR = MC: q = (a − c)B/2, p = (a + c)/2; profit = (p − c)q.',
  gen:()=>{const F=foreign(),w=pick(['price','quantity','profit']);const v={price:F.pM,quantity:F.qM,profit:(F.pM-F.c)*F.qM}[w];
   const d={price:[F.c,F.a/2,F.a-F.c],quantity:[(F.a-F.c)*F.B,F.a*F.B/2,F.qM/2],profit:[F.pM*F.qM,(F.pM-F.c)*F.qM/2,0.5*F.qM*(F.a-F.pM)]}[w];
   return NQ(`${(typeof CURLV!=='undefined'&&CURLV>1)?F.short:F.story} If the firm in ${F.abroad} can set any single price, what ${w==='profit'?'profit does it earn':w==='price'?'price maximizes its profit':'quantity is sold'}?`,v,`MR = ${F.a} − 2q/${F.B} = ${F.c} → q = ${f(F.qM)}, p = ${f(F.pM)}${w==='profit'?`, Π = ${f(F.pM-F.c)} × ${f(F.qM)}`:''}. <b>${f(v)}</b>`,d);}},
 {id:'S17b',name:'Welfare under a tax',explain:'W = CS + t·q at the post-tax outcome. Price rises t/2.',
  gen:()=>{const F=foreign(),t=R(1,Math.max(1,Math.floor((F.a-F.c)/3)));const x=W(F,t),o=W(F,0);return NQ(`${(typeof CURLV!=='undefined'&&CURLV>1)?F.short:F.story} ${F.home} levies a tax of ${t} per unit on the producer. Counting consumer surplus plus tax revenue, what is ${F.home}'s welfare?`,x.w,`q = ${f(x.q)}, p = ${f(x.p)}. CS = ${f(x.cs)}, revenue = ${f(x.rev)}. <b>${f(x.w)}</b>`,[x.cs,o.w,x.cs+t*o.q,x.w+x.pi]);}},
 {id:'S17c',name:'Welfare under a subsidy',explain:'W = CS − s·q. The subsidy is paid on every unit.',

 {id:'S17e',name:'Largest tax before the firm exits',explain:'With avoidable cost K: (p̄ − c − t)·D(p̄) ≥ K ⇔ t ≤ p̄ − c − K/D(p̄).',
