  <div class="row">${U&&!L?(ls==='blocked'?`<button class="primary" id="rm">Do the refreshers first</button>`:`<button class="primary" id="sl">${ls==='fresh'?'Start lesson':'Continue lesson'}</button>`):''}${L?`<button class="primary" id="sp">Practice 10 problems</button><button class="secondary" id="sl">Redo lesson</button>`:''}${!U?`<p class="note">Learn the skills it builds on first.</p>`:''}<button class="link" id="sc">Close</button></div></div>`;
 document.body.appendChild(ov);const close=()=>ov.remove();ov.onclick=e=>{if(e.target===ov)close();};$('#sc').onclick=close;
 const sl=$('#sl');if(sl)sl.onclick=()=>{close();lesson(s);};const sp=$('#sp');if(sp)sp.onclick=()=>{close();practice(s);};
 const rm=$('#rm');if(rm)rm.onclick=()=>{close();review(interleave(ST.lp[s.id].rem.filter(c=>ST.cards[c]&&ST.cards[c].due<=now())),'Refreshers');};(sp||sl||rm||$('#sc')).focus();}

// ---------- one problem ----------
// target: seconds; a correct answer slower than this counts as Hard (automaticity)
function problemView({p,label,progress,typed,reminder,target,onDone,onExit,noOverride}){
 let mode=typed?'typed':'mc',mc=p.kind==='mc'?{opts:p.opts,ans:p.ans}:null,usedChoices=false,done=false;const t0=Date.now();
 const render=()=>{if(mode==='mc'&&!mc)mc=mkOpts(p);try{if(/[?&]test\b/.test(location.search))window.__cur={p,mc,mode};}catch(e){}
  app().innerHTML=`<div class="bar"><button class="link" id="x">Exit</button><span>${progress||''}</span></div>
  <article class="card"><p class="cls">${esc(label)}</p>${reminder?`<div class="remind"><b>Reminder.</b> ${reminder}</div>`:''}<div class="q">${minus(p.q)}</div>
  ${mode==='mc'?`<div class="opts">${mc.opts.map((o,i)=>`<button class="opt" data-i="${i}"><span class="key">${i+1}</span>${minus(o)}</button>`).join('')}</div>`
   :`<form id="f" autocomplete="off"><input id="in" inputmode="decimal" enterkeyhint="done" placeholder="Your answer" aria-label="Your answer"><button class="primary" type="submit">Check</button></form>
    <p class="hint" id="hint">Numbers, fractions, or arithmetic like 36000/3 all work.</p>${noOverride?'':'<button class="link" id="sw">Show choices instead</button>'}`}
  ${target?`<p class="hint">Aim to answer within ${target} seconds.</p>`:''}
  <div id="fb"></div></article>`;
  $('#x').onclick=()=>{stopTick();(onExit||home)();};
  if(mode==='mc')document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>finish(+b.dataset.i===mc.ans,+b.dataset.i));
  else{$('#in').focus();$('#f').onsubmit=e=>{e.preventDefault();const v=$('#in').value;if(!v.trim())return;const r=isRight(p,v);if(r===null){const h=$('#hint');h.textContent='That isn\'t a number I can read. Try 4.5, −2, 3/4, or 1200.';h.classList.add('warn');return;}finish(r);};
   const sw=$('#sw');if(sw)sw.onclick=()=>{usedChoices=true;mode='mc';render();};}};
 const finish=(ok,given)=>{if(done)return;done=true;const sec=(Date.now()-t0)/1000;addXP(sec);const slow=!!(target&&sec>target);
  let g=ok?(usedChoices||reminder||slow?2:3):1;
  $('#fb').innerHTML=`<p class="verdict ${ok?'good':'bad'}">${ok?`✓ Correct${slow?` (${Math.round(sec)} s: speed comes with practice)`:''}`:`✗ Answer: ${minus(shownAns(p))}`}</p><div class="sol">${minus(p.sol)}</div>
   <div class="row"><button class="primary" id="nx">Next</button>${ok&&g===3&&!noOverride?'<button class="secondary" id="ez">Too easy</button>':''}${!ok&&!noOverride?'<button class="link" id="ov">I was right, count it</button>':''}</div>`;
  document.querySelectorAll('.opt').forEach(b=>{b.disabled=true;if(+b.dataset.i===mc.ans)b.classList.add('right');else if(+b.dataset.i===given)b.classList.add('wrong');});
  ['#sw','#hint'].forEach(s=>{const e=$(s);if(e)e.remove();});const inp=$('#in');if(inp)inp.disabled=true;
  $('#nx').onclick=()=>onDone(g,g>1,{sec,slow});$('#nx').focus();const ez=$('#ez');if(ez)ez.onclick=()=>onDone(4,true,{sec,slow});
  const ov=$('#ov');if(ov)ov.onclick=()=>{g=2;ov.remove();const v=$('.verdict');v.textContent='Counted as correct';v.className='verdict good';};};
 document.onkeydown=e=>{if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA')return;if(done){if(e.key==='Enter'&&$('#nx')){e.preventDefault();$('#nx').click();}return;}if(mode!=='mc')return;const i='abcd1234'.indexOf(e.key.toLowerCase())%4;if(i>=0&&i<mc.opts.length)finish(i===mc.ans,i);};
 render();return {expire:()=>{if(!done)finish(false,-1);}};}

// ---------- problem generation without repeats ----------
const hashQ=s=>{let h=0;for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))|0;return h.toString(36);};
let CURLV=1;
const genAt=(g,lv)=>{CURLV=lv;try{return g(lv);}finally{CURLV=1;}};
// Fresh problem for card cid: avoids the last few problems this card showed (lessons included)
function freshProblem(cid,g,lv){const seen=ST.seen[cid]||[];let p;for(let k=0;k<6;k++){p=genAt(g,lv);if(!seen.includes(hashQ(p.q)))break;}ST.seen[cid]=[...seen,hashQ(p.q)].slice(-8);return p;}
function makeProblem(it,lv,cid){const g=lv===3&&it.gen3&&Math.random()<0.6?it.gen3:it.gen;return cid?freshProblem(cid,g,lv):genAt(g,lv);}
const minus=s=>String(s).replace(/(^|[\s(=,:;|×\/+→])-(?=\d)/g,'$1−');

// ---------- review ----------
function review(ids,title='Review',o={}){const q=ids.slice(),covered=o.covered||{};let n=0,right=0,last=null,credited=0;const missed=[];
 const finishUp=()=>{if(o.onEnd)return o.onEnd({n,right,missed});const extra=credited?` ${credited} other ${credited===1?'review was':'reviews were'} covered along the way.`:'';endScreen(`${title} done`,`${right} of ${n} correct.${extra}`);};
 const step=()=>{if(!q.length)return finishUp();
  let i=nextIndex(q,last);if(i<0){if(ALL.filter(s=>learned(s.id)).length>1&&n>0)return finishUp();i=0;}
  const cid=q.splice(i,1)[0],it=itemFor(cid),card=ST.cards[cid];if(!it||!card)return step();last=it.skill.id;const lv=levelFor(card,it),p=makeProblem(it,lv,cid);
  problemView({p,label:`${it.skill.short||it.skill.name}: ${it.name}`,progress:`${n+1} of ${n+1+q.length}`,typed:wantsTyped(p,lv),reminder:lv===1?it.explain:'',target:lv===3?targetSec(it):0,onDone:(grade,ok)=>{n++;logAns(ok);rec(cid,'rt');if(ok){right++;rec(cid,'rr');}
   schedule(card,grade);
   if(ok)credited+=implicitCredit(cid).length;
   else{missed.push(cid);if(!o.noRequeue)q.splice(Math.min(q.length,3+R(0,2)),0,cid);(covered[cid]||[]).forEach(t=>{if(ST.cards[t]&&ST.cards[t].due<=now()&&!q.includes(t))q.push(t);});
    if(card.lapses>=2){const r=remediate(it.skill);if(r&&!q.includes(r))q.splice(1,0,r);}}
   save();step();}});};step();}
function practice(s){let n=0,right=0;const N=10;const pool=cardIds(s).map(id=>({id,it:itemFor(id)}));
 const step=()=>{if(n>=N)return endScreen('Practice done',`${right} of ${N} correct. Practice doesn't change your schedule.`);
  const {id,it}=pick(pool),lv=Math.random()<0.5?2:3,p=makeProblem(it,lv,id);problemView({p,label:`${s.short||s.name}: ${it.name}`,progress:`${n+1} of ${N}`,typed:wantsTyped(p,lv),onDone:(g)=>{n++;if(g>1)right++;logAns(g>1);save();step();}});};step();}

// ---------- lesson ----------
// Intro → warm-up → knowledge points in sittings of at most 4 → combined problems.
// Each knowledge point: explanation and worked example, then 2–5 questions. Pass = last answer right without a reminder, at least 2 right, more right than wrong.
// Not passed within 5 questions: the lesson halts and is retried later. A second failure on the same point assigns remedial reviews first.
const SIT=4;
function lesson(s){ST.lp=ST.lp||{};const saved=ST.lp[s.id]||null;const lp=saved||{mi:0,res:{},fails:{}};lp.fails=lp.fails||{};lp.res=lp.res||{};
 let mi=lp.mi||0;const res=lp.res;const n=s.micros.length;
 const keep=()=>{lp.mi=mi;ST.lp[s.id]=lp;save();};
 if(lpState(s.id)==='blocked')return endScreen('Refreshers first',`${s.name} is waiting on a few reviews of the skills it builds on. Do your reviews, then come back.`);
 const warm=saved?[]:Object.keys(encOf(s.id)).concat(s.prereq).filter((v,i,a)=>a.indexOf(v)===i&&SK[v]&&learned(v)).flatMap(x=>cardIds(SK[x])).filter(id=>ST.cards[id]&&live(id)&&ST.cards[id].state!=='new').sort((a,b)=>curR(ST.cards[a])-curR(ST.cards[b])).slice(0,2);
 const sitEnd=()=>Math.min(n,mi+SIT);let stop=sitEnd();
 const intro=()=>{const steps=[...(warm.length?['Warm-up: 2 items from the skills this builds on']:[]),...s.micros.map(m=>m.name),'Problems that put it together'];const off=warm.length?1:0;
  app().innerHTML=`<div class="bar"><button class="link" id="x">Exit</button><span>Lesson</span></div>
  <article class="card"><p class="cls">${esc(s.class||'')}</p><h2 class="lh">${esc(s.name)}</h2><p class="body">${s.intro}</p>
  <ol class="steps">${steps.map((t,i)=>{const k=i-off;const done=saved&&k>=0&&k<mi;return `<li class="${done?'done':''}">${esc(t)}${n>SIT&&k>0&&k<n&&k%SIT===0?' <span class="when">(new sitting)</span>':''}</li>`;}).join('')}</ol>
  ${saved&&lp.haltAt?'<p class="note">Last time this part didn\'t click. Here it is again with a fresh example.</p>':''}
  <button class="primary" id="go">${saved?`Resume at part ${mi+1}`:'Start'}</button></article>`;$('#x').onclick=home;$('#go').onclick=()=>warmup(0);$('#go').focus();};
 const warmup=k=>{if(k>=warm.length)return explain();const cid=warm[k],it=itemFor(cid),card=ST.cards[cid],p=freshProblem(cid,it.gen,2);
  problemView({p,label:`Warm-up: ${it.skill.short||it.skill.name}`,progress:`Warm-up ${k+1} of ${warm.length}`,typed:false,onDone:(g,ok)=>{logAns(ok);rec(cid,'rt');if(ok){rec(cid,'rr');implicitCredit(cid);}schedule(card,g);save();warmup(k+1);}});};
 const pause=()=>{document.onkeydown=null;app().innerHTML=`<article class="card end"><h2 class="lh">Good place to stop</h2><p class="body">You've finished ${mi} of ${n} parts of ${esc(s.name)}. Your place is saved; “Learn next” picks up here.</p>
  <div class="row"><button class="primary" id="kg">Keep going</button><button class="secondary" id="st">Stop for now</button></div></article>`;$('#kg').onclick=()=>{stop=sitEnd();explain();};$('#st').onclick=home;$('#kg').focus();};
 const explain=()=>{if(mi>=n)return integ(0,0);if(mi>=stop)return pause();const m=s.micros[mi],ex=genAt(m.gen,1);
  app().innerHTML=`<div class="bar"><button class="link" id="x">Exit</button><span>Part ${mi+1} of ${n+1}</span></div>
  <article class="card"><p class="cls">${esc(s.short||s.name)}</p><h2 class="lh">${esc(m.name)}</h2><p class="body">${m.explain}</p>
  <div class="worked"><p class="cls">Worked example</p><div class="q">${minus(ex.q)}</div><p class="ans">Answer: ${minus(shownAns(ex))}</p><div class="sol">${minus(ex.sol)}</div></div>
  <button class="primary" id="go">Try one</button></article>`;$('#x').onclick=home;$('#go').onclick=()=>drill({r:0,w:0,k:0,lastOK:null,firstOK:null});$('#go').focus();};
 const drill=st=>{const m=s.micros[mi];const scaff=st.k===0||st.lastOK===false;
  if(st.k>0&&st.lastOK&&!st.lastScaff&&st.r>=2&&st.r>st.w){rec(m.id,'lt');rec(m.id,'lp');if(st.firstOK)rec(m.id,'lf');res[m.id]=st.w===0&&st.k===2&&!lp.fails[m.id]?3:2;delete lp.haltAt;mi++;keep();return explain();}
  if(st.k>=5)return halt(m,st);
  problemView({p:freshProblem(m.id,m.gen,scaff?1:2),label:`${s.short||s.name}: ${m.name}`,progress:`Part ${mi+1}: question ${st.k+1}`,typed:false,reminder:scaff?m.explain:'',
   onDone:(g,ok)=>{logAns(ok);rec(m.id,'lq');if(ok)rec(m.id,'lr');save();drill({r:st.r+(ok?1:0),w:st.w+(ok?0:1),k:st.k+1,lastOK:ok,lastScaff:scaff,firstOK:st.k===0?ok:st.firstOK});}});};
 const halt=(m,st)=>{rec(m.id,'lt');if(st.firstOK)rec(m.id,'lf');lp.fails[m.id]=(lp.fails[m.id]||0)+1;lp.haltAt=now();let msg=`“${m.name}” didn't click this time, and that's normal. The lesson is paused here; it comes back after a break, with a fresh worked example.`;
  if(lp.fails[m.id]>=2){lp.rem=remedialIds(s);if(lp.rem.length)msg+=` First, a few refreshers on the skills it builds on are now due in your reviews.`;}
  keep();document.onkeydown=null;app().innerHTML=`<article class="card end"><h2 class="lh">Lesson paused</h2><p class="body">${esc(msg)}</p><div class="row">${dueIds().length?'<button class="primary" id="rv">Do reviews now</button>':''}<button class="secondary" id="h">Back to skill map</button></div></article>`;
  const rv=$('#rv');if(rv)rv.onclick=()=>{const Q=buildQueue(20);review(interleave(lp.rem&&lp.rem.length?lp.rem.concat(Q.queue.filter(x=>!lp.rem.includes(x))):Q.queue),'Review',{covered:Q.covered});};$('#h').onclick=home;(rv||$('#h')).focus();};
 const integ=(k,right)=>{if(k>=s.integ.length){delete ST.lp[s.id];learnSkill(s,res);return endScreen(`${s.name}: learned`,`${right} of ${s.integ.length} combined problems right. Its parts now come back in reviews, mixed in with other skills.`);}
  const id=s.id+'.i'+(k+1);problemView({p:freshProblem(id,s.integ[k],1),label:`${s.short||s.name}: putting it together`,progress:`Combined ${k+1} of ${s.integ.length}`,typed:false,onDone:(g,ok)=>{logAns(ok);rec(id,'lq');if(ok)rec(id,'lr');res[id]=g;integ(k+1,right+(ok?1:0));}});};
 intro();}
function endScreen(t,msg,btns){document.onkeydown=null;stopTick();app().innerHTML=`<article class="card end"><h2 class="lh">${esc(t)}</h2><p class="body">${esc(msg)}</p><div class="row">${(btns||[]).map((b,i)=>`<button class="${i?'secondary':'primary'}" id="eb${i}">${esc(b[0])}</button>`).join('')}<button class="${btns&&btns.length?'link':'primary'}" id="h">Back to skill map</button></div></article>`;
 (btns||[]).forEach((b,i)=>$('#eb'+i).onclick=b[1]);$('#h').onclick=home;($('#eb0')||$('#h')).focus();save();}

// ---------- quizzes ----------
// Timed, interleaved, across learned skills, calibrated toward 80–85% accuracy.
// Missed questions get immediate follow-up reviews, then a retake with new problems of the same types.
const QTARGET=0.82;
function quizItems(n){const by={};Object.keys(ST.cards).filter(id=>live(id)&&ST.cards[id].state!=='new'&&learned(skillOf(id))).forEach(id=>{(by[skillOf(id)]=by[skillOf(id)]||[]).push(id);});
 const cal=ST.quizCal||0,aim=Math.min(0.97,Math.max(0.6,QTARGET-0.05*cal));const skills=shuffle(Object.keys(by));const out=[];
 for(let round=0;out.length<n&&round<3;round++)skills.forEach(sk=>{if(out.length>=n)return;const pool=by[sk].filter(id=>!out.includes(id));if(!pool.length)return;
  pool.sort((a,b)=>Math.abs(curR(ST.cards[a])-aim)-Math.abs(curR(ST.cards[b])-aim));out.push(pick(pool.slice(0,3)));});
 return interleave(out);}
function quiz(retake){const ids=retake||quizItems(10);if(!ids.length)return endScreen('No quiz yet','Learn a few skills first.');
 const cal=ST.quizCal||0,lv=cal>=1?3:2,per=90*(cal>=1?0.85:cal<=-1?1.25:1),limit=Math.round(ids.length*per);const end=Date.now()+limit*1000;let k=0,right=0;const missed=[],start=Date.now();let cur=null,over=false;
 const intro=()=>{document.onkeydown=null;app().innerHTML=`<div class="bar"><button class="link" id="x">Exit</button><span>${retake?'Retake':'Quiz'}</span></div><article class="card"><h2 class="lh">${retake?'Retake: new problems, same types':'Timed quiz'}</h2>
  <p class="body">${ids.length} questions from ${new Set(ids.map(skillOf)).size} skills, ${Math.round(limit/60)} minutes. No reminders${lv===3?', and numeric answers are typed':''}. Missed questions get follow-up reviews right after.</p><button class="primary" id="go">Start</button></article>`;$('#x').onclick=home;$('#go').onclick=()=>{TICK=setInterval(tick,1000);next();};$('#go').focus();};
 const tick=()=>{const left=Math.max(0,Math.round((end-Date.now())/1000));const el=$('#qt');if(el)el.textContent=`${Math.floor(left/60)}:${String(left%60).padStart(2,'0')} left`;if(left<=0&&!over){over=true;stopTick();if(cur)cur.expire();}};
 const next=()=>{if(k>=ids.length||over){while(k<ids.length){missed.push(ids[k]);const c=ST.cards[ids[k]];if(c)schedule(c,1);k++;}return results();}
  const cid=ids[k],it=itemFor(cid),card=ST.cards[cid];const p=makeProblem(it,lv,cid);
  cur=problemView({p,label:`${it.skill.short||it.skill.name}`,progress:`${k+1} of ${ids.length}, <span id="qt"></span>`,typed:lv===3&&p.kind==='num'&&!p.check,noOverride:true,onExit:()=>{stopTick();home();},
   onDone:(g,ok)=>{k++;logAns(ok);rec(cid,'rt');if(ok){right++;rec(cid,'rr');schedule(card,3,curR(card)<0.9?1:0.5);implicitCredit(cid);}else{missed.push(cid);schedule(card,1);}save();next();}});tick();};
 const results=()=>{stopTick();const acc=right/ids.length;ST.quizzes=(ST.quizzes||[]).concat([{at:now(),n:ids.length,right,cal,sec:Math.round((Date.now()-start)/1000),retake:!!retake}]);
  if(!retake){if(acc>0.85)ST.quizCal=Math.min(2,cal+1);else if(acc<0.8)ST.quizCal=Math.max(-2,cal-1);}save();
  const list=missed.map(id=>{const it=itemFor(id);return `${it.skill.short||it.skill.name}: ${it.name}`;});
  const msg=`${right} of ${ids.length} correct (${Math.round(acc*100)}%)${over?', time ran out':''}.${missed.length?` Missed: ${list.join('; ')}.`:''}`;
  if(!missed.length)return endScreen(retake?'Retake done':'Quiz done',msg);
  endScreen(retake?'Retake done':'Quiz done',msg+' Next: a short review of each, then a retake with new problems.',[[`Review the ${missed.length} missed`,()=>review(missed.slice(),'Quiz follow-up',{noRequeue:false,onEnd:()=>endScreen('Follow-up done','Now try the same types again with new numbers.',[['Retake',()=>quiz(shuffle(missed.slice()))]])})]]);};
 intro();}

// ---------- progress and pass rates ----------
function statsView(){document.onkeydown=null;stopTick();const pct=(a,b)=>b?Math.round(100*a/b)+'%':'–';
 const kp=Object.entries(ST.stat||{}).filter(([id])=>live(id));
 const skills=ALL.map(s=>{const ids=cardIds(s);const g=k=>sum(ids.map(i=>(ST.stat[i]||{})[k]||0));return {s,lt:g('lt'),lp:g('lp'),rt:g('rt'),rr:g('rr')};}).filter(x=>x.lt||x.rt);
 const weak=kp.map(([id,x])=>({id,it:itemFor(id),x,score:(x.lt?x.lp/x.lt:1)*0.5+(x.rt?x.rr/x.rt:1)*0.5,n:(x.lt||0)+(x.rt||0)})).filter(w=>w.n>=2).sort((a,b)=>a.score-b.score).slice(0,10);
 const days=[...Array(7)].map((_,i)=>{const d=new Date();d.setDate(d.getDate()-6+i);return [dayKey(d).slice(5),ST.xp.days[dayKey(d)]||0];});const mx=Math.max(ST.goal||20,...days.map(d=>d[1]));
 const qz=(ST.quizzes||[]).slice(-6).reverse();
 app().innerHTML=`<div class="bar"><button class="link" id="x">Back</button><span>Progress</span></div>
 <h2>XP, last 7 days</h2><div class="xpw" role="img" aria-label="XP per day for the last 7 days">${days.map(([d,v])=>`<div><i style="height:${Math.round(60*v/mx)}px"></i><span>${Math.round(v)}</span><span class="when">${d}</span></div>`).join('')}</div>
 <p class="note">About 1 XP per minute of focused work. Daily goal: ${ST.goal||20} XP.</p>
 <h2>Quizzes</h2>${qz.length?`<ul class="parts">${qz.map(q=>`<li><span>${new Date(q.at).toLocaleDateString()}${q.retake?' (retake)':''}</span><span class="when">${q.right} of ${q.n}, ${Math.round(q.sec/60)} min</span></li>`).join('')}</ul><p class="note">Quizzes adjust difficulty to keep you near 80–85% correct.</p>`:'<p class="note">No quizzes yet.</p>'}
 <h2>Pass rates by skill</h2><p class="note">Lesson: knowledge points passed within 5 questions (target 95%). Review: correct on the first try.</p>
 ${skills.length?`<table class="tbl"><thead><tr><th>Skill</th><th>Lesson</th><th>Review</th></tr></thead><tbody>${skills.map(x=>`<tr><td>${esc(x.s.short||x.s.name)}</td><td class="${x.lt>=3&&x.lp/x.lt<0.95?'lo':''}">${pct(x.lp,x.lt)} <span class="when">(${x.lt})</span></td><td>${pct(x.rr,x.rt)} <span class="when">(${x.rt})</span></td></tr>`).join('')}</tbody></table>`:'<p class="note">Nothing yet. Pass rates appear after your first lesson.</p>'}
 <h2>Weakest knowledge points</h2>${weak.length?`<ul class="parts">${weak.map(w=>`<li><span>${esc((w.it.skill.short||w.it.skill.name)+': '+w.it.name)}</span><span class="when">lesson ${pct(w.x.lp||0,w.x.lt||0)}, review ${pct(w.x.rr||0,w.x.rt||0)}</span></li>`).join('')}</ul><p class="note">Points below target are candidates to rewrite or split; these numbers are in your backup file.</p>`:'<p class="note">Not enough answers yet.</p>'}
 <div id="flash" class="flash" hidden></div>`;$('#x').onclick=home;}

// ---------- settings, backup, packs ----------
function settings(){document.onkeydown=null;stopTick();
 app().innerHTML=`<div class="bar"><button class="link" id="x">Back</button><span>Settings</span></div>
 <h2>Answer style</h2><div class="seg" role="radiogroup" aria-label="Answer style">
  ${[['mix','Mixed','Choices while learning; type once an item is well learned'],['mc','Choices','Always multiple choice'],['typed','Typed','Type every numeric answer']].map(([k,l,d])=>`<button role="radio" aria-checked="${ST.mode===k}" data-mode="${k}" class="${ST.mode===k?'on':''}"><b>${l}</b><span>${d}</span></button>`).join('')}</div>
 <h2>Daily goal</h2><div class="row" role="radiogroup" aria-label="Daily goal">${[10,15,20,30,45].map(g=>`<button class="chip ${ST.goal===g?'on':''}" role="radio" aria-checked="${ST.goal===g}" data-goal="${g}">${g} XP</button>`).join('')}</div>
 <h2>Next quiz or exam</h2><p class="note">Reviews that would fall after this date are moved to the day before. Quiz 2 is Nov 13.</p>
 <div class="row"><input type="date" id="exam" value="${ST.exam||''}" aria-label="Quiz date"><button class="link" id="q2">Use Nov 13</button><button class="link" id="clr">Clear</button></div>
 <h2>Backup</h2><p class="note">Saves your progress, pass rates, and any added topics. Do this before replacing the app with a new version.</p>
 <div class="row"><button class="secondary" id="exp">Export backup</button><button class="secondary" id="imp">Restore from backup</button></div>
 <div id="expbox"></div>
 <h2>New topics</h2><p class="note">Add a topic pack file you got from Claude. Your progress is kept.</p>
 <div class="row"><button class="secondary" id="addp">Add a topic pack</button></div>
 <ul class="parts">${SITE_PACKS.map(pk=>`<li><span>${esc(pk.name||pk.id)} <span class="when">from the site, v${esc(pk.version||1)}${packErrors[pk.id]?`, not loaded: ${esc(packErrors[pk.id])}`:''}</span></span></li>`).join('')}${(ST.packs||[]).map(pk=>`<li><span>${esc(pk.name||pk.id)} <span class="when">v${esc(pk.version||1)}${packErrors[pk.id]?`, not loaded: ${esc(packErrors[pk.id])}`:''}</span></span><button class="link" data-rm="${esc(pk.id)}">Remove</button></li>`).join('')||(SITE_PACKS.length?'':'<li><span class="note">No topic packs yet.</span></li>')}</ul>
 <input type="file" id="file" hidden>
 <h2>Start over</h2><button class="link" id="reset">Reset all progress</button>
 <p class="note">Margin ${APP_VERSION}</p>
 <div id="flash" class="flash" hidden></div>`;
 $('#x').onclick=home;
 document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{ST.mode=b.dataset.mode;save();settings();});
 document.querySelectorAll('[data-goal]').forEach(b=>b.onclick=()=>{ST.goal=+b.dataset.goal;save();settings();});
 $('#exam').onchange=e=>{ST.exam=e.target.value;ST.examChosen=true;save();};$('#clr').onclick=()=>{ST.exam='';ST.examChosen=true;save();settings();};$('#q2').onclick=()=>{ST.exam='2026-11-13';ST.examChosen=true;save();settings();};
 $('#exp').onclick=()=>{const txt=JSON.stringify({app:'margin',format:2,version:APP_VERSION,exported:new Date().toISOString(),state:ST});const name=`margin-backup-${dayKey(now())}.json`;
  try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:'application/json'}));a.download=name;document.body.appendChild(a);a.click();a.remove();}catch(e){}
  $('#expbox').innerHTML=`<p class="note">If no download started, copy this text and save it somewhere safe.</p><textarea id="ta" rows="4" readonly>${esc(txt)}</textarea><button class="link" id="cp">Copy backup text</button>`;
  $('#cp').onclick=async()=>{try{await navigator.clipboard.writeText(txt);$('#cp').textContent='Copied';}catch(e){$('#ta').select();}};};
 const pickText=(accept,cb,title)=>{const box=$('#expbox');box.innerHTML=`<p class="note">${title}: choose a file, or paste its text below.</p><div class="row"><button class="secondary" id="ch">Choose file</button></div><textarea id="pt" rows="4" placeholder="Or paste here"></textarea><button class="primary" id="go">Use pasted text</button>`;
  const fi=$('#file');fi.accept=accept;$('#ch').onclick=()=>{fi.value='';fi.click();};fi.onchange=()=>{const fl=fi.files[0];if(!fl)return;const r=new FileReader();r.onload=()=>cb(String(r.result));r.readAsText(fl);};
  $('#go').onclick=()=>{const v=$('#pt').value.trim();if(v)cb(v);};};
 $('#imp').onclick=()=>pickText('.json,.txt',txt=>{let o;try{o=JSON.parse(txt);}catch(e){return flash('That isn\'t a Margin backup file.');}
  if(!o||o.app!=='margin'||!o.state||!o.state.cards)return flash('That isn\'t a Margin backup file.');
  if(!confirm('Replace your current progress with this backup?'))return;ST=migrate(o.state);rebuild();save();home();},'Restore from backup');
 $('#addp').onclick=()=>pickText('.js,.txt',src=>{let p;try{p=evalPack(src);}catch(e){return flash(`Couldn't read the pack: ${e.message}`);}
  const others=ALL.filter(s=>s.pack!==p.id).map(s=>s.id);const errs=validatePack(p,others);if(errs.length)return flash(`Pack not added. ${errs.join(' ')}`);
  ST.packs=(ST.packs||[]).filter(x=>x.id!==p.id).concat([{id:p.id,name:p.name||p.id,version:p.version||1,source:src}]);rebuild();save();settings();
  flash('');const n=document.createElement('p');n.className='note good';n.textContent=`Added ${p.name||p.id}: ${p.skills.length} skill${p.skills.length>1?'s':''}. They're on the skill map.`;$('#expbox').appendChild(n);},'Add a topic pack');
 document.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{if(!confirm('Remove this topic pack? Its review history is kept in case you add it back.'))return;ST.packs=ST.packs.filter(x=>x.id!==b.dataset.rm);rebuild();save();settings();});
 $('#reset').onclick=()=>{if(confirm('Erase all progress? This cannot be undone. Export a backup first if unsure.')){const keep={mode:ST.mode,packs:ST.packs,goal:ST.goal};ST=Object.assign(fresh(),keep);rebuild();save();home();}};}

// ---------- boot ----------
const APP_VERSION='v5';
// Older saves (v1–v4) get the new fields; nothing is renamed or dropped.
function migrate(s){const o=Object.assign(fresh(),s||{});o.log=Object.assign({right:0,total:0,days:{}},o.log||{});o.log.days=o.log.days||{};o.packs=o.packs||[];o.lp=o.lp||{};o.stat=o.stat||{};
 o.xp=o.xp&&o.xp.days?o.xp:{days:{}};o.quizzes=o.quizzes||[];o.seen=o.seen||{};if(typeof o.goal!=='number')o.goal=20;if(!o.examChosen&&!o.exam&&Date.now()<Date.parse('2026-11-13T23:00:00'))o.exam='2026-11-13';o.ver=5;return o;}
async function loadSitePacks(){if(!/^https?:$/.test((typeof location!=='undefined'&&location.protocol)||''))return;
 try{const r=await fetch('packs/index.json',{cache:'no-cache'});if(!r.ok)return;const idx=await r.json();
  for(const file of (idx.packs||[])){try{const src=await (await fetch('packs/'+file,{cache:'no-cache'})).text();const p=evalPack(src);SITE_PACKS.push({id:p.id,name:p.name||p.id,version:p.version||1,source:src,site:true});}catch(e){packErrors[file]=e.message;}}}catch(e){}}
(async()=>{app().innerHTML='<p class="note">Loading your progress…</p>';let s=await store.get(KEY);
 ST=migrate(s&&s.cards?s:null);
 if(!s){const o=await store.get('margin:v1');if(o&&o.skills){rebuild();Object.keys(o.skills).forEach(id=>{if(SK[id]&&o.skills[id].learned)learnSkill(SK[id],{});});}}
 await loadSitePacks();rebuild();save();home();
 try{if(/^https?:$/.test(location.protocol)&&navigator.serviceWorker)navigator.serviceWorker.register('sw.js').catch(()=>{});}catch(e){}})();
</script></body></html>
