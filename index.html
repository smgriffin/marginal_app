 {id:'S17f',name:'Key ideas',explain:'Who bears the tax, and why the rankings differ.',
  gen:TF([["the tax is levied on the foreign producer, so domestic consumers bear none of it.",0,"With linear demand, the price rises t/2: consumers pay half."],
   ["with a binding price ceiling and c + t below it, the foreign firm bears the entire import tax.",1,"The price can't rise; quantity is unchanged."],
   ["a subsidy lowers consumer prices, so it must be good for the importing country.",0,"With linear demand, the subsidy cost exceeds the CS gain; much goes to foreign profit."],
   ["a tax that helps the importing country must raise world total surplus.",0,"It shifts foreign rent home but raises the monopoly DWL."],
   ["with constant-elasticity demand, taxing a foreign monopolist can hurt the importing country.",1,"Pass-through exceeds 100%: consumers bear more than the whole tax."],
   ["if a small tax helps the importing country, a larger tax is always better.",0,"W(t) is hump-shaped; the optimum is t* = (a − c)/3 with linear demand."],
   ["the importing country's criterion is weighted surplus with weight 0 on the foreign firm.",1,"Class 5 meets Class 6."],
   ["adding an import tax to a binding ceiling raises the price consumers pay.",0,"The ceiling binds; only the firm's margin shrinks (unless it exits)."]])}],
 integ:[
  ()=>{let F,t,w0,wt,ws;do{F=foreign();t=R(1,Math.max(1,Math.min(F.c,F.a-F.c-2)));w0=W(F,0).w;wt=W(F,t).w;ws=W(F,-t).w;}while(Math.min(Math.abs(w0-wt),Math.abs(w0-ws),Math.abs(wt-ws))<0.02*Math.max(w0,1));const opts=[['No interference',w0],[`A tax of ${t} per unit`,wt],[`A subsidy of ${t} per unit`,ws]];const best=opts.reduce((a,b)=>b[1]>a[1]?b:a);
   return CQ(`${(typeof CURLV!=='undefined'&&CURLV>1)?F.short:F.story} Taking into account only ${F.home}'s consumer surplus and the net impact on its budget, which is best: no interference, a tax of ${t} per unit, or a subsidy of ${t} per unit?`,best[0],opts.filter(o=>o!==best).map(o=>o[0]),`W: none ${f(w0)}, tax ${f(wt)}, subsidy ${f(ws)}. <b>${best[0]}</b>.`);},
  ()=>{const F=foreign();return NQ(`${(typeof CURLV!=='undefined'&&CURLV>1)?F.short:F.story} With no ceiling, what per-unit tax maximizes ${F.home}'s welfare (CS + revenue)?`,(F.a-F.c)/3,`W(t) = CS + tq, q = (a − c − t)B/2 → t* = (a − c)/3 = <b>${f((F.a-F.c)/3)}</b>`,[(F.a-F.c)/2,(F.a-F.c)/4,F.c,(F.a-F.c)*2/3]);},
  ()=>{const [home,abroad]=pick(COUNTRIES),c=pick([2,3,4,5]),A=pick([14400,57600,36000]),t=pick([1,-1]),k=t>0?'tax':'subsidy';const p0=2*c,p1=2*(c+t);const w0=A/p0,w1=A/p1+t*A/p1**2;
   return CQ(`${home} imports from a monopolist in ${abroad} with constant MC ${c}. Demand has constant elasticity: D(p) = ${f(A)}·p^(−2), and CS at price p is ${f(A)}/p. Does a ${k} of 1 per unit help ${home}?`,w1>w0?'Yes':'No',[w1>w0?'No':'Yes'],`p: ${p0} → ${p1} (pass-through 200%). W = CS ${t>0?'+':'−'} ${k}: ${f(w0)} → ${f(A/p1)} ${t>0?'+':'−'} ${f(Math.abs(t)*A/p1**2)} = ${f(w1)}. <b>${w1>w0?'Yes':'No'}</b>.`);}]}
];

const S0={id:'S0',name:'Math toolkit',short:'Math toolkit',prereq:[],class:'Foundations',
 intro:'The handful of math moves every problem in this course uses: derivatives of polynomials, setting a derivative to zero, solving linear and quadratic equations, areas of triangles and trapezoids, and percent changes.',
 micros:[
 {id:'S0a',name:'Derivative of a polynomial',explain:'Power rule: d/dq of a·qⁿ is n·a·qⁿ⁻¹. Constants vanish.',
  gen:()=>{const a=R(1,6),b=R(1,20),c=R(0,50),n=pick([2,3]),q=R(1,6);const v=n*a*q**(n-1)+b;
   return NQ(`f(q) = ${a===1?'':a}q${n===2?'²':'³'} + ${b===1?'':b}q + ${c}. What is f′(${q})?`,v,`f′(q) = ${n*a}q${n===2?'':'²'} + ${b} → <b>${v}</b>`,[a*q**n+b*q+c,a*q**(n-1)+b,n*a*q**(n-1),n*a*q**(n-1)+b+c]);}},
 {id:'S0b',name:'Maximizing a quadratic',explain:'For A·q − B·q², set the derivative A − 2Bq = 0: q* = A/(2B).',
  gen:()=>{const B=pick([0.5,1,2,0.25,0.1]),A=2*B*R(2,40);const qs=A/(2*B);return NQ(`Π(q) = ${f(A)}q − ${f(B)}q². What q maximizes Π?`,qs,`Π′ = ${f(A)} − ${f(2*B)}q = 0 → q = <b>${f(qs)}</b> (Π″ = −${f(2*B)} &lt; 0)`,[A/B,A*2*B,qs/2,A]);}},
 {id:'S0c',name:'Solving a linear equation',explain:'Collect q terms on one side: a − bq = c + dq → q = (a − c)/(b + d).',
  gen:()=>{const b=pick([1,2,0.5]),d=pick([0,1,0.5,2]),q=R(2,20);const c=R(1,10),a=c+(b+d)*q;return NQ(`Solve for q: ${f(a)} − ${b===1?'':f(b)}q = ${c}${d?` + ${d===1?'':f(d)}q`:''}`,q,`${f(a)} − ${c} = ${f(b+d)}q → q = <b>${q}</b>`,[(a-c)/b,(a+c)/(b+d),(a-c)/(b+d)*2,a/(b+d)]);}},
 {id:'S0d',name:'Quadratic formula',explain:'aq² + bq + c = 0 → q = [−b ± √(b² − 4ac)]/(2a). In supply problems you want the larger root.',
  gen:()=>{const k=pick([1,2,3]),r1=R(0,3),r2=r1+R(1,5);const b=-k*(r1+r2),c=k*r1*r2;return NQ(`What is the larger root of ${k===1?'':k}q² − ${-b}q + ${c} = 0?`,r2,`[${-b} + √(${b*b} − ${4*k*c})]/${2*k} = [${-b} + ${Math.sqrt(b*b-4*k*c)}]/${2*k} = <b>${r2}</b>`,[r1,-b/(2*k),-r2,r1+r2]);}},
 {id:'S0e',name:'Chain rule with a linear inside',explain:'d/dx g(x/k) = g′(x/k)·(1/k). Division inside the function needs the chain rule; division outside doesn\'t.',
  gen:()=>{const k=pick([2,3,4,5,10]),x=k*R(1,6);const inside=Math.random()<0.5;const v=inside?2*x/(k*k):2*x/k;
   return NQ(`h(x) = ${inside?`(x/${k})²`:`x²/${k}`}. What is h′(${x})?`,v,inside?`Chain rule: 2(x/${k})·(1/${k}) = 2x/${k*k} → <b>${f(v)}</b>`:`Constant multiple: 2x/${k} → <b>${f(v)}</b>`,[inside?2*x/k:2*x/(k*k),2*x,x/k,2*x*k]);}},
 {id:'S0f',name:'Triangles and trapezoids',explain:'Triangle: ½ × base × height. Trapezoid: width × (average of the two heights).',
  gen:()=>{if(Math.random()<0.5){const b=R(2,40)*pick([1,10,100]),h=R(2,20);return NQ(`A triangle on a demand diagram has base ${f(b)} (quantity) and height ${h} (price). What is its area?`,0.5*b*h,`½ × ${f(b)} × ${h} = <b>${f(0.5*b*h)}</b>`,[b*h,b+h,0.25*b*h]);}
   const w=R(2,20)*pick([1,10,100]),h1=R(10,30),h2=R(1,h1-1);return NQ(`A trapezoid has width ${f(w)} and heights ${h1} and ${h2}. What is its area?`,w*(h1+h2)/2,`${f(w)} × (${h1} + ${h2})/2 = <b>${f(w*(h1+h2)/2)}</b>`,[w*h1,w*(h1-h2)/2,w*h2,w*(h1+h2)]);}},
 {id:'S0g',name:'Percent changes',explain:'%Δ = (new − old)/old. Applying a % change: new = old × (1 + %Δ).',
  gen:()=>{if(Math.random()<0.5){const o=R(2,40)*1000,pct=pick([-20,-10,-5,-2,2,4,5,10,25]);const n=o*(1+pct/100);return NQ(`Quantity goes from ${f(o)} to ${f(n)}. What is the percent change?`,pct,`(${f(n)} − ${f(o)})/${f(o)} = <b>${pct}%</b>`,[-pct,pct/100,(n-o),pct*2],{pct:true});}
   const o=pick([4,5,8,10,12,20,25,50]),pct=pick([-3,-2.5,-2,-1.5,1,2,4]);return NQ(`A price of $${o} changes by ${pct}%. What is the new price?`,o*(1+pct/100),`${o} × ${f(1+pct/100,3)} = <b>${f(o*(1+pct/100))}</b>`,[o+pct,o*(1-pct/100),o*pct/100,o+pct/100]);}}],
 integ:[
  ()=>{const p=R(6,30),d=pick([1,2,4,0.5]);const q=p/d;return NQ(`A firm earns Π(q) = ${p}q − ${d===1?'q²/2':d===2?'q²':f(d/2)+'q²'}. Find the maximizing q, then the maximum profit.`,p*q-d*q*q/2,`Π′ = ${p} − ${f(d)}q = 0 → q = ${f(q)}. Π = ${f(p*q)} − ${f(d*q*q/2)} = <b>${f(p*q-d*q*q/2)}</b>`,[q,p*q,p*q-d*q*q,p*q/4]);},
  ()=>{const a=R(20,40),b=pick([1,0.5]),c=R(2,8),q1=R(2,6),q2=q1+R(2,8);const h=x=>a-b*x-c;return NQ(`What is the area between P(q) = ${a} − ${bStr(b)} and the line at ${c}, from q = ${q1} to q = ${q2}?`,(q2-q1)*(h(q1)+h(q2))/2,`Trapezoid: heights ${f(h(q1))} and ${f(h(q2))}, width ${q2-q1}. Area = <b>${f((q2-q1)*(h(q1)+h(q2))/2)}</b>`,[(q2-q1)*h(q1),0.5*(q2-q1)*(h(q1)-h(q2)),(q2-q1)*(a-c),(q2-q1)*h(q2)]);}]};
POOLS.S0x=[

 ["a negative second derivative at a critical point means a local maximum.","a positive second derivative at a critical point means a local maximum.","Concave down → max."],

 ["for a linear demand curve, consumer surplus is a triangle.","for a linear demand curve, consumer surplus is a rectangle.","½ × q × (choke price − p)."],
 ["a 2% price rise followed by a 2% fall does not return exactly to the start.","a 2% rise followed by a 2% fall returns exactly to the start.","1.02 × 0.98 = 0.9996."],

S0.micros.push({id:'S0h',name:'Key ideas',explain:'Checks on the math moves.',gen:TP(POOLS.S0x)});

const S3={id:'S3',name:'Demand from valuations',short:'Demand and CS',prereq:['S0','S1'],class:'Classes 1 and 3',
 intro:'Market demand adds individual demands horizontally. With multi-unit demand, each unit has its own valuation. With a smooth valuation function v(q), inverse demand is marginal valuation, and consumer surplus is the area under demand above the price.',
 micros:[
 {id:'S3a',name:'Market demand from unit valuations',explain:'At price p, count every unit whose valuation exceeds p, across all consumers.',
  gen:()=>{const c1=descVals(3,1,4,R(10,14)),c2=descVals(2,1,4,R(8,12));const all=[...c1,...c2];let p;do{p=R(2,13)+0.5;}while(all.includes(p)||!all.some(v=>v>p));const q=all.filter(v=>v>p).length;
   return NQ(`Consumer 1 values successive units at ${c1.join(', ')}; consumer 2 at ${c2.join(', ')}. What is market quantity demanded at p = ${p}?`,q,`Units valued above ${p}: ${all.filter(v=>v>p).sort((a,b)=>b-a).join(', ')} → <b>${q}</b>`,[c1.filter(v=>v>p).length,c2.filter(v=>v>p).length,q+1,Math.max(0,q-1)]);}},
 {id:'S3b',name:'Consumer surplus with multi-unit demand',explain:'Each unit bought adds (its valuation − p). Sum across units and consumers.',
  gen:()=>{const c1=descVals(3,1,4,R(10,14)),c2=descVals(2,1,4,R(8,12));const all=[...c1,...c2];let p;do{p=R(3,10)+0.5;}while(all.includes(p));const cs=sum(all.filter(v=>v>p).map(v=>v-p));
   return NQ(`Consumer 1 values successive units at ${c1.join(', ')}; consumer 2 at ${c2.join(', ')}. The price is ${p}. What is consumers' surplus?`,cs,`${all.filter(v=>v>p).map(v=>`(${v} − ${p})`).join(' + ')} = <b>${f(cs)}</b>`,[sum(all.filter(v=>v>p)),cs-p,sum(c1.filter(v=>v>p).map(v=>v-p)),cs+p]);}},
 {id:'S3c',name:'Inverse demand from a valuation function',explain:'Consumer i buys where v′(q) = p, so inverse demand is marginal valuation: P(q) = v′(q).',
  gen:()=>{const al=R(8,30),k=pick([1,2,4]),p=R(1,al-2);const q=(al-p)*k;return NQ(`A consumer's valuation is v(q) = ${al}q − q²/${2*k}. How many units does she buy at p = ${p}?`,q,`v′(q) = ${al} − ${k===1?'q':'q/'+k} = ${p} → q = <b>${f(q)}</b>`,[al-p,(al-p)/k,al*k-p,(al-p)*k/2]);}},
 {id:'S3d',name:'CS from a valuation function',explain:'CS = v(q) − p·q, which equals the triangle under inverse demand.',
  gen:()=>{const al=R(8,30),p=R(1,al-2);const q=al-p,cs=0.5*q*q;return NQ(`A consumer's valuation is v(q) = ${al}q − q²/2. At p = ${p}, what is her consumer surplus?`,cs,`q = ${q}. v(q) − pq = ${f(al*q-q*q/2)} − ${f(p*q)} = <b>${f(cs)}</b> (= ½ × ${q} × ${q})`,[al*q-q*q/2,q*q,p*q,0.5*q*p]);}},
 {id:'S3e',name:'Key ideas',explain:'Demand, valuations, and summation.',gen:TP([
  ["individual demands are summed horizontally.","individual demands are summed vertically.","Add quantities at each price."],
  ["a consumer with valuations 10 and 7 counts the same as two unit-demand buyers with 10 and 7.","multi-unit demand can't be represented by unit-demand buyers.","Surplus is computed unit by unit."],
  ["inverse demand equals marginal valuation.","inverse demand equals total valuation divided by quantity.","FOC: v′(q) = p."],
  ["v(q) is willingness to pay for going from zero to q units.","v(q) is willingness to pay for the q-th unit.","The q-th unit is worth v(q) − v(q − 1)."],
  ["standard assumptions are v(0) = 0, v′ &gt; 0, and v″ &lt; 0.","standard assumptions are v(0) = 0, v′ &gt; 0, and v″ &gt; 0.","Diminishing marginal valuation."],
  ["at a price equal to someone's valuation, their demand is the set {0, 1}.","at a price equal to someone's valuation, they always buy.","They're indifferent."]])}],
 integ:[
  ()=>{let c1,c2,all,p0,p1;do{c1=descVals(3,1,4,R(10,14));c2=descVals(2,1,4,R(8,12));all=[...c1,...c2];p0=R(5,11)+0.5;p1=p0-R(1,3);}while(all.includes(p0)||all.includes(p1)||p1<1);
   const cs=p=>sum(all.filter(v=>v>p).map(v=>v-p));const d=cs(p1)-cs(p0);const newU=all.filter(v=>v>p1&&v<p0);
   return NQ(`Consumer 1 values successive units at ${c1.join(', ')}; consumer 2 at ${c2.join(', ')}. The price falls from ${p0} to ${p1}. By how much does consumers' surplus rise?`,d,
   `CS(${p0}) = ${f(cs(p0))}, CS(${p1}) = ${f(cs(p1))}. Rise = <b>${f(d)}</b>: ${f(p0-p1)} more on each unit already bought${newU.length?`, plus surplus on ${newU.length} new unit${newU.length>1?'s':''}`:''}.`,[(p0-p1)*all.filter(v=>v>p0).length,cs(p1),(p0-p1)*all.filter(v=>v>p1).length,d+(p0-p1)]);},
  ()=>{const al=R(8,20),n=R(2,5),p=R(1,al-2);const q=al-p;return NQ(`${n} identical consumers each have v(q) = ${al}q − q²/2. At p = ${p}, what is total consumers' surplus?`,n*q*q/2,`Each buys ${q}; each CS = ½ × ${q}² = ${f(q*q/2)}. × ${n} = <b>${f(n*q*q/2)}</b>`,[q*q/2,n*q*q,n*q,n*(al*q-q*q/2)]);}]};

add('S7',{id:'S7g',name:'Writing the profit function',explain:'Π(q) = q·P(q) − C(q). Evaluate it before you optimize it.',
 gen:()=>{const M=linMono();const q=Math.max(1,Math.round(M.qM*pick([0.5,0.8,1.2])));const pi=q*(M.a-q/M.B)-M.c*q;return NQ(`P(q) = ${Pstr(M.a,M.B)} and C(q) = ${M.c}q. What is profit at q = ${f(q)}?`,pi,`${f(q)} × ${f(M.a-q/M.B)} − ${M.c} × ${f(q)} = <b>${f(pi)}</b>`,[q*(M.a-q/M.B),q*(M.a-M.c),pi+M.c*q*0.5,q*(M.a-2*q/M.B-M.c)]);}},2);
add('S12',{id:'S12f',name:'Gains from trade as an area',explain:'GFT(q) = ∫₀^q [P(x) − C′(x)]dx − F: the area between demand and MC. Between two quantities, it\'s a trapezoid or triangle.',
 gen:()=>{const M=linMono();const q1=M.qM,q2=M.qS*pick([1,0.75]);const h=x=>M.a-x/M.B-M.c;const ar=(q2-q1)*(h(q1)+h(q2))/2;return NQ(`P(q) = ${Pstr(M.a,M.B)}, constant MC ${M.c}. How much do gains from trade rise if output goes from ${f(q1)} to ${f(q2)}?`,ar,`Area between P and MC: heights ${f(h(q1))} and ${f(h(q2))}, width ${f(q2-q1)} → <b>${f(ar)}</b>`,[(q2-q1)*h(q1),(q2-q1)*(M.a-M.c),0.5*(q2-q1)*(M.a-q1/M.B),ar*2]);}});
add('S12',{id:'S12g',name:'Descriptive or normative?',explain:'Descriptive: how things are or would be. Normative: how things should be. You can\'t get an ought from an is.',
 gen:()=>{const L=[["A price ceiling of $10 raises the monopolist's output from 12 to 16.",'Descriptive'],["The government should cap the monopolist's price.",'Normative'],["The ceiling raises aggregate gains from trade by 18.",'Descriptive'],["Rent control reduces the long-run supply of apartments.",'Descriptive'],["Google ought to be regulated to prevent it from harming consumers.",'Normative'],["Because the ceiling raises total surplus, it should be adopted.",'Normative'],["A $1 tax on the foreign monopolist raises its price by $0.50.",'Descriptive'],["Freedonia is better off with the tax than without it.",'Normative'],["Consumers' surplus is the area under demand above the price.",'Descriptive'],["Theft is wrong even when it is costless.",'Normative'],["Lower-income tenants gain most from rent control.",'Descriptive'],["A dollar to a poor family should count more than a dollar to a monopolist.",'Normative']];
  const [s,a]=pick(L);return CQ(`Descriptive or normative? “${s}”`,a,[a==='Descriptive'?'Normative':'Descriptive'],`<b>${a}.</b> ${a==='Normative'?'It says what should be (or what is better), which needs a value premise.':'It claims what is or would happen.'}`);}});
add('S15',{id:'S15e',name:'The stolen car (Week 3)',explain:'Taking the car moves it to a higher-value owner (efficient) but makes the owner worse off (not Pareto). The gains exceed the loss (Kaldor–Hicks).',
 gen:()=>{const A=R(5,15)*1000,B=A+R(3,12)*1000,ask=pick(['Pareto improvement','Pareto efficient allocation','Kaldor–Hicks improvement']);const ans=ask==='Pareto improvement'?'No':'Yes';

// Draws a price–quantity diagram as inline SVG. Economic coordinates: q on x, p on y.
function diag(o){const X0=44,X1=318,Y0=222,Y1=16;const X=q=>X0+(q/o.qmax)*(X1-X0),Y=p=>Y0-(p/o.pmax)*(Y0-Y1);
 let s=`<svg class="dg" viewBox="0 0 340 250" role="img" aria-label="${o.alt||'Price–quantity diagram'}">`;
 (o.regions||[]).forEach((r,i)=>{const pts=r.pts.map(([q,p])=>`${X(q).toFixed(1)},${Y(p).toFixed(1)}`).join(' ');const cx=sum(r.pts.map(a=>X(a[0])))/r.pts.length,cy=sum(r.pts.map(a=>Y(a[1])))/r.pts.length;
  s+=`<polygon points="${pts}" class="rg rg${i%4}"/><text x="${cx.toFixed(1)}" y="${(cy+5).toFixed(1)}" class="rl" text-anchor="middle">${r.label}</text>`;});
 (o.hl||[]).forEach(h=>{s+=`<line x1="${X0}" y1="${Y(h.p)}" x2="${X(h.q||o.qmax)}" y2="${Y(h.p)}" class="gd"/><text x="${X0-5}" y="${Y(h.p)+4}" text-anchor="end">${h.label}</text>`;});
 (o.vl||[]).forEach(v=>{s+=`<line x1="${X(v.q)}" y1="${Y0}" x2="${X(v.q)}" y2="${Y(v.p||0)}" class="gd"/><text x="${X(v.q)}" y="${Y0+15}" text-anchor="middle">${v.label}</text>`;});
 (o.lines||[]).forEach(l=>{const q1=Math.min(l.q1,o.qmax),p0=l.f(l.q0),p1=l.f(q1);s+=`<line x1="${X(l.q0)}" y1="${Y(p0)}" x2="${X(q1)}" y2="${Y(Math.max(0,p1))}" class="${l.cls}"/>`;
  if(l.label){const lq=l.lq!==undefined?l.lq:q1;s+=`<text x="${Math.min(X1+2,X(lq)+4)}" y="${Y(l.f(lq))-6}" class="${l.cls}-t">${l.label}</text>`;}});
 s+=`<line x1="${X0}" y1="${Y0}" x2="${X1+12}" y2="${Y0}" class="ax"/><line x1="${X0}" y1="${Y0}" x2="${X0}" y2="${Y1-6}" class="ax"/><text x="${X1+14}" y="${Y0+4}">q</text><text x="${X0-4}" y="${Y1-10}" text-anchor="end">p</text></svg>`;return s;}
const letters=n=>shuffle(['A','B','C','D','E'].slice(0,n));
// a monopoly diagram setup: linear demand P = a − q/B, MC constant c or rising d·q (in diagram units)
function dgSetup(kind){const B=pick([1,2,10,100]),a=R(16,30);if(kind==='const'){const c=R(2,Math.floor(a/2)-2);return {kind,a,B,c,mc:q=>c,qM:(a-c)*B/2,pM:(a+c)/2,qS:(a-c)*B,pS:c};}
 const d=pick([0.5,1,1.5])/B;const qM=a/(2/B+d),qS=a/(1/B+d);return {kind,a,B,d,mc:q=>d*q,qM,pM:a-qM/B,qS,pS:d*qS};}
const baseLines=(S,o={})=>[{f:q=>S.a-q/S.B,q0:0,q1:S.a*S.B,cls:'dem',label:'P(q)',lq:S.a*S.B*0.82},
 ...(o.noMR?[]:[{f:q=>S.a-2*q/S.B,q0:0,q1:S.a*S.B/2,cls:'mr',label:'MR',lq:S.a*S.B*0.42}]),
 {f:S.mc,q0:0,q1:S.a*S.B*0.95,cls:'mc',label:'MC',lq:S.a*S.B*0.88}];

 // S12: compute an area from labeled ticks

   {cs:`½ × ${f(S.qM)} × (${f(S.a)} − ${f(S.pM)}) = <b>${f(v)}</b>`,dwl:`½ × (${f(S.qS)} − ${f(S.qM)}) × (${f(S.pM)} − ${f(S.c)}) = <b>${f(v)}</b>`,ps:`(${f(S.pM)} − ${f(S.c)}) × ${f(S.qM)} = <b>${f(v)}</b>`}[ask],
   [0.5*S.qM*(S.a-S.pM)*2,0.5*(S.qS-S.qM)*(S.pM-S.c)*2,(S.pM-S.c)*S.qM*0.5,0.5*S.qS*(S.a-S.c),S.pM*S.qM]);},
 // S11: quantity under a ceiling (rising MC)
 ceiling:()=>{const S=dgSetup('rise');const which=pick(['above','between','below']);const pb=which==='above'?S.pM+(S.a-S.pM)*0.4:which==='between'?S.pS+(S.pM-S.pS)*R(3,7)/10:S.pS*R(5,8)/10;
  const D=(S.a-pb)*S.B,Sx=pb/S.d;const ans=which==='above'?S.qM:Math.min(D,Sx);const L=letters(4);
  const cand=[['qM',S.qM],['D',D],['S',Sx],['qS',S.qS]].filter((x,i,arr)=>arr.findIndex(y=>Math.abs(y[1]-x[1])<1e-9)===i);const marks=cand.map((c,i)=>({lab:L[i],q:c[1],key:c[0]}));

// Linear competitive market. Inverse demand Pᵈ(q) = a − b·q/K, inverse supply Pˢ(q) = e + g·q/K.
const qTerm=(coef,K)=>{const X=K/coef;return X===1?'q':Number.isInteger(X)?`q/${f(X)}`:`${f(coef/K,4)}q`;};
function compLin(){const K=pick([1,10,100,1000]),b=pick([1,2,0.5]),g=pick([1,2,0.5]),u=2*R(3,10),e=R(0,8);const p0=e+g*u,a=p0+b*u;
 return {K,b,g,e,a,u,p0,q0:u*K,Pd:q=>a-b*q/K,Ps:q=>e+g*q/K,D:p=>(a-p)*K/b,S:p=>(p-e)*K/g,
  dStr:`Pᵈ(q) = ${a} − ${qTerm(b,K)}`,sStr:e?`Pˢ(q) = ${e} + ${qTerm(g,K)}`:`Pˢ(q) = ${qTerm(g,K)}`};}
const taxOut=(M,t)=>{const qT=M.K*(M.a-M.e-t)/(M.b+M.g),pd=M.Pd(qT);return {qT,pd,ps:pd-t,rev:t*qT,dwl:0.5*t*(M.q0-qT)};};
// n identical consumers with v(q) = aq − q²/2; m identical firms with c(q) = d·q²/2 (shown with costStr)
function compPop(){const n=pick([50,100,200,500]),m=pick([50,100,200,500]),d=pick([1,0.5,2]),a=R(4,24);const p=n*a/(n+m/d);return {n,m,d,a,p,Q:n*(a-p),qi:a-p,qj:p/d};}
const SHIFT_DOWN=['A hurricane knocks out refining capacity and','A drought','A factory fire','A new safety rule','A port strike'];
const SHIFT_UP=['A technological improvement','Cheaper imported inputs','The entry of new suppliers','A bumper harvest'];
const EDS=[-0.25,-0.4,-0.5,-0.75,-1,-1.5,-2],ESS=[0.15,0.25,0.5,1,1.5,2];
const PRODS=[['gasoline','gallon',3.5,375,'million gallons per day'],['wheat','bushel',6,1800,'million bushels per year'],['eggs','dozen',2.4,90,'million dozen per week'],['coffee','pound',4,300,'million pounds per month'],['natural gas','thousand cubic feet',3,90,'billion cubic feet per day']];
function shiftCase(sign){const s=(sign||pick([-1,-1,1]))*pick([4,5,8,10,12,20]),eD=pick(EDS),eS=pick(ESS);const x=s/(eD-eS);
 const verb=s<0?`${pick(SHIFT_DOWN).replace(/ and$/,'')} cuts supply by ${-s}% at every price`:`${pick(SHIFT_UP)} raises supply by ${s}% at every price`;
 return {s,eD,eS,x,dq:eD*x,verb};}
function levelCase(sign){const C=shiftCase(sign),P=pick(PRODS);const p0=Math.round(P[2]*(0.8+0.4*Math.random())*100)/100,q0=Math.round(P[3]*(0.8+0.4*Math.random()));
 return Object.assign(C,{good:P[0],unit:P[1],p0,q0,qunit:P[4],pa:p0*(1+C.x/100),qa:q0*(1+C.dq/100),dp:p0<1?3:2});}
const levelText=L=>`The ${L.good} market is perfectly competitive and in equilibrium at p₀ = $${f(L.p0)} per ${L.unit} and q₀ = ${f(L.q0)} ${L.qunit}. At this equilibrium the price elasticity of demand is ${L.eD} and the price elasticity of supply is ${L.eS}. ${L.verb}.`;
const pctSol=C=>`ε<sub>D</sub>·x ≈ ${C.s}% + ε<sub>S</sub>·x → x ≈ ${C.s}%/(${C.eD} − ${C.eS}) = ${f(C.x)}%`;

const S18={id:'S18',name:'Competitive equilibrium',short:'Competitive eq.',prereq:['S3','S5'],class:'Class 7',
 intro:'Every consumer and every firm takes the price as given. Each consumer sets marginal valuation equal to the price, each firm sets price equal to marginal cost, and the price adjusts until total consumption equals total production.',
 micros:[
 {id:'S18a',name:'Market demand from valuations',explain:'Each consumer solves max v(q) − pq: v′(q) = p. With v(q) = aq − q²/2 that gives q = a − p. Market demand adds the quantities: D(p) = n(a − p).',
  gen:()=>{const n=pick([20,50,100,200,500]),a=R(4,24),p=R(1,a-1);const Q=n*(a-p);
   return NQ(`There are ${n} consumers, each with valuation v(q) = ${a}q − q²/2 for the good. At price p = ${p}, what is the total quantity demanded?`,Q,`v′(q) = ${a} − q = ${p} → q = ${a-p} each. D(${p}) = ${n} × ${a-p} = <b>${f(Q)}</b>`,[a-p,n*(a-p)/2,n*p,n*a-p,n*(a+p)]);}},
 {id:'S18b',name:'Market supply from costs',explain:'Each firm solves max pq − c(q): p = c′(q). Market supply adds the firms\' quantities at each price.',
  gen:()=>{const m=pick([20,50,100,200,500]),d=pick([1,0.5,2]),p=R(2,20);const Q=m*p/d;
   return NQ(`There are ${m} firms, each with cost c(q) = ${costStr(d)}. At price p = ${p}, what is the total quantity supplied?`,Q,`p = c′(q) = ${mcStr(d)} → q = ${f(p/d)} each. S(${p}) = ${m} × ${f(p/d)} = <b>${f(Q)}</b>`,[m*p*d,p/d,m*p,m*p/(2*d),m*p/d/2+m]);}},
 {id:'S18c',name:'Solving for the equilibrium',explain:'Set D(p*) = S(p*) and solve for p*. Then q<sup>d</sup> = q<sup>s</sup> = D(p*).',
  gen:()=>{const E=compPop(),ask=pick(['price','total','each']);const ans=ask==='price'?E.p:ask==='total'?E.Q:E.qi;
   const qs={price:'What is the competitive equilibrium price?',total:'What total quantity is traded in equilibrium?',each:'In equilibrium, how much does each consumer buy?'}[ask];
   const wrongP=E.n*E.a/(E.n+E.m*E.d),half=E.a/2;
   const dist={price:[half,wrongP,E.a-E.p,E.n*E.a/(E.n+E.m)],total:[E.n*(E.a-half),E.n*(E.a-wrongP),E.m*E.p*E.d,E.qi],each:[E.a-half,E.a-wrongP,E.p,E.Q/E.m]}[ask];
   return NQ(`${E.n} identical consumers each have v(q) = ${E.a}q − q²/2; ${E.m} identical firms each have c(q) = ${costStr(E.d)}. Everyone takes the price as given. ${qs}`,ans,
    `D(p) = ${E.n}(${E.a} − p), S(p) = ${E.m}·p${E.d===1?'':E.d===0.5?'·2':'/2'}. Set equal → p* = ${f(E.p)}${ask==='price'?'':`; ${ask==='total'?`q* = ${E.n} × ${f(E.qi)}`:`each buys ${E.a} − ${f(E.p)}`}`} = <b>${f(ans)}</b>`,dist);}},
 {id:'S18d',name:'Residual demand facing one firm',explain:'If others supply X, one firm selling x faces P̃(x) = P(X + x). ε<sub>P̃</sub> = P̃′(x)·x/P̃(x), and ε<sub>D̃</sub> = 1/ε<sub>P̃</sub>. Big |ε<sub>D̃</sub>| means price-taking is a good approximation.',
  gen:()=>{const n=pick([100,200,500,1000]),a=R(2,12),x0=R(1,6);const X=Math.round(n*a*pick([0.3,0.4,0.5,0.6]))-x0;const Pt=a-(X+x0)/n,eP=-(x0/n)/Pt,eD=1/eP;
   return NQ(`Market inverse demand is P(Q) = ${a} − Q/${n}. The other firms supply ${f(X)} units in total, so if our firm sells x, its residual inverse demand is P̃(x) = ${a} − (${f(X)} + x)/${n}. What is the elasticity of residual demand, ε<sub>D̃</sub>, at x = ${x0}?`,eD,
    `P̃(${x0}) = ${f(Pt,4)}, P̃′ = −1/${n}. ε<sub>P̃</sub> = −(${x0}/${n})/${f(Pt,4)} = ${f(eP,4)}. ε<sub>D̃</sub> = 1/ε<sub>P̃</sub> = <b>${f(eD)}</b>`,[eP,-n,-Pt*n/(X+x0),-eD*x0,eD/x0]);}},
 {id:'S18e',name:'Key ideas',explain:'Price-taking, aggregation, and what an equilibrium requires.'}],
 integ:[
  ()=>{const n=pick([50,100,200,500]),d=pick([1,0.5,2]),a=R(4,20);const E={n,m:n,d,a};const p=n*a/(n+n/d),x=p/d;const gap=100/(d*n);
   return NQ(`${n} identical consumers each have v(q) = ${a}q − q²/2; ${n} identical firms each have c(q) = ${costStr(d)}. At the competitive equilibrium, one firm considers its effect on the price. Using MR = P̃(1 + 1/ε<sub>D̃</sub>), by about what percent does price-taking overstate this firm's marginal revenue?`,gap,
    `p* = ${f(p)}, each firm sells ${f(x)}. P̃(x) = ${a} − (others + x)/${n}, so ε<sub>P̃</sub> = −(${f(x)}/${n})/${f(p)} = −${f(1/(d*n),4)}. 1/|ε<sub>D̃</sub>| = |ε<sub>P̃</sub>| = <b>${f(gap,3)}%</b>`,[100/n===gap?100/(2*n):100/n,100*d/n===gap?200/n:100*d/n,1/(d*n)*10,gap*2,gap*3],{dp:3,pct:true});},
  ()=>{const E=compPop();const cs=E.n*E.qi**2/2;
   return NQ(`${E.n} identical consumers each have v(q) = ${E.a}q − q²/2; ${E.m} identical firms each have c(q) = ${costStr(E.d)}. Everyone takes the price as given. What is total consumers' surplus in the competitive equilibrium?`,cs,
    `p* = ${f(E.p)}; each consumer buys ${f(E.qi)} and gets v(q) − pq = ${f(E.qi)}²/2 = ${f(E.qi**2/2)}. Total = ${E.n} × ${f(E.qi**2/2)} = <b>${f(cs)}</b>`,[cs*2,E.qi**2/2,E.n*E.qi*E.p,E.n*(E.a/2)**2/2]);}]};

const S19={id:'S19',name:'Supply shifts and elasticities',short:'Supply shifts',prereq:['S8','S18'],class:'Class 7 / Week 4',
 intro:'When supply shifts by a known percentage at every price, the two elasticities tell you approximately how much the equilibrium price and quantity move. Equate the demand approximation with the shifted-supply approximation and solve.',
 micros:[
 {id:'S19a',name:'Percent change in price',explain:'Along demand: %Δq ≈ ε<sub>D</sub>·%Δp. Along new supply: %Δq ≈ shift + ε<sub>S</sub>·%Δp. Equate: %Δp ≈ shift/(ε<sub>D</sub> − ε<sub>S</sub>).',
  gen:()=>{const C=shiftCase();return NQ(`In a competitive market the price elasticity of demand is ${C.eD} and the price elasticity of supply is ${C.eS} at the current equilibrium. ${C.verb}. Approximately what is the percent change in the equilibrium price?`,C.x,`${pctSol(C)}. <b>${f(C.x)}%</b>`,[C.s/(C.eD+C.eS),-C.x,C.s/C.eD,C.s*(C.eD-C.eS),C.s/C.eS],{pct:true,allowNeg:true});}},
 {id:'S19b',name:'Percent change in quantity',explain:'Find %Δp first, then move along the (unshifted) demand curve: %Δq ≈ ε<sub>D</sub>·%Δp = ε<sub>D</sub>·shift/(ε<sub>D</sub> − ε<sub>S</sub>).',
  gen:()=>{const C=shiftCase();return NQ(`The price elasticity of demand is ${C.eD} and the price elasticity of supply is ${C.eS}. ${C.verb}. Approximately what is the percent change in the equilibrium quantity?`,C.dq,`${pctSol(C)}. %Δq ≈ ${C.eD} × ${f(C.x)}% = <b>${f(C.dq)}%</b>`,[C.s,C.eS*C.x,C.eD*C.s,C.s-C.dq,-C.dq],{pct:true,allowNeg:true});}},
 {id:'S19c',name:'New price and quantity',explain:'Turn the percent changes into levels: p<sub>a</sub> ≈ p₀(1 + %Δp), q<sub>a</sub> ≈ q₀(1 + %Δq).',
  gen:()=>{const L=levelCase();const ask=pick(['price','quantity']);const ans=ask==='price'?L.pa:L.qa;
   const dist=ask==='price'?[L.p0*(1-L.x/100),L.p0*(1-L.s/100),L.p0*(1+L.s/100/(L.eD+L.eS)),L.p0*(1+L.s/100/L.eD)]:[L.q0*(1+L.s/100),L.q0*(1-L.dq/100),L.q0*(1+L.eS*L.x/100),L.q0*(1+L.eD*L.s/100)];
   return NQ(`${levelText(L)} Approximately what is the new equilibrium ${ask}?`,ans,`${pctSol(L)}; %Δq ≈ ${L.eD} × ${f(L.x)}% = ${f(L.dq)}%. ${ask==='price'?`p<sub>a</sub> ≈ ${f(L.p0)} × ${f(1+L.x/100,4)} = <b>$${f(L.pa,L.dp)}</b>`:`q<sub>a</sub> ≈ ${f(L.q0)} × ${f(1+L.dq/100,4)} = <b>${f(L.qa)}</b>`}`,dist,{dp:ask==='price'?L.dp:2});}},
 {id:'S19d',name:'Change in consumers\' surplus',explain:'Approximate the CS change by the area between the old and new prices, left of demand: rectangle plus triangle, |p<sub>a</sub> − p₀|·(q₀ + q<sub>a</sub>)/2.',
  gen:()=>{const L=levelCase();const dP=Math.abs(L.pa-L.p0),cs=dP*(L.q0+L.qa)/2,lost=L.s<0;
   return NQ(`${levelText(L)} Approximately how much ${lost?'consumers\' surplus is lost':'do consumers gain in surplus'} per period (price × quantity units)?`,cs,
    `p<sub>a</sub> ≈ ${f(L.pa,3)}, q<sub>a</sub> ≈ ${f(L.qa)}. ΔCS ≈ ${f(dP,3)} × ${f(lost?L.qa:L.q0)} + ½ × ${f(dP,3)} × ${f(Math.abs(L.q0-L.qa))} = <b>${f(cs)}</b>`,[dP*L.qa,dP*L.q0,0.5*dP*Math.abs(L.q0-L.qa),Math.abs(L.pa*L.qa-L.p0*L.q0)]);}},
 {id:'S19e',name:'Key ideas',explain:'Shifts versus movements along a curve, and what the elasticities do.'}],
 integ:[
  ()=>{const L=levelCase();const ch=L.pa*L.qa-L.p0*L.q0;
   return NQ(`${levelText(L)} Approximately how much does total consumer spending change (new spending minus old)?`,ch,`p<sub>a</sub> ≈ ${f(L.pa,3)}, q<sub>a</sub> ≈ ${f(L.qa)}. Spending: ${f(L.p0*L.q0)} → ${f(L.pa*L.qa)}. Change <b>${f(ch)}</b>`,[L.pa*L.qa,-ch,(L.pa-L.p0)*L.q0,Math.abs(L.pa-L.p0)*(L.q0+L.qa)/2],{allowNeg:true});},
  ()=>{let C;do{C=shiftCase(-1);}while(Math.abs(C.x)<1);return NQ(`The price elasticity of demand for a good is ${C.eD}. ${C.verb}, and the equilibrium price rises by about ${f(C.x)}%. Using the elasticity approximations, what is the price elasticity of supply?`,C.eS,`ε<sub>D</sub> − ε<sub>S</sub> ≈ shift/%Δp = ${C.s}/${f(C.x)} = ${f(C.s/C.x,3)} → ε<sub>S</sub> ≈ ${C.eD} − (${f(C.s/C.x,3)}) = <b>${f(C.eS)}</b>`,[C.eD+C.s/C.x,-C.eS,C.s/C.x,C.eS*2,C.eS+0.5].filter(v=>v>0),{dp:2});}]};

const S20={id:'S20',name:'Productivity and employment (Jevons)',short:'Jevons',prereq:['S18','S8'],class:'Classes 7–8',
 intro:'Office tasks are made by workers hired at wage w, each producing α tasks a day, with demand D(p) = Ap<sup>−ε</sup> (ε &gt; 0). A productivity gain cuts the price of a task; whether employment rises depends on whether demand is elastic.',
 micros:[
 {id:'S20a',name:'The price of a task',explain:'A task needs 1/α worker-days, so it costs w/α to make. Supply of worker-days is perfectly elastic at w, so supply of tasks is perfectly elastic at p = w/α.',
  gen:()=>{const al=pick([2,3,4,5,6,8,10]),w=pick([120,150,180,200,240,300,360,400]);return NQ(`Each worker-day costs a wage of $${w} and produces α = ${al} completed tasks. Worker-days are supplied perfectly elastically at that wage. At what price per task is the supply of tasks perfectly elastic?`,w/al,`Each task takes 1/${al} of a worker-day: p = w/α = ${w}/${al} = <b>$${f(w/al)}</b>`,[w*al,w,w/(2*al),w/al+al]);}},
 {id:'S20b',name:'Equilibrium tasks',explain:'With supply flat at w/α, equilibrium is q* = D(w/α) = A(w/α)<sup>−ε</sup> = Aw<sup>−ε</sup>α<sup>ε</sup>.',
  gen:()=>{const al=pick([2,4,5]),p=pick([2,4,5,10]),w=p*al,eps=pick([0.5,1,1.5,2]),A=pick([1e4,4e4,1e5,1e6]);const q=A*p**-eps;
   return NQ(`Demand for office tasks is D(p) = ${f(A)}·p^(−${eps}). Workers earn $${w} per day and each produces α = ${al} tasks; worker-days are supplied perfectly elastically. How many tasks are completed per day in equilibrium?`,q,`p = w/α = ${p}. q* = ${f(A)} × ${p}^(−${eps}) = <b>${f(q)}</b>`,[A*w**-eps,q/al,q*al,A/p,A*p**-(eps+1)]);}},
 {id:'S20c',name:'Equilibrium employment',explain:'Producing q tasks takes L = q/α worker-days, so L*(α) = Aw<sup>−ε</sup>α<sup>ε−1</sup>.',
  gen:()=>{const al=pick([2,4,5]),p=pick([2,4,5,10]),w=p*al,eps=pick([0.5,1.5,2]),A=pick([1e4,4e4,1e5,1e6]);const q=A*p**-eps,L=q/al;
   return NQ(`Demand for office tasks is D(p) = ${f(A)}·p^(−${eps}). Workers earn $${w} per day and each produces α = ${al} tasks; worker-days are supplied perfectly elastically. How many worker-days are employed in equilibrium?`,L,`p = ${w}/${al} = ${p}; q* = ${f(A)} × ${p}^(−${eps}) = ${f(q)}. L* = q*/α = <b>${f(L)}</b>`,[q,q*al,A*w**-eps,L*2]);}},
 {id:'S20d',name:'Employment response to productivity',explain:'The elasticity of L* with respect to α is ε − 1: a 1% rise in α cuts the price about 1%, raises tasks about ε%, and each task needs about 1% less labor.',
  gen:()=>{const eps=pick([0.4,0.5,0.6,0.8,1.2,1.5,2,2.5,3]),x=pick([1,2,3,4,5]);const ans=(eps-1)*x;
   return NQ(`Demand for a service is D(p) = Ap^(−${eps}), and it is produced by workers paid a fixed wage, each producing α units a day. Productivity α rises by ${x}%. Approximately what is the percent change in employment in the industry?`,ans,`Elasticity of L* with respect to α is ε − 1 = ${f(eps-1)}. %ΔL ≈ ${f(eps-1)} × ${x}% = <b>${f(ans)}%</b>`,[eps*x,(1-eps)*x,-x,x,eps*x-2*x].filter(v=>Math.abs(v-ans)>1e-9),{pct:true,allowNeg:true});}},
 {id:'S20e',name:'Rise, fall, or no change?',explain:'Employment rises with productivity if ε &gt; 1 (elastic), falls if ε &lt; 1, and is unchanged at ε = 1.',
  gen:()=>{const eps=pick([0.3,0.5,0.7,0.9,1,1,1.1,1.4,2,3]);const job=pick(['legal document review','translation','radiology reads','tax preparation','code review','data entry']);const ans=eps>1?'Employment rises':eps<1?'Employment falls':'Employment is unchanged';
   return CQ(`Demand for ${job} has constant elasticity: D(p) = Ap^(−${eps}). AI tools double how many tasks each worker completes per day, and the wage doesn't change. What happens to employment in ${job}?`,ans,['Employment rises','Employment falls','Employment is unchanged'].filter(x=>x!==ans),`<b>${ans}.</b> L* ∝ α<sup>ε−1</sup> with ε − 1 = ${f(eps-1)}.`);}},
 {id:'S20f',name:'Key ideas',explain:'Why the Jevons paradox isn\'t a paradox.'}],
 integ:[
  ()=>{const p0=pick([4,5,8,10]),al0=pick([2,4,5]),k=pick([2,4]),w=p0*al0,eps=pick([0.5,1.5,2]),A=pick([1e4,1e5,1e6]);const al1=al0*k;const L=a=>A*(w/a)**-eps/a;const ch=L(al1)-L(al0);
   return NQ(`Demand for office tasks is D(p) = ${f(A)}·p^(−${eps}). The wage is $${w} per worker-day, supplied perfectly elastically. Productivity rises from α = ${al0} to α = ${al1} tasks per worker-day. By how much does equilibrium employment (worker-days) change?`,ch,`L*(α) = A(w/α)<sup>−ε</sup>/α. L*(${al0}) = ${f(L(al0))}, L*(${al1}) = ${f(L(al1))}. Change <b>${f(ch)}</b>`,[A*(w/al1)**-eps-A*(w/al0)**-eps,-ch,L(al1),ch/k],{allowNeg:true});},
  ()=>{const eps=pick([0.25,0.5,0.75,1.25,1.5,2,3]);return NQ(`Tasks are produced by workers at a fixed wage w, each producing α tasks, and demand is D(p) = Ap^(−${eps}). What is the elasticity of equilibrium employment L* with respect to α?`,eps-1,`L* = Aw<sup>−ε</sup>α<sup>ε−1</sup>, a power function: elasticity = ε − 1 = <b>${f(eps-1)}</b>`,[eps,1-eps,-eps,eps+1,-1],{allowNeg:true});}]};

const S21={id:'S21',name:'Competition and surplus maximization',short:'Efficiency',prereq:['S18','S12'],class:'Class 8',
 intro:'Maximizing gains from trade subject to feasibility gives three conditions: every consumer\'s marginal valuation equals ρ, every firm\'s marginal cost equals ρ, and the market clears. These match the equilibrium conditions with p = ρ, the marginal social value of the good.',
 micros:[
 {id:'S21a',name:'Splitting a fixed supply between consumers',explain:'Gains from trade are largest when marginal valuations are equal: v₁′(q₁) = v₂′(q₂), with q₁ + q₂ = Q.',
  gen:()=>{const a2=R(6,20),a1=a2+R(1,8),Q=(a1-a2)+2*R(1,8);const q1=(Q+a1-a2)/2;
   return NQ(`Two consumers have valuations v₁(q) = ${a1}q − q²/2 and v₂(q) = ${a2}q − q²/2. There are ${Q} units in total. To maximize gains from trade, how many units should consumer 1 get?`,q1,`Equal marginal valuations: ${a1} − q₁ = ${a2} − (${Q} − q₁) → q₁ = (${Q} + ${a1-a2})/2 = <b>${f(q1)}</b>`,[Q/2,Q*a1/(a1+a2),Q+a1-a2,a1-a2,Q-(a1-a2)]);}},
 {id:'S21b',name:'Splitting production between firms',explain:'Total cost is lowest when marginal costs are equal: c₁′(q₁) = c₂′(q₂), with q₁ + q₂ = Q.',
  gen:()=>{const [d1,d2]=shuffle([1,0.5,2]).slice(0,2),Q=pick([12,18,24,30,36,60]);const q1=Q*d2/(d1+d2);
   return NQ(`Firm 1 has cost c₁(q) = ${costStr(d1)} and firm 2 has cost c₂(q) = ${costStr(d2)}. Together they must produce ${Q} units. To make them at the lowest total cost, how many should firm 1 produce?`,q1,`Equal marginal costs: ${mcStr(d1).replace('q','q₁')} = ${mcStr(d2).replace('q','q₂')}, q₁ + q₂ = ${Q} → q₁ = <b>${f(q1)}</b>`,[Q/2,Q*d1/(d1+d2),Q,Q*d2/d1>Q?Q/3:Q*d2/d1]);}},
 {id:'S21c',name:'The marginal social value ρ',explain:'At the surplus-maximizing allocation, ρ is the common marginal valuation (and marginal cost): the value of one more unit of the good.',
  gen:()=>{const a2=R(6,20),a1=a2+R(1,8),Q=(a1-a2)+2*R(1,8);const q1=(Q+a1-a2)/2,rho=a1-q1;
   return NQ(`Two consumers have valuations v₁(q) = ${a1}q − q²/2 and v₂(q) = ${a2}q − q²/2, and ${Q} units are available. At the allocation that maximizes gains from trade, what is the marginal social value of the good, ρ?`,rho,`q₁ = ${f(q1)}, q₂ = ${f(Q-q1)}. ρ = ${a1} − ${f(q1)} = ${a2} − ${f(Q-q1)} = <b>${f(rho)}</b>`,[a1-Q/2,(a1+a2)/2,a2-Q/2,a1-q1/2]);}},
 {id:'S21d',name:'Key ideas',explain:'Why the competitive price is the marginal social value.'}],
 integ:[
  ()=>{let a1,a2,d1,d2,p;do{a2=R(6,16);a1=a2+R(1,8);[d1,d2]=[pick([1,0.5,2]),pick([1,0.5,2])];p=(a1+a2)/(2+1/d1+1/d2);}while(p>=a2);
   return NQ(`Two price-taking consumers have v₁(q) = ${a1}q − q²/2 and v₂(q) = ${a2}q − q²/2. Two price-taking firms have c₁(q) = ${costStr(d1)} and c₂(q) = ${costStr(d2)}. What is the competitive equilibrium price (which equals ρ)?`,p,`D(p) = (${a1} − p) + (${a2} − p); S(p) = p/${f(d1)} + p/${f(d2)}. Equal at p* = ${a1+a2}/${f(2+1/d1+1/d2)} = <b>${f(p)}</b>`,[(a1+a2)/4,(a1+a2)/(2+d1+d2),(a1+a2)/2,(a1+a2)/3]);},
  ()=>{const a2=R(6,20),a1=a2+2*R(1,5),Q=(a1-a2)+2*R(1,8);const v=(a,q)=>a*q-q*q/2;const q1=(Q+a1-a2)/2;const g=v(a1,q1)+v(a2,Q-q1)-v(a1,Q/2)-v(a2,Q/2);
   return NQ(`Two consumers have v₁(q) = ${a1}q − q²/2 and v₂(q) = ${a2}q − q²/2. A rule gives each of them ${f(Q/2)} of the ${Q} available units. How much would gains from trade rise if the units were reallocated to maximize them?`,g,`Efficient: q₁ = ${f(q1)}, q₂ = ${f(Q-q1)}. Gain = v₁(${f(q1)}) + v₂(${f(Q-q1)}) − v₁(${f(Q/2)}) − v₂(${f(Q/2)}) = <b>${f(g)}</b>`,[g*2,(a1-a2)*(q1-Q/2),(a1-a2)/2,g*4]);}]};

const S22={id:'S22',name:'Price floors in competitive markets',short:'Price floors',prereq:['S18','S12'],class:'Class 8',
 intro:'A floor p<sub>F</sub> above the competitive price p₀ cuts the quantity traded to what buyers want at p<sub>F</sub>. Sellers gain on the units still sold, lose on the units no longer sold, and the trades that disappear are the dead-weight loss.',
 micros:[
 {id:'S22a',name:'Quantity and excess supply',explain:'With p<sub>F</sub> &gt; p₀, buyers take q<sub>F</sub> = D(p<sub>F</sub>); sellers would like to sell S(p<sub>F</sub>). The gap is excess supply.',
  gen:()=>{const M=compLin(),pF=M.p0+R(1,Math.max(1,Math.floor(M.b*M.u*0.7)));const qF=M.D(pF),ex=M.S(pF)-qF,ask=pick(['q','ex']);
   return NQ(`In a competitive market, ${M.dStr} and ${M.sStr}. The government sets a price floor of p<sub>F</sub> = ${pF}. ${ask==='q'?'What quantity is traded?':'How large is the excess supply at the floor?'}`,ask==='q'?qF:ex,
    `p₀ = ${M.p0} &lt; ${pF}, so the floor binds. q<sub>F</sub> = D(${pF}) = ${f(qF)}${ask==='q'?'':`; S(${pF}) = ${f(M.S(pF))}; excess supply = ${f(M.S(pF))} − ${f(qF)}`} = <b>${f(ask==='q'?qF:ex)}</b>`,
    ask==='q'?[M.S(pF),M.q0,M.q0-qF,(M.S(pF)+qF)/2]:[M.S(pF),M.q0-qF,M.S(pF)-M.q0,qF]);}},
 {id:'S22b',name:'Dead-weight loss of a floor',explain:'Assuming the lowest-cost sellers make the units sold, DWL = ½(q₀ − q<sub>F</sub>)(p<sub>F</sub> − Pˢ(q<sub>F</sub>)).',
  gen:()=>{const M=compLin(),pF=M.p0+R(1,Math.max(1,Math.floor(M.b*M.u*0.7)));const qF=M.D(pF),dwl=0.5*(M.q0-qF)*(pF-M.Ps(qF));
   return NQ(`In a competitive market, ${M.dStr} and ${M.sStr}. A price floor is set at ${pF}. Assuming the units sold are made by the lowest-cost sellers, what is the dead-weight loss?`,dwl,`q₀ = ${f(M.q0)}, q<sub>F</sub> = ${f(qF)}, Pˢ(q<sub>F</sub>) = ${f(M.Ps(qF))}. DWL = ½ × ${f(M.q0-qF)} × (${pF} − ${f(M.Ps(qF))}) = <b>${f(dwl)}</b>`,[(M.q0-qF)*(pF-M.Ps(qF)),0.5*(M.q0-qF)*(pF-M.p0),(pF-M.p0)*qF,0.5*(M.S(pF)-qF)*(pF-M.Ps(qF))]);}},
 {id:'S22c',name:'Who gains and loses',explain:'CS falls by the area between p<sub>F</sub> and p₀ left of demand. PS changes by (p<sub>F</sub> − p₀)q<sub>F</sub> gained minus the surplus on lost trades.',
  gen:()=>{const M=compLin(),pF=M.p0+R(1,Math.max(1,Math.floor(M.b*M.u*0.7)));const qF=M.D(pF);const ps0=0.5*(M.p0-M.e)*M.q0,psF=(pF-M.e)*qF-M.g*qF*qF/(2*M.K),csL=0.5*M.b*(M.q0**2-qF**2)/M.K;const ask=pick(['ps','cs']);const ans=ask==='ps'?psF-ps0:csL;
   return NQ(`In a competitive market, ${M.dStr} and ${M.sStr}. A price floor is set at ${pF}; the units sold are made by the lowest-cost sellers. ${ask==='ps'?'By how much does producers\' surplus change (new minus old)?':'How much consumers\' surplus is lost?'}`,ans,
    ask==='ps'?`PS₀ = ½ × ${f(M.q0)} × ${f(M.p0-M.e)} = ${f(ps0)}. PS<sub>F</sub> = area between ${pF} and Pˢ up to ${f(qF)} = ${f(psF)}. Change <b>${f(ans)}</b>`:`CS loss = (${pF} − ${M.p0}) × ${f(qF)} + ½ × (${pF} − ${M.p0}) × ${f(M.q0-qF)} = <b>${f(ans)}</b>`,
    ask==='ps'?[(pF-M.p0)*qF,psF,-(psF-ps0),(pF-M.p0)*qF-0.5*(M.q0-qF)*(pF-M.Ps(qF))*2]:[(pF-M.p0)*qF,0.5*(pF-M.p0)*(M.q0-qF),(pF-M.p0)*M.q0,csL*2],{allowNeg:ask==='ps'});}},
 {id:'S22d',name:'Key ideas',explain:'What a floor does and what the welfare analysis assumes.'}],
 integ:[
  ()=>{const M=compLin(),pF=M.p0+R(1,Math.max(1,Math.floor(M.b*M.u*0.7)));const qF=M.D(pF),g=(pF-M.p0)*qF;
   return NQ(`In a competitive market, ${M.dStr} and ${M.sStr}. A price floor is set at ${pF}. How much do sellers gain from the higher price on the units that are still sold?`,g,`p₀ = ${M.p0}, q<sub>F</sub> = ${f(qF)}. (p<sub>F</sub> − p₀)q<sub>F</sub> = ${pF-M.p0} × ${f(qF)} = <b>${f(g)}</b>`,[(pF-M.p0)*M.q0,(pF-M.p0)*M.S(pF),0.5*(pF-M.p0)*qF,pF*qF]);},
  ()=>{let M,pF,qF,dps;do{M=compLin();pF=M.p0+R(1,Math.max(1,Math.floor(M.b*M.u*0.9)));qF=M.D(pF);dps=(pF-M.e)*qF-M.g*qF*qF/(2*M.K)-0.5*(M.p0-M.e)*M.q0;}while(Math.abs(dps)<0.01*M.q0);
   const ans=dps>0?'Yes: producers\' surplus rises':'No: producers\' surplus falls';
   return CQ(`In a competitive market, ${M.dStr} and ${M.sStr}. A price floor is set at ${pF}; the units sold are made by the lowest-cost sellers. Are producers better off as a group?`,ans,[dps>0?'No: producers\' surplus falls':'Yes: producers\' surplus rises','No change: the floor only moves surplus to consumers'],`<b>${ans}.</b> Gain on units sold ${f((pF-M.p0)*qF)}; net change in PS ${f(dps)}.`);}]};

// Class 8 Figure 6: CS, PS, tax revenue, DWL
function taxDiag(){const M=compLin();const t=Math.max(1,Math.round((M.b+M.g)*M.u/R(3,5)));const o=taxOut(M,t);const L=letters(4);const qmax=M.a*M.K/M.b;
 const regs=[{role:"consumers' surplus",pts:[[0,M.a],[0,o.pd],[o.qT,o.pd]]},{role:'tax revenue',pts:[[0,o.pd],[o.qT,o.pd],[o.qT,o.ps],[0,o.ps]]},{role:"producers' surplus",pts:[[0,o.ps],[o.qT,o.ps],[0,M.e]]},{role:'dead-weight loss',pts:[[o.qT,o.pd],[o.qT,o.ps],[M.q0,M.p0]]}];
 regs.forEach((r,i)=>r.label=L[i]);const k=R(0,3);const sup='<tspan baseline-shift="super" font-size="9">';
 const lines=[{f:M.Pd,q0:0,q1:qmax,cls:'dem',label:'Pᵈ',lq:qmax*0.85},{f:M.Ps,q0:0,q1:Math.min(qmax*0.95,(M.a-M.e)*M.K/M.g),cls:'mc',label:'Pˢ',lq:Math.min(qmax*0.9,(M.a-M.e)*M.K/M.g)}];
 return CQ(`${diag({qmax,pmax:M.a*1.05,lines,regions:regs,hl:[{p:o.pd,q:o.qT,label:`p${sup}d</tspan>`},{p:o.ps,q:o.qT,label:`p${sup}s</tspan>`}],vl:[{q:o.qT,p:o.pd,label:'q<tspan baseline-shift="sub" font-size="9">T</tspan>'},{q:M.q0,p:M.p0,label:'q₀'}],alt:'Tax diagram with demand, supply, and four lettered regions'})}A specific tax t drives a wedge between the buyers' price p<sup>d</sup> and the sellers' price p<sup>s</sup>, and q<sub>T</sub> units are traded. Which region is <b>${regs[k].role}</b>?`,
  `Region ${L[k]}`,L.filter((_,i)=>i!==k).map(x=>`Region ${x}`),`<b>Region ${L[k]}.</b> CS: under Pᵈ above p<sup>d</sup>. Revenue T = t·q<sub>T</sub>: between p<sup>d</sup> and p<sup>s</sup>. PS: above Pˢ below p<sup>s</sup>. DWL: between the curves from q<sub>T</sub> to q₀.`);}
const S23={id:'S23',name:'A specific tax in a competitive market',short:'Specific tax',prereq:['S18','S12'],class:'Class 8',
 intro:'A tax of t per unit makes buyers pay p<sup>d</sup> and sellers keep p<sup>s</sup> = p<sup>d</sup> − t. The quantity falls to where the wedge between the inverse demand and inverse supply curves equals t. Who bears the tax depends on the curves, not on who sends the check.',
 micros:[
 {id:'S23a',name:'Quantity with a tax: the wedge',explain:'Find q<sub>T</sub> from Pᵈ(q<sub>T</sub>) − Pˢ(q<sub>T</sub>) = t.',
  gen:()=>{const M=compLin(),t=R(1,Math.max(1,Math.floor((M.b+M.g)*M.u*0.6)));const o=taxOut(M,t);
   return NQ(`In a competitive market, ${M.dStr} and ${M.sStr}. A tax of ${t} per unit is collected from sellers. What quantity is traded?`,o.qT,`Wedge: Pᵈ(q) − Pˢ(q) = ${t} → ${f(M.a-M.e)} − ${f(M.b+M.g)}q/${f(M.K)} = ${t} → q<sub>T</sub> = <b>${f(o.qT)}</b>`,[M.q0-t*M.K/M.b,M.q0-t*M.K/M.g,M.q0-t*M.K/(2*(M.b+M.g)),M.q0-t*M.K,M.q0]);}},
 {id:'S23b',name:'Buyers\' and sellers\' prices',explain:'p<sup>d</sup> = Pᵈ(q<sub>T</sub>) is what buyers pay; p<sup>s</sup> = Pˢ(q<sub>T</sub>) = p<sup>d</sup> − t is what sellers keep.',
  gen:()=>{const M=compLin(),t=R(1,Math.max(1,Math.floor((M.b+M.g)*M.u*0.6)));const o=taxOut(M,t),ask=pick(['pd','ps']);const ans=ask==='pd'?o.pd:o.ps;const sw=M.p0+M.g*t/(M.b+M.g);
   return NQ(`In a competitive market, ${M.dStr} and ${M.sStr}. A tax of ${t} per unit is imposed. What price ${ask==='pd'?'do buyers pay':'do sellers keep after paying the tax'}?`,ans,`q<sub>T</sub> = ${f(o.qT)}. p<sup>d</sup> = Pᵈ(${f(o.qT)}) = ${f(o.pd)}${ask==='ps'?`; p<sup>s</sup> = ${f(o.pd)} − ${t}`:''} = <b>${f(ans)}</b>`,
    ask==='pd'?[M.p0+t,M.p0+t/2,sw,M.p0]:[M.p0-t,M.p0-t/2,sw-t,M.p0]);}},
 {id:'S23c',name:'Incidence: who bears the tax',explain:'Consumers bear (p<sup>d</sup> − p₀) per unit and producers bear (p₀ − p<sup>s</sup>). Consumers\' share of the tax is (p<sup>d</sup> − p₀)/t.',
  gen:()=>{const M=compLin(),t=R(1,Math.max(1,Math.floor((M.b+M.g)*M.u*0.6)));const o=taxOut(M,t);const ask=pick(['share','total']);const sh=100*(o.pd-M.p0)/t,tot=(o.pd-M.p0)*o.qT;
   return NQ(`In a competitive market, ${M.dStr} and ${M.sStr}. A tax of ${t} per unit is collected from sellers. ${ask==='share'?'What percent of the tax do consumers bear?':'What is the total burden on consumers, (p<sup>d</sup> − p₀)q<sub>T</sub>?'}`,ask==='share'?sh:tot,
    `p₀ = ${M.p0}; q<sub>T</sub> = ${f(o.qT)}, p<sup>d</sup> = ${f(o.pd)}. ${ask==='share'?`(${f(o.pd)} − ${M.p0})/${t} = <b>${f(sh)}%</b>`:`(${f(o.pd)} − ${M.p0}) × ${f(o.qT)} = <b>${f(tot)}</b>`}`,
    ask==='share'?[100-sh,50,100,0].filter(v=>Math.abs(v-sh)>0.01):[(M.p0-o.ps)*o.qT,t*o.qT,(o.pd-M.p0)*M.q0,t*o.qT/2],ask==='share'?{pct:true}:{});}},
 {id:'S23d',name:'Revenue and dead-weight loss',explain:'Revenue T = t·q<sub>T</sub>. DWL = ½·t·(q₀ − q<sub>T</sub>): the trades worth more than they cost that no longer happen.',
  gen:()=>{const M=compLin(),t=R(1,Math.max(1,Math.floor((M.b+M.g)*M.u*0.6)));const o=taxOut(M,t),ask=pick(['rev','dwl']);
   return NQ(`In a competitive market, ${M.dStr} and ${M.sStr}. A tax of ${t} per unit is imposed. What is the ${ask==='rev'?'tax revenue':'dead-weight loss'}?`,ask==='rev'?o.rev:o.dwl,
    `q₀ = ${f(M.q0)}, q<sub>T</sub> = ${f(o.qT)}. ${ask==='rev'?`T = ${t} × ${f(o.qT)} = <b>${f(o.rev)}</b>`:`DWL = ½ × ${t} × ${f(M.q0-o.qT)} = <b>${f(o.dwl)}</b>`}`,
    ask==='rev'?[t*M.q0,o.dwl,t*o.qT/2,(o.pd-M.p0)*o.qT]:[t*(M.q0-o.qT),o.rev,0.25*t*(M.q0-o.qT),0.5*t*o.qT]);}},
 {id:'S23e',name:'Diagram: the tax regions (Class 8 figure)',explain:'CS above p<sup>d</sup>; revenue between p<sup>d</sup> and p<sup>s</sup> out to q<sub>T</sub>; PS below p<sup>s</sup>; DWL between the curves from q<sub>T</sub> to q₀.',gen:taxDiag},
 {id:'S23f',name:'Key ideas',explain:'Statutory versus economic incidence, and what the DWL measures.'}],
 integ:[
  ()=>{const N=pick([4000,5000,6000,8000]),X=pick([5,10,20]),r0=R(8,20)*100,s=pick([100,150,200,250,300]);const a=r0+N/X;const N2=N+pick([1000,2000,3000]);const ask=pick(['net','rise','zoning']);
   const base=`A town has ${f(N)} apartments, and zoning means supply can't change. Inverse demand for apartments is Pᵈ(q) = ${f(a)} − q/${X} (monthly rent).`;
   if(ask==='zoning')return NQ(`${base} The town instead changes zoning so the supply of apartments rises to ${f(N2)}. What is the new monthly rent?`,a-N2/X,`Supply is fixed at ${f(N2)}: rent = ${f(a)} − ${f(N2)}/${X} = <b>${f(a-N2/X)}</b>`,[r0,a-N/X-(N2-N)/X/2,r0-(N2-N)/X/2,a-N2/X-s]);
   return NQ(`${base} The town pays each renting household a subsidy of $${s} per month. ${ask==='net'?'What rent, net of the subsidy, does a renting household pay?':'By how much does the rent landlords receive rise?'}`,ask==='net'?r0:s,
    `Supply is perfectly inelastic, so demand shifts up by ${s} and the rent rises by the full ${s}: landlords get ${f(r0+s)}, renters pay ${f(r0+s)} − ${s} = ${f(r0)}. <b>${f(ask==='net'?r0:s)}</b>`,ask==='net'?[r0-s,r0+s,r0-s/2]:[s/2,0,2*s,s/4]);},
  ()=>{const M=compLin(),t=R(1,Math.max(1,Math.floor((M.b+M.g)*M.u*0.6)));const o=taxOut(M,t);
   return NQ(`In a competitive market, ${M.dStr} and ${M.sStr}. A tax of ${t} per unit is collected from buyers rather than sellers. What price do sellers receive?`,o.ps,`Same wedge as a tax on sellers: q<sub>T</sub> = ${f(o.qT)}, p<sup>s</sup> = Pˢ(${f(o.qT)}) = <b>${f(o.ps)}</b>. Who remits doesn't change incidence.`,[M.p0,M.p0-t,o.pd,M.p0-t/2]);}]};

const S24={id:'S24',name:'Shortages and queues',short:'Queues',prereq:['S19','S2'],class:'Week 4',
 intro:'If supply falls but the price can\'t rise, buyers want more than sellers offer. With first-come, first-served selling, lines grow until the full price (cash plus time) is high enough that buyers want only the quantity supplied, and the waiting time is a pure loss.',
 micros:[
 {id:'S24a',name:'Shortage under a ceiling',explain:'With the cash price held at p₀, buyers still demand q₀, while a supply cut of s% at every price leaves q<sup>s</sup> = (1 − s)q₀.',
  gen:()=>{const L=levelCase(-1);const qs=L.q0*(1+L.s/100),ask=pick(['qs','short']);
   return NQ(`${levelText(L)} The legislature makes it illegal to sell above the pre-shock price of $${f(L.p0)}. ${ask==='qs'?'What quantity is supplied?':'How large is the shortage?'}`,ask==='qs'?qs:L.q0-qs,
    `Demand hasn't shifted: q<sup>d</sup> = q₀ = ${f(L.q0)}. Supply at $${f(L.p0)} is ${f(1+L.s/100)} × ${f(L.q0)} = ${f(qs)}.${ask==='short'?` Shortage = ${f(L.q0)} − ${f(qs)}`:''} <b>${f(ask==='qs'?qs:L.q0-qs)}</b>`,
    ask==='qs'?[L.qa,L.q0,L.q0*(1-L.s/100),L.q0*(1+L.dq/100/2)]:[L.q0-L.qa,qs,L.q0*(-L.s/100)/2,L.qa-qs]);}},
 {id:'S24b',name:'The full price with queues',explain:'Lines grow until the full price p cuts quantity demanded to q<sup>s</sup>: (q<sup>s</sup> − q₀)/q₀ ≈ ε<sub>D</sub>·(p − p₀)/p₀. The time cost per unit is p − p₀.',
  gen:()=>{const L=levelCase(-1);const pf=L.p0*(1+L.s/100/L.eD),ask=pick(['full','time']);
   return NQ(`${levelText(L)} Sellers may not charge more than $${f(L.p0)} and sell first-come, first-served. Lines grow until the full price makes buyers want only the quantity supplied. ${ask==='full'?'What is the full price per unit?':'How much of the full price per unit is paid in time?'}`,ask==='full'?pf:pf-L.p0,
    `q<sup>s</sup> = ${f(1+L.s/100)}q₀, so ${L.s}% ≈ ${L.eD} × (p − ${f(L.p0)})/${f(L.p0)} → p ≈ $${f(pf,3)}${ask==='time'?`; time cost = ${f(pf,3)} − ${f(L.p0)}`:''}. <b>$${f(ask==='full'?pf:pf-L.p0,L.dp)}</b>`,
    ask==='full'?[L.pa,L.p0*(1-L.s/100),L.p0*(1-L.s/100/L.eD),L.p0*(1+L.s/100*L.eD)]:[L.pa-L.p0,L.p0*(-L.s/100),L.p0*(-L.s/100)/(-L.eD)/2,pf],{dp:L.dp});}},
 {id:'S24c',name:'Minutes in line',explain:'Time cost per visit = (time cost per unit) × (units per visit). Minutes = that ÷ (value of time per hour) × 60.',
  gen:()=>{const w=pick([15,18,20,21,24,30,36]),g=pick([10,12,15]),tc=pick([0.25,0.5,0.75,1,1.25,1.4,1.5,2]);const mins=tc*g/w*60;
   return NQ(`Drivers value their time at $${w} per hour and buy ${g} gallons per visit. In the gas lines, the time cost works out to $${f(tc)} per gallon. How many minutes does each driver wait per visit?`,mins,`Per visit: ${f(tc)} × ${g} = $${f(tc*g)}. Minutes = ${f(tc*g)}/${w} × 60 = <b>${f(mins)}</b>`,[tc*g/w,tc/w*60,tc*w/g,tc*60/g*w/10]);}},
 {id:'S24d',name:'The value of time lost',explain:'Waiting is a pure loss, not a transfer: total loss = (time cost per unit) × (quantity sold).',
  gen:()=>{const L=levelCase(-1);const qs=L.q0*(1+L.s/100),pf=L.p0*(1+L.s/100/L.eD),loss=(pf-L.p0)*qs;
   return NQ(`${levelText(L)} The cash price is held at $${f(L.p0)} and sellers serve first-come, first-served, so queues form until buyers want only what is supplied. What is the total value of time lost in line per period (price × quantity units)?`,loss,
    `q<sup>s</sup> = ${f(qs)}; full price ≈ ${f(pf,3)}, so time cost ≈ ${f(pf-L.p0,3)} per unit. Loss = ${f(pf-L.p0,3)} × ${f(qs)} = <b>${f(loss)}</b>`,[(pf-L.p0)*L.q0,(L.pa-L.p0)*qs,(pf-L.p0)*(L.q0-qs),pf*qs]);}},
 {id:'S24e',name:'Key ideas',explain:'Why queues can leave consumers worse off than the free-market price.'}],

const fmtAns=(p,x)=>f(x,p.dp||2);
const isIntStr=s=>!/\./.test(s);
// Shape-matched near misses: same sign, same "roundness" as the answer, 8–30% away
function nearMisses(p){const a=p.ans,A=fmtAns(p,a),int=isIntStr(A),out=[];const dec=(A.split('.')[1]||'').length;
 const rnd=x=>int?Math.round(x):Math.round(x*10**dec)/10**dec;const mags=[0.1,0.15,0.2,0.25,0.3,-0.1,-0.15,-0.2,-0.25,-0.3];
 shuffle(mags).forEach(m=>{let x=rnd(a*(1+m));if(int&&Math.abs(a)<12)x=a+Math.sign(m)*R(1,3);if(a===0)x=(p.allowNeg&&m<0?-1:1)*R(1,5);if(Math.sign(x)===Math.sign(a)||a===0)out.push(x);});return out;}
function mkOpts(p){const A=fmtAns(p,p.ans);const seen=new Set([A]);const chosen=[];const near=x=>Math.abs(x-p.ans)<=Math.max(0.011,Math.abs(p.ans)*0.003);
 const ok=x=>isFinite(x)&&!near(x)&&!seen.has(fmtAns(p,x))&&(x>=0||p.ans<0||p.allowNeg);const take=x=>{seen.add(fmtAns(p,x));chosen.push(x);};
 shuffle(p.dist||[]).forEach(x=>{if(chosen.length<3&&ok(x))take(x);});
 nearMisses(p).forEach(x=>{if(chosen.length<3&&ok(x))take(x);});
 [p.ans*2,p.ans/2,p.ans*1.5].forEach(x=>{if(chosen.length<3&&ok(x))take(x);});
 // No giveaways: the right answer must not be the only whole number, only decimal, or only negative
 const S=x=>fmtAns(p,x),intA=isIntStr(A),negA=p.ans<0;
 // Repair: if all wrong choices differ from the answer in shape, swap one for a same-shape near miss (checks both rules together)
 const shapeOK=arr=>!(arr.length&&arr.every(x=>isIntStr(S(x))!==intA))&&!(arr.length&&arr.every(x=>(x<0)!==negA));
 if(!shapeOK(chosen)){const pool=[...nearMisses(p),...nearMisses(p)];let done=false;
  for(let i=chosen.length-1;i>=0&&!done;i--)for(const x of pool){if(!ok(x))continue;const trial=chosen.slice();trial[i]=x;if(shapeOK(trial)){seen.delete(S(chosen[i]));chosen[i]=x;seen.add(S(x));done=true;break;}}}
 const opts=shuffle([A,...chosen.map(S)]);return {opts,ans:opts.indexOf(A)};}

const FW=[0.40255,1.18385,3.173,15.69105,7.1949,0.5345,1.4604,0.0046,1.54575,0.1192,1.01925,1.9395,0.11,0.29605,2.2698,0.2315,2.9898,0.51655,0.6621];

const clampD=d=>Math.min(10,Math.max(1,d));
const retr=(t,S)=>Math.pow(1+FACTOR*t/S,DECAY);

const nextD=(D,g)=>{const dp=D-FW[6]*(g-3)*(10-D)/9;return clampD(FW[7]*D0(4)+(1-FW[7])*dp);};

const sShort=(S,g)=>S*Math.exp(FW[17]*(g-3+FW[18]));

function schedule(c,g,scale=1){const t=now();
 if(c.state==='new'){c.S=FW[g-1];c.D=D0(g);}

 const rows=[...s.micros.map(m=>[m.id,m.name]),...s.integ.map((_,i)=>[s.id+'.i'+(i+1),`Putting it together ${i+1}`])].map(([id,nm])=>{const c=ST.cards[id];return `<li><span>${esc(nm)}</span>${c?`<span class="when">${c.state==='review'?`next ${when(c.due)}`:c.state==='new'?'new':'relearning'}${c.lapses>=LEECH?', extra help':''}</span>`:''}</li>`;}).join('');
 const enc=Object.entries(encOf(s.id)).sort((a,b)=>b[1]-a[1]);
 const ov=document.createElement('div');ov.className='overlay';ov.innerHTML=`<div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(s.name)}">

  <p class="pre">${s.prereq.length?`Builds on: ${s.prereq.filter(p=>SK[p]).map(p=>`<span class="${learned(p)?'ok':''}">${esc(SK[p].name)}</span>`).join(', ')}`:'No prerequisites.'}</p>
  ${enc.length?`<p class="pre">Practices along the way: ${enc.map(([k,w])=>`${esc(SK[k].short||SK[k].name)} (${Math.round(w*100)}%)`).join(', ')}</p>`:''}
  ${hardSkill(s.id)?'<p class="pre">You find this one hard, so it gets its own reviews with reminders until it settles.</p>':''}
